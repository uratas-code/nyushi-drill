<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Nunito:wght@600;800;900&family=Fredoka:wght@600;700&display=swap">
<style>
/* Layout: ステッカー風のポップな一列カラム。太いフチ＋ずらした影、分野ごとにカラー */
:root{
  --bg:#EAF4FF; --dot:#CFE3FA; --card:#FFFFFF; --ink:#1B1E3A; --muted:#5C6385; --edge:#1B1E3A;
  --g:#FF5C8A; --v:#2FA8FF; --o:#FFB800; --c:var(--g);
  --c-soft:#FFE3EC;
  --ok:#14B06A; --ok-soft:#DDF7EA; --ng:#FF4D4D; --ng-soft:#FFE4E4;
  --btn-ink:#FFFFFF;
  --f-jp:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",Meiryo,sans-serif;
  --f-en:"Nunito","Segoe UI",system-ui,sans-serif;
  --f-num:"Fredoka","Nunito",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#161A2E; --dot:#22284A; --card:#232945; --ink:#F2F4FF; --muted:#A9B0D4; --edge:#060815;
  --g:#FF7AA2; --v:#5BBEFF; --o:#FFC933; --c-soft:#3A2440;
  --ok:#3DD68C; --ok-soft:#173829; --ng:#FF6F6F; --ng-soft:#3E1D22; --btn-ink:#161A2E; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#161A2E; --dot:#22284A; --card:#232945; --ink:#F2F4FF; --muted:#A9B0D4; --edge:#060815;
  --g:#FF7AA2; --v:#5BBEFF; --o:#FFC933; --c-soft:#3A2440;
  --ok:#3DD68C; --ok-soft:#173829; --ng:#FF6F6F; --ng-soft:#3E1D22; --btn-ink:#161A2E; color-scheme:dark}
[data-cat="G"]{--c:var(--g)} [data-cat="V"]{--c:var(--v)} [data-cat="O"]{--c:var(--o)}
*{box-sizing:border-box}
body{background-color:var(--bg);background-image:radial-gradient(var(--dot) 2px,transparent 2.5px);background-size:22px 22px;
  color:var(--ink);font-family:var(--f-jp);font-weight:500;font-size:15px;line-height:1.7;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--v);outline-offset:3px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.subject{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.subject h1{margin:0;font-size:30px;font-weight:900;letter-spacing:.02em;text-wrap:balance;
  text-shadow:3px 3px 0 var(--g)}
.subject h1 b{font-family:var(--f-num);font-weight:700;color:var(--v);text-shadow:3px 3px 0 var(--o)}
.tag{font-size:12px;font-weight:900;background:var(--o);color:#1B1E3A;border:2px solid var(--edge);border-radius:999px;padding:2px 12px;transform:rotate(-4deg);box-shadow:2px 2px 0 var(--edge)}
.top small{font-family:var(--f-num);font-size:14px;background:var(--card);border:2px solid var(--edge);border-radius:999px;padding:2px 12px}
.lead{color:var(--muted);margin:0}
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.cat{background:var(--card);border:3px solid var(--edge);border-radius:20px;padding:16px 16px 14px;text-align:left;display:flex;flex-direction:column;gap:6px;min-width:0;
  box-shadow:5px 5px 0 var(--c);transition:transform .15s,box-shadow .15s;position:relative;overflow:hidden}
.cat::after{content:"";position:absolute;right:-24px;top:-24px;width:80px;height:80px;border-radius:50%;background:var(--c);opacity:.25}
.cat:hover{transform:translate(-2px,-3px) rotate(-.6deg);box-shadow:8px 8px 0 var(--c)}
.cat:active{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--c)}
.cat .k{font-family:var(--f-num);font-size:12px;font-weight:700;color:var(--c);letter-spacing:.12em;filter:brightness(.85)}
.cat .t{font-size:20px;font-weight:900}
.cat .d{font-size:13px;color:var(--muted)}
.meter{height:12px;background:var(--bg);border:2px solid var(--edge);border-radius:999px;position:relative;margin-top:6px;overflow:hidden}
.meter i{position:absolute;inset:0 auto 0 0;background:var(--c);border-radius:999px}
.cat .s{font-size:12px;color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{background:var(--card);border:3px solid var(--edge);border-radius:999px;padding:8px 20px;font-weight:700;box-shadow:3px 3px 0 var(--edge);transition:transform .1s,box-shadow .1s}
.btn:hover:not([disabled]){transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--edge)}
.btn:active:not([disabled]){transform:translate(3px,3px);box-shadow:0 0 0 var(--edge)}
.btn.primary{background:var(--g);color:#fff}
#mix.primary{background:linear-gradient(90deg,var(--g),var(--v))}
.btn[disabled]{opacity:.4;cursor:default;box-shadow:none}
.seg{display:inline-flex;border:3px solid var(--edge);border-radius:999px;overflow:hidden;box-shadow:3px 3px 0 var(--edge)}
.seg button{background:var(--card);border:0;padding:5px 16px;font-size:13px;font-weight:700}
.seg button+button{border-left:2px solid var(--edge)}
.seg button[aria-pressed="true"]{background:var(--o);color:#1B1E3A}
.panel{background:var(--card);border:3px solid var(--edge);border-radius:24px;padding:20px;box-shadow:6px 6px 0 var(--edge)}
.panel h2{margin:0 0 8px;font-size:18px;font-weight:900}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-size:14px;font-weight:700}
.bar{height:14px;background:var(--card);border:3px solid var(--edge);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:repeating-linear-gradient(45deg,var(--c) 0 10px,color-mix(in srgb,var(--c) 70%,#fff) 10px 20px);transition:width .35s cubic-bezier(.3,1.6,.5,1)}
.qno{display:inline-block;background:var(--c);color:#fff;font-family:var(--f-num);font-weight:700;padding:1px 10px;margin-right:8px;font-size:13px;border-radius:999px;border:2px solid var(--edge)}
[data-cat="O"] .qno{color:#1B1E3A}
.stem{font-family:var(--f-en);font-weight:800;font-size:21px;line-height:1.6;margin:14px 0 6px}
.stem .blank{display:inline-block;min-width:5.5em;background:var(--c-soft);border:2px dashed var(--c);border-radius:10px;text-align:center;font-family:var(--f-num);font-size:14px;color:var(--ink);line-height:1.8}
.ja{color:var(--muted);font-size:14px;margin:0}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
@media (max-width:520px){.choices{grid-template-columns:1fr}}
.ch{display:flex;align-items:center;gap:12px;background:var(--card);border:3px solid var(--edge);border-radius:16px;padding:10px 14px;text-align:left;font-family:var(--f-en);font-weight:800;font-size:17px;
  box-shadow:3px 3px 0 var(--edge);transition:transform .12s,box-shadow .12s;min-width:0}
.ch:hover:not([disabled]){transform:translate(-1px,-2px);box-shadow:4px 5px 0 var(--c)}
.oval{flex:none;width:30px;height:30px;border:2px solid var(--edge);border-radius:50%;display:grid;place-items:center;font-family:var(--f-num);font-size:14px;font-weight:700;background:var(--c);color:#fff}
[data-cat="O"] .oval{color:#1B1E3A}
.ch.right{background:var(--ok-soft);border-color:var(--ok);box-shadow:3px 3px 0 var(--ok)}
.ch.right .oval{background:var(--ok)}
.ch.wrong{background:var(--ng-soft);border-color:var(--ng);box-shadow:3px 3px 0 var(--ng);animation:shake .35s}
.ch.wrong .oval{background:var(--ng)}
.ch.sel.right{animation:pop .4s}
.ch[disabled]{cursor:default}
.ch[disabled]:not(.right):not(.wrong){opacity:.55}
.fb{margin-top:18px;border:3px solid var(--ok);border-radius:18px;background:var(--ok-soft);padding:12px 16px;animation:pop .35s}
.fb.ng{border-color:var(--ng);background:var(--ng-soft)}
.fb .v{font-weight:900;font-size:20px;display:flex;align-items:center;gap:8px}
.fb.ok .v{color:var(--ok)} .fb.ng .v{color:var(--ng)}
.fb p{margin:6px 0 0}
.fb .en{font-family:var(--f-en);font-weight:800;font-size:16px}
.mark{font-family:var(--f-num);font-size:26px;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff;border:2px solid var(--edge)}
.fb.ok .mark{background:var(--ok)} .fb.ng .mark{background:var(--ng)}
/* 並べ替え */
.build{min-height:60px;border:3px dashed var(--c);border-radius:16px;background:var(--bg);padding:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:14px;font-family:var(--f-en);font-weight:800;font-size:17px}
.build .fix{color:var(--muted)}
.build .ph{color:var(--muted);font-family:var(--f-jp);font-size:13px}
.pool{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{border:2px solid var(--edge);border-radius:12px;background:var(--card);padding:4px 14px;font-family:var(--f-en);font-weight:800;font-size:17px;box-shadow:2px 2px 0 var(--edge);transition:transform .1s}
.chip:hover:not([disabled]){transform:translateY(-2px) rotate(-2deg)}
.chip.used{opacity:.2;cursor:default;box-shadow:none}
.build .chip{background:var(--c);color:#fff;animation:pop .25s}
[data-cat="O"] .build .chip{color:#1B1E3A}
.kbd{font-size:12px;color:var(--muted)}
.score{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.score .big{font-family:var(--f-num);font-weight:700;font-size:56px;line-height:1;color:var(--g);text-shadow:3px 3px 0 var(--o)}
.miss{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;gap:10px}
.miss li{border:2px solid var(--edge);border-radius:14px;padding:10px 12px;min-width:0;background:var(--bg)}
.miss .en{font-family:var(--f-en);font-weight:800;font-size:16px}
.miss .en b{color:var(--ok)}
.miss .x{font-size:13px;color:var(--muted)}
footer{color:var(--muted);font-size:12px;text-align:center}
@keyframes pop{0%{transform:scale(.9)}60%{transform:scale(1.04)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
<style>
/* 日本史用の追加：時代ごとのカラーと設問ブロック */
:root{--ey:#B88A00;--ea:#F26A2E;--em:#0E9C8C;--ee:#E8457A;--ed:#7353F0;--ep:#2C8FE0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ea:#FF8F5C;--em:#2CC7B5;--ee:#FF7AA2;--ed:#9C85FF;--ep:#5BBEFF;--ey:#E6C340}}
:root[data-theme="dark"]{--ea:#FF8F5C;--em:#2CC7B5;--ee:#FF7AA2;--ed:#9C85FF;--ep:#5BBEFF;--ey:#E6C340}
[data-cat="A"]{--c:var(--ea)} [data-cat="B"]{--c:var(--em)} [data-cat="C"]{--c:var(--ee)} [data-cat="D"]{--c:var(--ed)} [data-cat="E"]{--c:var(--ep)}
.stem{font-family:var(--f-jp);font-weight:700;font-size:18px}
.stmts{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.stmt{display:flex;gap:10px;align-items:flex-start;background:var(--bg);border:2px solid var(--edge);border-radius:14px;padding:8px 12px;min-width:0}
.stmt .lb{flex:none;font-family:var(--f-num);font-weight:700;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--c);color:#fff;border:2px solid var(--edge)}
.stmt .tx{font-weight:700;min-width:0}
.ch{font-family:var(--f-jp);font-weight:700}
.choices.six{grid-template-columns:repeat(3,1fr)}
@media (max-width:520px){.choices.six{grid-template-columns:1fr 1fr}}
.choices.six .ch{white-space:nowrap;gap:8px;padding:10px}
@media (max-width:520px){.choices.six .ch{font-size:15px;padding:10px 8px}.choices.six .oval{width:26px;height:26px;font-size:13px}}
.fmt{display:inline-block;font-size:11px;font-weight:900;border:2px solid var(--edge);border-radius:999px;padding:0 8px;margin-left:6px;background:var(--o);color:#1B1E3A}
.era-yr{font-family:var(--f-num);font-size:12px;color:var(--muted)}
.subj-link{font-size:13px;font-weight:700;color:var(--ink);text-decoration:none;border:2px solid var(--edge);border-radius:999px;padding:2px 12px;background:var(--card)}
.subj-link:hover{background:var(--o);color:#1B1E3A}
.miss .en{font-family:var(--f-jp);font-weight:700}
.subject h1 b{font-family:var(--f-jp);font-weight:900}
</style>
<style>
/* ランク表示 */
.rankp{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.rk-body{flex:1;min-width:200px}
.rk-body h2{margin:0 0 2px}
.rk-body p{margin:4px 0}
.rk-meter i{background:linear-gradient(90deg,var(--o),var(--g))}
.rk-badge{flex:none;width:118px;height:118px;border-radius:50%;border:4px solid var(--edge);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;box-shadow:4px 4px 0 var(--edge);transform:rotate(-6deg);text-align:center;color:#1B1E3A}
.rk-badge .rk-en{font-family:var(--f-num);font-size:10px;letter-spacing:.12em;font-weight:700}
.rk-badge .rk-t{font-size:22px;font-weight:900;line-height:1.2}
.rk-badge .rk-st{font-size:12px;letter-spacing:1px}
.rk0{background:#E4E8F2}.rk1{background:#BFE6FF}.rk2{background:#C9F2DA}.rk3{background:#FFD873}.rk4{background:#FFB3CB}
.rk5{background:conic-gradient(#FFD873,#FFB3CB,#BFE6FF,#C9F2DA,#FFD873)}
.rk-session{display:flex;align-items:baseline;gap:10px;margin-top:12px;flex-wrap:wrap}
.rk-title{font-size:26px;font-weight:900;color:var(--ink);background:var(--o);border:3px solid var(--edge);border-radius:999px;padding:0 16px;box-shadow:3px 3px 0 var(--edge);transform:rotate(-2deg);display:inline-block;color:#1B1E3A}
.rk-up{margin-top:12px;font-weight:900;font-size:18px;color:var(--g);animation:pop .5s}

<script>
/* ===== 問題データ ===== */
const D={"cats": {"A": {"name": "青年期と人間の心", "k": "ADOLESCENCE", "yr": "青年期・心理", "d": "青年期の課題、マズロー・エリクソン・フロイト、防衛機制と葛藤"}, "B": {"name": "源流思想", "k": "ORIGINS", "yr": "ギリシア・宗教・中国", "d": "古代ギリシア哲学、キリスト教・イスラーム、仏教・古代インド、儒家・道家"}, "C": {"name": "西洋近現代思想", "k": "MODERN WEST", "yr": "ルネサンス〜現代", "d": "宗教改革、ベーコン・デカルト、社会契約説、カント・ヘーゲル、功利主義、実存主義、現代思想"}, "D": {"name": "日本の思想", "k": "JAPAN", "yr": "古代〜近代", "d": "古代の倫理観、仏教受容と鎌倉仏教、儒学・国学、近代思想"}, "E": {"name": "現代の諸課題", "k": "ISSUES", "yr": "公共・応用倫理", "d": "生命倫理、環境倫理、情報社会、家族・福祉、異文化理解"}}, "q": [{"id": "A01", "c": "A", "f": "K", "q": "青年期を「第二の誕生」とよび、著書『エミール』でその意義を述べた思想家は誰か。", "o": ["ルソー", "レヴィン", "ホリングワース", "エリクソン"], "e": "ルソーは『エミール』で、人は二度生まれる、一度目は存在するために、二度目は生きるためにと述べ、青年期を第二の誕生とよんだ。"}, {"id": "A02", "c": "A", "f": "K", "q": "青年は子どもの集団にも大人の集団にも完全には属さない不安定な存在であるとして、青年を「マージナル・マン（境界人）」とよんだ心理学者は誰か。", "o": ["レヴィン", "ルソー", "マズロー", "オルポート"], "e": "レヴィンは、青年を子どもと大人の境界に位置するマージナル・マン（境界人）と特徴づけた。"}, {"id": "A03", "c": "A", "f": "K", "q": "青年期に親の保護や監督から離れ、精神的に自立しようとすることを「心理的離乳」とよんだ心理学者は誰か。", "o": ["ホリングワース", "レヴィン", "フロイト", "ユング"], "e": "ホリングワースは、青年期に親から精神的に独立しようとする過程を心理的離乳とよんだ。"}, {"id": "A04", "c": "A", "f": "K", "q": "青年期を、社会的な責任や義務が一時的に猶予される「心理・社会的モラトリアム」の時期ととらえ、アイデンティティの確立を青年期の課題とした心理学者は誰か。", "o": ["エリクソン", "マズロー", "ハヴィガースト", "シュプランガー"], "e": "エリクソンは、青年期をモラトリアムの期間とし、自己同一性（アイデンティティ）の確立をこの時期の発達課題とした。"}, {"id": "A05", "c": "A", "f": "K", "q": "マズローの欲求階層説において、最も高次に位置づけられる欲求はどれか。", "o": ["自己実現の欲求", "承認（自尊）の欲求", "所属と愛情の欲求", "安全の欲求"], "e": "マズローは、生理的欲求・安全・所属と愛情・承認の欲求（欠乏欲求）の上に、成長欲求である自己実現の欲求を位置づけた。"}, {"id": "A06", "c": "A", "f": "K", "q": "手に入れられなかったものについて「本当は価値のないものだった」ともっともらしい理屈をつけ、自分を納得させる防衛機制はどれか。", "o": ["合理化", "昇華", "反動形成", "投射（投影）"], "e": "もっともらしい理由づけで自分を正当化するのは合理化であり、イソップ寓話の「すっぱいぶどう」が典型例である。"}, {"id": "A07", "c": "A", "f": "K", "q": "満たされない欲求を、芸術やスポーツなど社会的・文化的に価値の高い活動に向けかえる防衛機制はどれか。", "o": ["昇華", "退行", "抑圧", "逃避"], "e": "社会的に価値の高い目標へ欲求を向けかえることを昇華という。退行は未熟な行動への後戻り、抑圧は欲求を無意識に押し込めること、逃避は困難な状況から逃れること。"}, {"id": "A08", "c": "A", "f": "K", "q": "好意を抱いている相手に、わざと冷たい態度をとってしまうような、本心と正反対の行動をとる防衛機制はどれか。", "o": ["反動形成", "同一視", "合理化", "代償（置き換え）"], "e": "認めたくない欲求を隠すため、それと正反対の態度や行動をとるのが反動形成である。"}, {"id": "A09", "c": "A", "f": "K", "q": "フロイトの心の構造についての説明として最も適当なものはどれか。", "o": ["本能的な衝動であるエス（イド）と、良心や道徳的規範である超自我との間を、自我が現実に即して調整する。", "超自我は快楽原則に従う本能的エネルギーの源泉であり、自我の働きを常に後押しする。", "自我は人類に共通する集合的無意識そのものであり、個人の経験とは無関係に形成される。", "エスは社会の道徳や規範を内面化したもので、心のうち最も意識的な部分である。"], "e": "フロイトは心をエス・自我・超自我からなるとし、快楽原則に従うエスと道徳的な超自我を、自我が現実原則に従って調整すると考えた。集合的無意識はユングの概念である。"}, {"id": "A10", "c": "A", "f": "K", "q": "個人を超えて人類に共通する「集合的無意識」を想定し、人間の性格を内向型と外向型に分けた心理学者は誰か。", "o": ["ユング", "フロイト", "マズロー", "オルポート"], "e": "ユングはフロイトの個人的無意識の考えを発展させ、集合的無意識や内向・外向の類型を提唱した。"}, {"id": "A11", "c": "A", "f": "K", "q": "人生の各段階に達成すべき「発達課題」を示し、青年期の課題として同年代の男女との成熟した人間関係や、両親からの情緒的独立などを挙げた心理学者は誰か。", "o": ["ハヴィガースト", "ホリングワース", "レヴィン", "ユング"], "e": "ハヴィガーストは、乳幼児期から老年期までの各段階に発達課題を設定し、青年期の課題を具体的に列挙した。"}, {"id": "A12", "c": "A", "f": "K", "q": "成熟した人格の特徴として、自己意識の拡大、他者との温かい関係、ユーモアを伴う自己の客観視、人生を統一する人生観などを挙げた心理学者は誰か。", "o": ["オルポート", "レヴィン", "ユング", "フロイト"], "e": "オルポートは人格心理学の立場から、成熟した人格の条件を示した。"}, {"id": "A13", "c": "A", "f": "K", "q": "「勉強はしたくないが、成績が下がるのも嫌だ」というように、どちらも避けたい二つの事柄の間で板ばさみになる葛藤の型はどれか。", "o": ["回避－回避型", "接近－接近型", "接近－回避型", "二重接近－回避型"], "e": "レヴィンの葛藤の分類で、望ましくない二つの選択肢の間で迷うのが回避－回避型である。"}, {"id": "A14", "c": "A", "f": "K", "q": "人間が何に価値を置いて生きるかによって、理論型・経済型・審美型・社会型・権力型・宗教型の六つに性格を類型化した人物は誰か。", "o": ["シュプランガー", "クレッチマー", "ユング", "ハヴィガースト"], "e": "シュプランガーは価値観に基づく六類型を示した。クレッチマーは体型と気質の関係から類型化した。"}, {"id": "A15", "c": "A", "f": "K", "q": "エリクソンのライフサイクル論において、乳児期に直面する心理・社会的危機はどれか。", "o": ["基本的信頼 対 不信", "同一性 対 同一性拡散", "親密性 対 孤立", "統合 対 絶望"], "e": "エリクソンは乳児期の課題を基本的信頼の獲得とした。同一性は青年期、親密性は成人前期、統合は老年期の課題である。"}, {"id": "A16", "c": "A", "f": "K", "q": "成人式のように、子どもから大人へなど人生の節目における社会的な地位の移行を区切る儀式を何というか。", "o": ["通過儀礼（イニシエーション）", "心理的離乳", "モラトリアム", "第二反抗期"], "e": "人生の節目に行われ、新たな社会的地位への移行を示す儀式を通過儀礼（イニシエーション）という。"}, {"id": "A17", "c": "A", "f": "S", "X": "マズローは、欠乏欲求がある程度満たされると、成長欲求である自己実現の欲求が現れると考えた。", "Y": "フロイトは、人間の心はほとんどが意識された領域であり、無意識は行動にほとんど影響しないと考えた。", "xs": true, "ys": false, "e": "Xは正しい。フロイトは無意識こそが人間の行動を大きく左右すると考えたので、Yは誤り。"}, {"id": "A18", "c": "A", "f": "S", "X": "退行とは、欲求不満の状態に置かれたとき、発達の早い段階の未熟な行動に後戻りすることをいう。", "Y": "投射（投影）とは、自分の中にある認めたくない感情や欲求を、他人のものとみなすことをいう。", "xs": true, "ys": true, "e": "X・Yともに防衛機制の正しい説明である。"}, {"id": "A19", "c": "A", "f": "S", "X": "ホリングワースは、青年を子どもと大人のどちらの集団にも属しきれない「境界人（マージナル・マン）」とよんだ。", "Y": "エリクソンは、自己同一性（アイデンティティ）の確立を青年期の中心的な課題とした。", "xs": false, "ys": true, "e": "境界人とよんだのはレヴィンであり、Xは誤り。ホリングワースは心理的離乳を唱えた。Yは正しい。"}, {"id": "A20", "c": "A", "f": "S", "X": "第一反抗期は、青年期の初めに親や社会の権威に反発する形で現れる。", "Y": "同一視とは、自分にない優れた能力をもつ他者と自分を重ね合わせて満足を得ることをいう。", "xs": false, "ys": true, "e": "第一反抗期は3歳前後の幼児期に現れ、青年期に現れるのは第二反抗期なのでXは誤り。Yは正しい。"}, {"id": "A21", "c": "A", "f": "S", "X": "ルソーは「われわれはいわば二度生まれる。一度目は存在するために、二度目は生きるために」と述べた。", "Y": "防衛機制とは、欲求不満を解消するために意識的に計画して用いる問題解決の方法である。", "xs": true, "ys": false, "e": "Xは『エミール』の一節で正しい。防衛機制は主に無意識的に働くものなのでYは誤り。"}, {"id": "A22", "c": "A", "f": "S", "X": "エリクソンは、モラトリアムを社会の発展を妨げるものとして否定的にのみとらえた。", "Y": "マズローは、生理的欲求を最も高次の欲求に位置づけた。", "xs": false, "ys": false, "e": "エリクソンはモラトリアムを自己を模索するための猶予期間として積極的な意味も認めた。マズローは生理的欲求を最も基本的（低次）な欲求とした。"}, {"id": "A23", "c": "A", "f": "N", "p": "次のⅠ〜Ⅲを古い順に並べよ。", "i": ["ホリングワース：青年期の自立を「心理的離乳」とよんだ", "エリクソン：アイデンティティとモラトリアムの概念を示した", "ルソー：『エミール』で青年期を「第二の誕生」とよんだ"], "yr": ["1886〜1939", "1902〜1994", "1712〜1778"], "ord": "312", "e": "ルソーは18世紀の思想家、ホリングワースは19世紀末生まれ、エリクソンは20世紀生まれの心理学者である。"}, {"id": "A24", "c": "A", "f": "N", "p": "次のⅠ〜Ⅲを古い順に並べよ。", "i": ["マズロー：欲求階層説を唱えた", "レヴィン：青年を「マージナル・マン」とよんだ", "フロイト：精神分析を創始した"], "yr": ["1908〜1970", "1890〜1947", "1856〜1939"], "ord": "321", "e": "生年の順にフロイト（1856年）、レヴィン（1890年）、マズロー（1908年）となる。"}, {"id": "B01", "c": "B", "f": "K", "q": "万物の根源（アルケー）を「水」であると考え、哲学の祖とされる自然哲学者は誰か。", "o": ["タレス", "ヘラクレイトス", "デモクリトス", "ピタゴラス"], "e": "タレスはアルケーを水とした。ヘラクレイトスは火、デモクリトスは原子（アトム）、ピタゴラスは数を根源とした。"}, {"id": "B02", "c": "B", "f": "K", "q": "「万物は流転する」と述べ、絶えず変化する世界の根源を「火」にたとえた自然哲学者は誰か。", "o": ["ヘラクレイトス", "パルメニデス", "タレス", "エンペドクレス"], "e": "ヘラクレイトスは万物の生成変化を強調した。パルメニデスは逆に変化や生成を否定し、「あるものはある」と説いた。"}, {"id": "B03", "c": "B", "f": "K", "q": "「人間は万物の尺度である」と述べ、真理や価値の基準は個々の人間の判断にあるとする相対主義を唱えたソフィストは誰か。", "o": ["プロタゴラス", "ソクラテス", "プラトン", "デモクリトス"], "e": "プロタゴラスは代表的なソフィストで、絶対的な真理を否定する相対主義の立場をとった。"}, {"id": "B04", "c": "B", "f": "K", "q": "ソクラテスの思想の説明として最も適当なものはどれか。", "o": ["自らが無知であることを自覚することが真の知への出発点であると考え、問答法によって人々に魂への配慮を促した。", "魂はかつて見ていたイデアを想起（アナムネーシス）することで、真の知に到達できると説いた。", "人間の徳は、過剰と不足の両極端を避けた中庸を選び取る習慣によって形成されると説いた。", "身体に苦痛がなく魂が乱されない状態（アタラクシア）こそが最高の快楽であると説いた。"], "e": "ソクラテスは無知の知を出発点に、問答法（助産術）で魂への配慮を説いた。想起説はプラトン、中庸はアリストテレス、アタラクシアはエピクロスの思想である。"}, {"id": "B05", "c": "B", "f": "K", "q": "魂を理性・気概・欲望の三部分に分け、知恵・勇気・節制・正義の四元徳を説いて、哲学者が統治する哲人政治を理想とした思想家は誰か。", "o": ["プラトン", "アリストテレス", "ソクラテス", "ゼノン"], "e": "プラトンは『国家』で魂の三分説と四元徳を説き、善のイデアを知る哲学者による統治を理想とした。"}, {"id": "B06", "c": "B", "f": "K", "q": "アリストテレスの思想の説明として最も適当なものはどれか。", "o": ["事物の本質である形相は個々の事物に内在し、素材である質料と結びついていると考え、人間を「ポリス的（社会的）動物」とよんだ。", "事物の本質であるイデアは、感覚でとらえられる現実の世界から離れた永遠の世界に存在すると考えた。", "宇宙を貫く理法（ロゴス）に従い、情念に動かされないアパテイアの境地を目指すべきだと説いた。", "真理は人によって異なるので、弁論術によって相手を説得することこそが重要だと説いた。"], "e": "アリストテレスは師プラトンのイデア論を批判し、形相は個物に内在するとした。イデア界はプラトン、アパテイアはストア派、弁論術の重視はソフィストの立場である。"}, {"id": "B07", "c": "B", "f": "K", "q": "情念（パトス）に動かされない心の状態であるアパテイアを理想とし、「自然に従って生きよ」と説いた学派はどれか。", "o": ["ストア派", "エピクロス派", "ソフィスト", "ミレトス学派"], "e": "ゼノンを祖とするストア派は、理性によって情念を克服するアパテイアを理想とした。エピクロス派はアタラクシアを理想とした。"}, {"id": "B08", "c": "B", "f": "K", "q": "イエスの教えの説明として最も適当なものはどれか。", "o": ["神の愛（アガペー）は罪人を含むすべての人に分け隔てなく注がれる無償の愛であり、「隣人を自分のように愛しなさい」と説いた。", "人生は苦であり、苦の原因である煩悩を断つために四諦と八正道を実践すべきだと説いた。", "唯一神への帰依を示すために、信仰告白・礼拝・喜捨・断食・巡礼の五行を果たすべきだと説いた。", "是非・善悪の区別は人為的なものであり、万物は本来等しい価値をもつ（万物斉同）と説いた。"], "e": "イエスは律法の形式的な遵守を批判し、神の無差別・無償の愛であるアガペーと隣人愛を説いた。他はブッダ、イスラーム、荘子の思想である。"}, {"id": "B09", "c": "B", "f": "K", "q": "人は律法の行いによってではなく、イエス・キリストへの信仰によって義とされると説き、異邦人への伝道に努めた使徒は誰か。", "o": ["パウロ", "アウグスティヌス", "トマス・アクィナス", "モーセ"], "e": "パウロは信仰義認を説き、キリスト教をユダヤ人以外にも広めた。信仰・希望・愛の三元徳も説いた。"}, {"id": "B10", "c": "B", "f": "K", "q": "『告白』や『神の国』を著し、人間は神の恩寵によってのみ救われると説いた古代キリスト教最大の教父は誰か。", "o": ["アウグスティヌス", "トマス・アクィナス", "パウロ", "パスカル"], "e": "アウグスティヌスは教父哲学を大成し、恩寵による救いや信仰・希望・愛の三元徳を重視した。"}, {"id": "B11", "c": "B", "f": "K", "q": "『神学大全』を著し、信仰と理性の調和を図ってスコラ哲学を大成した人物は誰か。", "o": ["トマス・アクィナス", "アウグスティヌス", "ルター", "カルヴァン"], "e": "トマス・アクィナスはアリストテレス哲学を取り入れ、「哲学は神学の侍女」として信仰と理性の調和を説いた。"}, {"id": "B12", "c": "B", "f": "K", "q": "イスラームの説明として最も適当なものはどれか。", "o": ["唯一神アッラーへの絶対的な帰依を説き、信者の義務として信仰告白・礼拝・喜捨・断食・巡礼の五行を定めている。", "ムハンマドを神の子とみなし、神・子・聖霊を一体とする三位一体説を中心的な教義としている。", "聖典は旧約聖書のみであり、クルアーン（コーラン）は聖典として認めていない。", "神の姿を描いた像を礼拝の対象とすることを、信仰の重要な行為として奨励している。"], "e": "イスラームでは六信五行が定められている。ムハンマドは神の子ではなく最後の預言者とされ、聖典はクルアーンである。偶像崇拝は厳しく禁じられている。"}, {"id": "B13", "c": "B", "f": "K", "q": "ブッダ（ゴータマ・シッダッタ）の教えの説明として最も適当なものはどれか。", "o": ["すべての事物は縁起によって成り立っており、それ自体として存在する固定的な実体はないとする諸法無我を説いた。", "宇宙の根本原理ブラフマンと個人の本体アートマンとが一体であると悟ること（梵我一如）によって解脱できると説いた。", "不殺生などの戒律を徹底的に守り、厳しい苦行を続けることで魂を浄化すべきだと説いた。", "欲望を満たす快楽にこそ真の安らぎがあるので、欲望のままに生きるべきだと説いた。"], "e": "ブッダは縁起の法を悟り、諸行無常・諸法無我などを説いた。梵我一如はウパニシャッド哲学、徹底した苦行と不殺生はジャイナ教の特徴であり、ブッダは快楽と苦行の両極端を避ける中道を説いた。"}, {"id": "B14", "c": "B", "f": "K", "q": "『中論』を著し、あらゆる存在は縁起によって成り立つので固定的な実体をもたないとする「空」の思想を体系化した大乗仏教の思想家は誰か。", "o": ["ナーガールジュナ（竜樹）", "ヴァスバンドゥ（世親）", "ヴァルダマーナ", "アサンガ（無著）"], "e": "ナーガールジュナは空の思想を理論化した。ヴァスバンドゥとアサンガは唯識思想を大成し、ヴァルダマーナはジャイナ教の開祖である。"}, {"id": "B15", "c": "B", "f": "K", "q": "孔子の思想の説明として最も適当なものはどれか。", "o": ["自己の欲望に打ち克って礼に従う克己復礼を仁の実践とし、為政者の徳によって民を治める徳治主義を理想とした。", "人間の本性は利己的であるから、厳格な法と賞罰によって国家を統治すべきだと説いた。", "人為的な道徳を捨て、ありのままの自然に従う無為自然の生き方を説いた。", "親疎の区別なくすべての人を等しく愛する兼愛と、侵略戦争を否定する非攻を説いた。"], "e": "孔子は仁と礼を重んじ、徳治主義を説いた。法による統治は韓非子、無為自然は老子、兼愛・非攻は墨子の思想である。"}, {"id": "B16", "c": "B", "f": "K", "q": "人には惻隠・羞悪・辞譲・是非の「四端」の心が生まれつき備わっているとして、性善説を唱えた思想家は誰か。", "o": ["孟子", "荀子", "朱子", "墨子"], "e": "孟子は四端を育てることで仁・義・礼・智の四徳が実現すると説いた。荀子は性悪説を唱えた。"}, {"id": "B17", "c": "B", "f": "S", "X": "老子は、人為を捨てて自然に従い、柔弱謙下の態度で生きることを説いた。", "Y": "荘子は、あらゆるものは本来等しい価値をもつとする万物斉同を説いた。", "xs": true, "ys": true, "e": "X・Yともに道家の思想の正しい説明である。"}, {"id": "B18", "c": "B", "f": "S", "X": "荀子は、人間の本性を悪とみなし、礼によって人間を矯正することを重視した。", "Y": "墨子は、家族など身近な者への愛を優先する別愛を説き、兼愛を批判した。", "xs": true, "ys": false, "e": "Xは正しい。墨子は無差別の愛である兼愛を説き、儒家の愛を差別的な別愛として批判したのでYは誤り。"}, {"id": "B19", "c": "B", "f": "S", "X": "朱子は、心がそのまま理であるとする「心即理」を説いた。", "Y": "王陽明は、知ることと行うことは本来一体であるとする「知行合一」を説いた。", "xs": false, "ys": true, "e": "心即理を説いたのは王陽明であり、朱子は性即理を説いたのでXは誤り。Yは正しい。"}, {"id": "B20", "c": "B", "f": "S", "X": "プラトンは『ニコマコス倫理学』を著し、知性的徳と習性的（倫理的）徳を区別した。", "Y": "エピクロスは、魂が乱されない平静な状態（アタラクシア）を理想とした。", "xs": false, "ys": true, "e": "『ニコマコス倫理学』を著して徳を区別したのはアリストテレスなのでXは誤り。Yは正しい。"}, {"id": "B21", "c": "B", "f": "S", "X": "ユダヤ教では、唯一神ヤハウェがイスラエルの民と契約を結び、律法を与えたとされる。", "Y": "ジャイナ教を開いたのは、ゴータマ・シッダッタである。", "xs": true, "ys": false, "e": "Xは正しい。ジャイナ教の開祖はヴァルダマーナであり、ゴータマ・シッダッタは仏教の開祖なのでYは誤り。"}, {"id": "B22", "c": "B", "f": "S", "X": "上座部仏教は、すべての生きとし生けるものの救済をめざす菩薩の利他行を最も重視する。", "Y": "ソクラテスは、自分は何でも知っていると主張したために、アテネで死刑を宣告された。", "xs": false, "ys": false, "e": "利他行を重んじ菩薩を理想とするのは大乗仏教である。ソクラテスは無知の知を説き、青年を堕落させたなどの罪で告発された。"}, {"id": "B23", "c": "B", "f": "N", "p": "次のⅠ〜Ⅲを古い順に並べよ。", "i": ["ソクラテス：無知の知を説いた", "アリストテレス：形相と質料の概念を示した", "タレス：万物の根源を水とした"], "yr": ["前469頃〜前399", "前384〜前322", "前624頃〜前546頃"], "ord": "312", "e": "自然哲学者タレスが最も古く、ソクラテス、その孫弟子にあたるアリストテレスの順となる。"}, {"id": "B24", "c": "B", "f": "N", "p": "次のⅠ〜Ⅲを古い順に並べよ。", "i": ["イエス：神の愛と隣人愛を説いた", "孔子：仁と礼を説いた", "ムハンマド：唯一神アッラーの啓示を伝えた"], "yr": ["前4頃〜後30頃", "前551頃〜前479", "570頃〜632"], "ord": "213", "e": "孔子は前6〜前5世紀、イエスは紀元前後、ムハンマドは6〜7世紀の人物である。"}, {"id": "C01", "c": "C", "f": "K", "q": "『人間の尊厳について』を著し、人間は自由意志によって自らのあり方を決めることができる点に尊厳があると説いたルネサンス期の人文主義者は誰か。", "o": ["ピコ・デラ・ミランドラ", "エラスムス", "マキャヴェリ", "トマス・モア"], "e": "ピコ・デラ・ミランドラは、人間は自由意志によって獣にも神的存在にもなりうると説いた。"}, {"id": "C02", "c": "C", "f": "K", "q": "贖宥状（免罪符）の販売を批判し、信仰のみ・聖書のみを重んじて、すべての信者が神の前で等しく祭司であるとする万人司祭主義を唱えた人物は誰か。", "o": ["ルター", "カルヴァン", "エラスムス", "パスカル"], "e": "ルターは『九十五か条の論題』で贖宥状を批判し、宗教改革の口火を切った。主著に『キリスト者の自由』がある。"}, {"id": "C03", "c": "C", "f": "K", "q": "救われる者と救われない者はあらかじめ神によって定められているとする予定説を説き、職業を神から与えられた使命として励むことを重視した宗教改革者は誰か。", "o": ["カルヴァン", "ルター", "モンテーニュ", "ベーコン"], "e": "カルヴァンは『キリスト教綱要』で予定説を説いた。その職業倫理は、のちにマックス・ウェーバーが資本主義の精神との関係で論じた。"}, {"id": "C04", "c": "C", "f": "K", "q": "正しい認識を妨げる偏見や先入観を「イドラ」とよんで四種に分類し、観察や実験に基づく帰納法を提唱した思想家は誰か。", "o": ["ベーコン", "デカルト", "ロック", "ヒューム"], "e": "ベーコンは『ノヴム・オルガヌム』で種族・洞窟・市場・劇場の四つのイドラを示し、「知は力なり」と述べた。"}, {"id": "C05", "c": "C", "f": "K", "q": "デカルトの思想の説明として最も適当なものはどれか。", "o": ["あらゆるものを疑う方法的懐疑の末に、疑っている自己の存在は疑えないとして「われ思う、ゆえにわれあり」を哲学の第一原理とした。", "個々の観察や実験の結果を積み重ねて、そこから一般的な法則を導く帰納法を学問の方法とした。", "人間は自然の中で最も弱い一本の葦にすぎないが、考えることができる点に尊厳があると述べた。", "人間の心は生まれたときには何も書かれていない白紙（タブラ・ラサ）であり、知識はすべて経験に由来すると考えた。"], "e": "デカルトは『方法序説』で方法的懐疑を通じて「われ思う、ゆえにわれあり」に到達した。帰納法はベーコン、考える葦はパスカル、タブラ・ラサはロックの考えである。"}, {"id": "C06", "c": "C", "f": "K", "q": "『パンセ』において、人間は自然の中で最も弱い存在だが考えることができるとして、人間を「考える葦」と表現した人物は誰か。", "o": ["パスカル", "モンテーニュ", "デカルト", "スピノザ"], "e": "パスカルは、人間を偉大さと悲惨さの間に揺れる中間者ととらえ、「考える葦」と表現した。"}, {"id": "C07", "c": "C", "f": "K", "q": "自然状態を「万人の万人に対する闘争」とし、人々は自己保存のために自然権を主権者に譲渡して国家をつくると説いた思想家は誰か。", "o": ["ホッブズ", "ロック", "ルソー", "モンテスキュー"], "e": "ホッブズは『リヴァイアサン』で、闘争状態を脱するための社会契約と強力な主権を説いた。"}, {"id": "C08", "c": "C", "f": "K", "q": "ロックの思想の説明として最も適当なものはどれか。", "o": ["政府が人々の生命・自由・財産などの自然権を侵害する場合には、人民は抵抗権（革命権）を行使できると考えた。", "自然状態は「万人の万人に対する闘争」であり、人々は主権者に絶対的に服従しなければならないと考えた。", "公共の利益をめざす一般意志に基づき、代表を介さない直接民主制を理想とした。", "国王の権力は神から直接与えられたものであるとする王権神授説を擁護した。"], "e": "ロックは『統治二論』で自然権を守るための政府と抵抗権を説いた。闘争状態はホッブズ、一般意志はルソーの考えであり、ロックは王権神授説を批判した。"}, {"id": "C09", "c": "C", "f": "K", "q": "公共の利益をめざす「一般意志」に基づく人民主権を説き、『社会契約論』を著した思想家は誰か。", "o": ["ルソー", "ロック", "ホッブズ", "ヴォルテール"], "e": "ルソーは一般意志は譲渡も代表もされえないとし、直接民主制を理想とした。"}, {"id": "C10", "c": "C", "f": "K", "q": "カントの思想の説明として最も適当なものはどれか。", "o": ["道徳法則は結果や条件にかかわらず「〜せよ」と無条件に命じる定言命法の形をとり、自らが立てた道徳法則に従うことに自律としての自由があると考えた。", "行為の善悪は、その行為が「最大多数の最大幸福」をもたらすかどうかによって決まると考えた。", "世界は精神が弁証法的に自己を展開していく過程であり、歴史は絶対精神が自由を実現していく過程であると考えた。", "「神は死んだ」と宣言し、既成の価値を超えて新たな価値を創造する超人を理想とした。"], "e": "カントは定言命法と意志の自律を説き、人格を手段としてだけでなく目的として扱うべきだとした。他はベンサム、ヘーゲル、ニーチェの思想である。"}, {"id": "C11", "c": "C", "f": "K", "q": "人倫を家族・市民社会・国家の三段階でとらえ、市民社会を「欲望の体系」とよんで、国家において人倫が完成すると考えた思想家は誰か。", "o": ["ヘーゲル", "カント", "マルクス", "フィヒテ"], "e": "ヘーゲルは『法の哲学』で、家族と市民社会の対立が国家において止揚されると説いた。"}, {"id": "C12", "c": "C", "f": "K", "q": "快楽や苦痛を数量的に計算できると考えて快楽計算を提唱し、人の行為を規制するものとして物理的・政治的・道徳的・宗教的の四つの制裁を挙げた思想家は誰か。", "o": ["ベンサム", "J.S.ミル", "アダム・スミス", "ロールズ"], "e": "ベンサムは量的功利主義の立場から快楽計算と四つの制裁を説いた。"}, {"id": "C13", "c": "C", "f": "K", "q": "快楽には質的な違いがあると考え、「満足した豚であるより、不満足な人間であるほうがよい」と述べた思想家は誰か。", "o": ["J.S.ミル", "ベンサム", "キルケゴール", "デューイ"], "e": "J.S.ミルは質的功利主義を説き、良心による内的制裁を重視した。『自由論』では他者危害の原則を示した。"}, {"id": "C14", "c": "C", "f": "K", "q": "人間の生き方を美的実存・倫理的実存・宗教的実存の三段階で示し、「あれか、これか」の主体的決断を重視した思想家は誰か。", "o": ["キルケゴール", "ニーチェ", "ヤスパース", "サルトル"], "e": "キルケゴールは、絶望を経て単独者として神の前に立つ宗教的実存に至ると説いた。"}, {"id": "C15", "c": "C", "f": "K", "q": "サルトルの思想の説明として最も適当なものはどれか。", "o": ["「実存は本質に先立つ」と述べ、人間は自ら選択し社会に参加（アンガージュマン）することで自己をつくり、その選択に責任を負うと説いた。", "死・苦悩・争い・罪といった限界状況に直面して挫折するとき、人間は超越者（包括者）に出会うと説いた。", "ニヒリズムを克服するため、同じことが永遠に繰り返される永劫回帰を肯定する超人を理想とした。", "人間は「死への存在」であり、自らの死を自覚することで本来的な自己に立ち返ると説いた。"], "e": "サルトルは無神論的実存主義の立場から、人間は「自由の刑に処せられている」とも述べた。他はヤスパース、ニーチェ、ハイデッガーの思想である。"}, {"id": "C16", "c": "C", "f": "K", "q": "『正義論』において、自らの能力や社会的地位を知らない「無知のヴェール」におおわれた原初状態を想定し、公正としての正義の原理を導き出した思想家は誰か。", "o": ["ロールズ", "ハーバーマス", "セン", "ノージック"], "e": "ロールズは、平等な自由の原理と、最も恵まれない人々の利益を最大化する格差原理などを示した。"}, {"id": "C17", "c": "C", "f": "S", "X": "デューイは、知性を人間が問題を解決するための道具とみなす道具主義を唱えた。", "Y": "ジェームズは、ある観念が真理であるかどうかは、それが実生活において有用であるかどうかによって決まると考えた。", "xs": true, "ys": true, "e": "X・Yともにプラグマティズムの思想家についての正しい説明である。"}, {"id": "C18", "c": "C", "f": "S", "X": "ハーバーマスは、対等な立場の人々が討議を通じて合意を形成していく対話的（コミュニケーション的）合理性を重視した。", "Y": "レヴィナスは、他者の「顔」を自己の理解の内に完全に取り込むことによって、他者との同一化が実現すると説いた。", "xs": true, "ys": false, "e": "Xは正しい。レヴィナスは、他者は自己に還元できない無限な存在であり、「顔」は自己に倫理的責任を呼びかけるものだと説いたのでYは誤り。"}, {"id": "C19", "c": "C", "f": "S", "X": "マルクスは、社会の土台である経済構造（下部構造）が、法律や政治などの上部構造を規定すると考えた。", "Y": "ニーチェは、キリスト教道徳を強者の高貴な道徳として称賛した。", "xs": true, "ys": false, "e": "Xは唯物史観の正しい説明である。ニーチェはキリスト教道徳を弱者のルサンチマンから生まれた奴隷道徳として批判したのでYは誤り。"}, {"id": "C20", "c": "C", "f": "S", "X": "スピノザは、神と自然とを厳格に区別し、自然の中に神をみる汎神論を否定した。", "Y": "エラスムスは、『愚神礼讃』を著して教会や聖職者の腐敗を風刺した。", "xs": false, "ys": true, "e": "スピノザは「神即自然」と説く汎神論の立場をとったのでXは誤り。Yは正しい。"}, {"id": "C21", "c": "C", "f": "S", "X": "ヤスパースは、限界状況に直面した人間は超越者に出会うことなく、絶望のうちに終わるほかないと説いた。", "Y": "カントは、行為の結果もたらされる幸福の量によって、その行為の道徳的な善悪が決まると考えた。", "xs": false, "ys": false, "e": "ヤスパースは限界状況での挫折を通して超越者（包括者）に出会うと説いた。カントは結果ではなく動機（善意志）を重視した。"}, {"id": "C22", "c": "C", "f": "S", "X": "アダム・スミスは、人間は利己心のみで行動するので、共感は道徳の基礎にはなりえないと考えた。", "Y": "フーコーは、近代社会において監視などを通じて人々を規律化し従順な主体をつくりだす権力の働きを分析した。", "xs": false, "ys": true, "e": "アダム・スミスは『道徳感情論』で共感（同感）を道徳の基礎としたのでXは誤り。Yは正しい。"}, {"id": "C23", "c": "C", "f": "N", "p": "次のⅠ〜Ⅲを古い順に並べよ。", "i": ["デカルト：「われ思う、ゆえにわれあり」を第一原理とした", "カント：定言命法と意志の自律を説いた", "ロック：抵抗権（革命権）を説いた"], "yr": ["1596〜1650", "1724〜1804", "1632〜1704"], "ord": "132", "e": "17世紀前半のデカルト、17世紀後半のロック、18世紀のカントの順となる。"}, {"id": "C24", "c": "C", "f": "N", "p": "次のⅠ〜Ⅲを古い順に並べよ。", "i": ["キルケゴール：実存の三段階を説いた", "ベンサム：「最大多数の最大幸福」を説いた", "ロールズ：『正義論』で公正としての正義を説いた"], "yr": ["1813〜1855", "1748〜1832", "1921〜2002"], "ord": "213", "e": "18世紀生まれのベンサム、19世紀のキルケゴール、20世紀のロールズの順となる。"}, {"id": "D01", "c": "D", "f": "K", "q": "古代の日本人が重んじた、偽りや私心がなく、神に対して隠しごとのない純粋な心を何というか。", "o": ["清き明き心（清明心）", "もののあはれ", "誠", "慈悲"], "e": "古代日本では、神に対して欺きのない清き明き心が重視された。のちに正直や誠の倫理へと受け継がれていった。"}, {"id": "D02", "c": "D", "f": "K", "q": "十七条憲法で「和を以て貴しと為す」と述べ、人はみな凡夫であるという自覚に基づき仏教による国づくりを進めたとされる人物は誰か。", "o": ["聖徳太子（厩戸王）", "聖武天皇", "行基", "鑑真"], "e": "聖徳太子は十七条憲法で和の精神と三宝（仏・法・僧）の尊重を説き、「世間虚仮、唯仏是真」の言葉を残したとされる。"}, {"id": "D03", "c": "D", "f": "K", "q": "比叡山に延暦寺を開いて天台宗を広め、すべての人が仏になりうると説く法華経の教え（一乗思想）を重んじた僧は誰か。", "o": ["最澄", "空海", "法然", "栄西"], "e": "最澄は「一切衆生悉有仏性」を説き、『山家学生式』で大乗戒壇の設立を求めた。"}, {"id": "D04", "c": "D", "f": "K", "q": "高野山に金剛峯寺を開いて真言宗を広め、身・口・意の三密の修行によって、この身のままで仏になる即身成仏を説いた僧は誰か。", "o": ["空海", "最澄", "源信", "道元"], "e": "空海は密教を体系化し、『三教指帰』『十住心論』などを著した。"}, {"id": "D05", "c": "D", "f": "K", "q": "『選択本願念仏集』を著し、ひたすら「南無阿弥陀仏」と称える専修念仏によって極楽往生できると説いた僧は誰か。", "o": ["法然", "親鸞", "一遍", "日蓮"], "e": "法然は浄土宗を開き、阿弥陀仏の本願を信じて念仏を称えることを説いた。"}, {"id": "D06", "c": "D", "f": "K", "q": "親鸞の思想の説明として最も適当なものはどれか。", "o": ["自力で善を行うことのできない悪人こそが、阿弥陀仏の救いの本来の対象であるとする悪人正機を説いた。", "ただひたすら坐禅に打ち込む只管打坐によって、身心脱落の境地に至ると説いた。", "法華経こそが唯一の正しい教えであるとし、「南無妙法蓮華経」と題目を唱えることを説いた。", "『往生要集』を著し、地獄の恐ろしさと極楽往生のための念仏の重要性を説いた。"], "e": "親鸞は浄土真宗を開き、絶対他力と悪人正機を説いた。只管打坐は道元、題目は日蓮、『往生要集』は源信である。"}, {"id": "D07", "c": "D", "f": "K", "q": "『正法眼蔵』を著し、ただひたすら坐禅に打ち込む只管打坐を説いて、修行と悟りは一体である（修証一等）とした僧は誰か。", "o": ["道元", "栄西", "親鸞", "一遍"], "e": "道元は曹洞宗を開いた。栄西は臨済宗を伝え、『興禅護国論』を著した。"}, {"id": "D08", "c": "D", "f": "K", "q": "法華経を唯一の正しい教えとして「南無妙法蓮華経」の題目を唱えることを説き、『立正安国論』を著して他宗を批判した僧は誰か。", "o": ["日蓮", "法然", "最澄", "栄西"], "e": "日蓮は法華経の信仰によって国家の安泰が実現すると説いた。"}, {"id": "D09", "c": "D", "f": "K", "q": "天地に上下の秩序があるように人間社会にも身分の上下があるとする「上下定分の理」を説き、江戸幕府に仕えて朱子学を官学化する基礎を築いた儒学者は誰か。", "o": ["林羅山", "中江藤樹", "伊藤仁斎", "荻生徂徠"], "e": "林羅山は藤原惺窩に学び、存心持敬を説いて朱子学を幕藩体制を支える学問とした。"}, {"id": "D10", "c": "D", "f": "K", "q": "「孝」を人倫の根本にとどまらず万物を貫く原理ととらえ、日本の陽明学の祖とされる儒学者は誰か。", "o": ["中江藤樹", "林羅山", "山鹿素行", "石田梅岩"], "e": "中江藤樹は時・処・位に応じた実践を重んじ、近江聖人とよばれた。"}, {"id": "D11", "c": "D", "f": "K", "q": "朱子学の解釈を退けて『論語』『孟子』の原典に直接学ぶ古義学を唱え、仁愛とそれを支える「誠」を重んじた儒学者は誰か。", "o": ["伊藤仁斎", "荻生徂徠", "林羅山", "本居宣長"], "e": "伊藤仁斎は京都の堀川に古義堂を開き、日常の人間関係における仁愛を重視した。"}, {"id": "D12", "c": "D", "f": "K", "q": "古代中国の言葉や文章を研究する古文辞学を唱え、儒学の道とは古代の聖人（先王）が天下を安定させるためにつくった制度（安天下の道）であるとした儒学者は誰か。", "o": ["荻生徂徠", "伊藤仁斎", "中江藤樹", "賀茂真淵"], "e": "荻生徂徠は道を人為的な礼楽刑政の制度ととらえ、経世済民を重視した。"}, {"id": "D13", "c": "D", "f": "K", "q": "本居宣長の思想の説明として最も適当なものはどれか。", "o": ["『源氏物語』の本質を「もののあはれ」を知る心に見いだし、儒教や仏教の影響を受けた漢意を排して、生まれつきの真心に従って生きることを説いた。", "『万葉集』の研究を通じて、男性的でおおらかな「ますらをぶり」を古代人の精神として見いだした。", "町人の立場から、商人が利益を得ることは正当であるとし、正直と倹約を重んじる石門心学を説いた。", "すべての人が田畑を耕して自給自足する「万人直耕」の自然世を理想とし、身分制度を批判した。"], "e": "本居宣長は『古事記伝』を著して国学を大成した。ますらをぶりは賀茂真淵、石門心学は石田梅岩、万人直耕は安藤昌益の思想である。"}, {"id": "D14", "c": "D", "f": "K", "q": "『学問のすゝめ』で実学を奨励し、「一身独立して一国独立す」と述べて独立自尊の精神を説いた思想家は誰か。", "o": ["福沢諭吉", "中江兆民", "新渡戸稲造", "西周"], "e": "福沢諭吉は天賦人権論に立ち、個人の独立が国家の独立の基礎になると説いた。"}, {"id": "D15", "c": "D", "f": "K", "q": "「二つのJ（イエスと日本）」に生涯をささげることを誓い、教会や儀式にとらわれず聖書に基づく信仰を重んじる無教会主義を唱えた人物は誰か。", "o": ["内村鑑三", "新島襄", "植村正久", "新渡戸稲造"], "e": "内村鑑三は不敬事件や日露戦争に対する非戦論でも知られる。"}, {"id": "D16", "c": "D", "f": "K", "q": "西田幾多郎の思想の説明として最も適当なものはどれか。", "o": ["『善の研究』において、主観と客観が分かれる以前の主客未分の「純粋経験」こそが真の実在であるとした。", "人間を、個人であると同時に社会的な関係の中にある「間柄的存在」としてとらえ、倫理学を体系化した。", "文字に記録されない無名の人々を「常民」とよび、その生活文化を明らかにする民俗学を確立した。", "日本の近代化は外からの圧力による「外発的開化」であると批判し、自己本位の立場を説いた。"], "e": "西田幾多郎は禅の体験も踏まえて純粋経験を説いた。間柄的存在は和辻哲郎、常民は柳田国男、外発的開化は夏目漱石の考えである。"}, {"id": "D17", "c": "D", "f": "S", "X": "和辻哲郎は、人間を個人であると同時に社会的存在でもある「間柄的存在」としてとらえた。", "Y": "柳田国男は、無名の庶民を「常民」とよび、その生活や伝承を研究する民俗学を確立した。", "xs": true, "ys": true, "e": "X・Yともに正しい。和辻は『倫理学』『風土』を著し、柳田は『遠野物語』などで知られる。"}, {"id": "D18", "c": "D", "f": "S", "X": "石田梅岩は、商人が利益を追求することは卑しい行為であるとして否定した。", "Y": "安藤昌益は、すべての人が田畑を耕して生活する「自然世」を理想とした。", "xs": false, "ys": true, "e": "石田梅岩は商人の営利を正当なものと認め、正直と倹約を説いたのでXは誤り。Yは正しい。"}, {"id": "D19", "c": "D", "f": "S", "X": "夏目漱石は、日本の近代化を外から押しつけられた「外発的開化」であると批判した。", "Y": "中江兆民は、『学問のすゝめ』を著して実学の重要性を説いた。", "xs": true, "ys": false, "e": "Xは正しい。『学問のすゝめ』は福沢諭吉の著作であり、中江兆民はルソーの『社会契約論』を漢訳した『民約訳解』などで知られるのでYは誤り。"}, {"id": "D20", "c": "D", "f": "S", "X": "賀茂真淵は、『万葉集』の研究を通じて、男性的でおおらかな「ますらをぶり」を見いだした。", "Y": "平田篤胤は、仏教を国学の中心に据えて、神道を排斥した。", "xs": true, "ys": false, "e": "Xは正しい。平田篤胤は儒教や仏教を排して復古神道を説いたのでYは誤り。"}, {"id": "D21", "c": "D", "f": "S", "X": "栄西は、只管打坐を説いて『正法眼蔵』を著した。", "Y": "本居宣長は、儒教道徳を日本古来の道として積極的に取り入れることを説いた。", "xs": false, "ys": false, "e": "只管打坐と『正法眼蔵』は道元である。本居宣長は儒教的な漢意を排することを説いた。"}, {"id": "D22", "c": "D", "f": "S", "X": "新渡戸稲造は、『武士道』を英文で著し、日本人の道徳を海外に紹介した。", "Y": "平塚らいてうは、「元始、女性は実に太陽であった」と述べ、女性の解放を訴えた。", "xs": true, "ys": true, "e": "X・Yともに正しい。平塚らいてうは雑誌『青鞜』の創刊に際してこの言葉を記した。"}, {"id": "D23", "c": "D", "f": "N", "p": "次のⅠ〜Ⅲを古い順に並べよ。", "i": ["法然：専修念仏を説いた", "最澄：天台宗を開いた", "本居宣長：国学を大成した"], "yr": ["1133〜1212", "767〜822", "1730〜1801"], "ord": "213", "e": "平安時代初期の最澄、平安末〜鎌倉初期の法然、江戸時代の本居宣長の順となる。"}, {"id": "D24", "c": "D", "f": "N", "p": "次のⅠ〜Ⅲを古い順に並べよ。", "i": ["福沢諭吉：『学問のすゝめ』を著した", "伊藤仁斎：古義学を唱えた", "和辻哲郎：人間を間柄的存在ととらえた"], "yr": ["1835〜1901", "1627〜1705", "1889〜1960"], "ord": "213", "e": "江戸前期の伊藤仁斎、幕末・明治の福沢諭吉、大正・昭和の和辻哲郎の順となる。"}, {"id": "E01", "c": "E", "f": "K", "q": "医師が病状や治療方法について十分に説明し、患者がそれを理解・納得したうえで治療に同意することを何というか。", "o": ["インフォームド・コンセント", "パターナリズム", "リヴィング・ウィル", "セカンド・オピニオン"], "e": "インフォームド・コンセントは患者の自己決定権を尊重する考え方である。パターナリズムは医師が患者に代わって判断する父権主義をさす。"}, {"id": "E02", "c": "E", "f": "K", "q": "回復の見込みがない状態になった場合の延命治療の拒否など、終末期医療についての本人の意思を元気なうちに文書で表明しておくものを何というか。", "o": ["リヴィング・ウィル", "インフォームド・コンセント", "クオリティ・オブ・ライフ", "ホスピス"], "e": "リヴィング・ウィルは生前の意思表示であり、尊厳死に関する自己決定を示すものとして用いられる。"}, {"id": "E03", "c": "E", "f": "K", "q": "2009年の臓器移植法改正の内容として最も適当なものはどれか。", "o": ["本人の意思が不明な場合でも、家族の書面による承諾があれば脳死下での臓器提供が可能となり、15歳未満の人からの提供も可能になった。", "脳死下での臓器提供には、本人の書面による意思表示と家族の承諾の両方が必要であるという条件が新たに設けられた。", "脳死下での臓器提供が、日本で初めて法律によって認められた。", "一定の条件のもとで、臓器を売買することが認められた。"], "e": "2009年の改正（2010年施行）で家族の承諾のみでの提供や15歳未満からの提供が可能になった。本人の書面と家族の承諾を必要としたのは1997年制定時の規定であり、臓器売買は禁止されている。"}, {"id": "E04", "c": "E", "f": "K", "q": "皮膚などの体細胞に特定の遺伝子を導入してつくられ、受精卵（胚）を壊さずに作製できるため倫理的な問題が少ないとされる多能性幹細胞はどれか。", "o": ["iPS細胞（人工多能性幹細胞）", "ES細胞（胚性幹細胞）", "クローン胚", "体性幹細胞"], "e": "iPS細胞は山中伸弥らが作製に成功した。ES細胞は受精卵（胚）を壊して作製するため倫理的な問題が指摘されている。"}, {"id": "E05", "c": "E", "f": "K", "q": "生命をただ延ばすことよりも、患者本人が満足できる生き方や生活の質を重視する考え方を何というか。", "o": ["QOL（クオリティ・オブ・ライフ）", "SOL（生命の尊厳）", "パターナリズム", "ノーマライゼーション"], "e": "QOLは生命の質を重視する考え方であり、生命そのものに絶対的な価値を認めるSOLと対比される。"}, {"id": "E06", "c": "E", "f": "K", "q": "現在の世代は、将来の世代の生存可能性や生活環境に対して責任を負うべきであるとする環境倫理の考え方はどれか。", "o": ["世代間倫理", "自然の生存権", "地球全体主義", "文化相対主義"], "e": "世代間倫理は未来世代への責任を説く考え方で、ヨナスの責任の倫理などが知られる。自然の生存権・地球全体主義と並ぶ環境倫理の主張の一つである。"}, {"id": "E07", "c": "E", "f": "K", "q": "『沈黙の春』を著し、DDTなどの農薬が生態系を破壊する危険性を警告した人物は誰か。", "o": ["レイチェル・カーソン", "ボールディング", "レオポルド", "ハーディン"], "e": "カーソンは1962年に『沈黙の春』を著し、化学物質による環境汚染への関心を高めた。"}, {"id": "E08", "c": "E", "f": "K", "q": "人間を自然の征服者ではなく、土壌・水・動植物などからなる生態系（共同体）の一員ととらえる「土地倫理」を提唱した人物は誰か。", "o": ["レオポルド", "レイチェル・カーソン", "ヨナス", "ボールディング"], "e": "レオポルドは『野生のうたが聞こえる』で土地倫理を説き、環境倫理の先駆者とされる。"}, {"id": "E09", "c": "E", "f": "K", "q": "誰もが自由に利用できる共有の牧草地で各自が利益を追求すると、資源が枯渇して全員が損害を被ると論じた「共有地（コモンズ）の悲劇」を唱えた人物は誰か。", "o": ["ハーディン", "ボールディング", "レイチェル・カーソン", "レオポルド"], "e": "ハーディンは、個人の合理的な行動が全体として資源の破壊をまねくことを指摘した。"}, {"id": "E10", "c": "E", "f": "K", "q": "1972年にストックホルムで開かれ、「かけがえのない地球（Only One Earth）」をスローガンとして人間環境宣言を採択した国際会議はどれか。", "o": ["国連人間環境会議", "国連環境開発会議（地球サミット）", "持続可能な開発に関する世界首脳会議", "気候変動枠組条約第3回締約国会議（COP3）"], "e": "国連人間環境会議を受けて国連環境計画（UNEP）が設立された。地球サミットは1992年、COP3は1997年の会議である。"}, {"id": "E11", "c": "E", "f": "K", "q": "情報通信技術を利用できる人と利用できない人との間に生じる、情報や経済的機会の格差を何というか。", "o": ["デジタル・デバイド", "フィルターバブル", "メディア・リテラシー", "ユビキタス"], "e": "デジタル・デバイドは、年齢・所得・地域などによる情報格差をさす。"}, {"id": "E12", "c": "E", "f": "K", "q": "検索サイトやSNSのアルゴリズムが利用者の好みに合う情報を優先して表示するため、利用者が自分の関心や考えに合う情報ばかりに囲まれてしまう現象を何というか。", "o": ["フィルターバブル", "デジタル・デバイド", "メディア・リテラシー", "ユビキタス"], "e": "フィルターバブルによって異なる意見にふれる機会が減り、考えが偏るおそれが指摘されている。"}, {"id": "E13", "c": "E", "f": "K", "q": "『世論』において、人々はマスメディアなどがつくり出す「疑似環境」に反応して行動していると指摘し、固定的で単純化されたイメージを「ステレオタイプ」とよんだ人物は誰か。", "o": ["リップマン", "ブーアスティン", "マクルーハン", "ハーバーマス"], "e": "リップマンは、人々が現実そのものではなく頭の中のイメージに基づいて判断することを論じた。"}, {"id": "E14", "c": "E", "f": "K", "q": "障害の有無や年齢にかかわらず、すべての人が地域社会の中で普通に生活できるような社会をめざす考え方を何というか。", "o": ["ノーマライゼーション", "パターナリズム", "エスノセントリズム", "ステレオタイプ"], "e": "ノーマライゼーションはデンマークで提唱された福祉の理念であり、バリアフリーやユニバーサルデザインの考え方とも結びついている。"}, {"id": "E15", "c": "E", "f": "K", "q": "自分の属する文化を基準にして他の文化を判断し、他文化を劣ったものとみなす態度を何というか。", "o": ["エスノセントリズム（自民族中心主義）", "文化相対主義", "多文化主義", "コスモポリタニズム"], "e": "エスノセントリズムは偏見や差別を生みやすい。これに対し、文化相対主義は各文化の固有の価値を認めようとする。"}, {"id": "E16", "c": "E", "f": "K", "q": "著書『オリエンタリズム』で、西洋が東洋を自らとは異質で遅れたものとして描き出し、支配を正当化してきたことを批判した人物は誰か。", "o": ["サイード", "レヴィ＝ストロース", "リップマン", "ハンチントン"], "e": "サイードはパレスチナ出身の批評家で、西洋中心的な他者表象を批判した。"}, {"id": "E17", "c": "E", "f": "S", "X": "男女共同参画社会基本法は、1999年に制定された。", "Y": "男女雇用機会均等法は、労働者の募集・採用などについて、性別を理由とする差別を禁止している。", "xs": true, "ys": true, "e": "X・Yともに正しい。男女雇用機会均等法は1985年に制定され、その後の改正で差別禁止の範囲が広げられた。"}, {"id": "E18", "c": "E", "f": "S", "X": "尊厳死とは、回復の見込みのない患者について、本人の意思に基づき延命治療を差し控えたり中止したりして、自然な死を迎えさせることをいう。", "Y": "日本では、医師が致死薬を投与して患者を死に至らせる積極的安楽死を認める法律が制定されている。", "xs": true, "ys": false, "e": "Xは正しい。日本には積極的安楽死を認める法律はないのでYは誤り。"}, {"id": "E19", "c": "E", "f": "S", "X": "京都議定書では、発展途上国を含むすべての締約国に温室効果ガスの削減義務が課された。", "Y": "生物多様性条約は、1992年の国連環境開発会議（地球サミット）の際に署名が開始された。", "xs": false, "ys": true, "e": "京都議定書で数値目標による削減義務が課されたのは先進国のみなのでXは誤り。Yは正しい。"}, {"id": "E20", "c": "E", "f": "S", "X": "日本の個人情報保護法は、個人情報を取り扱う事業者に対する規制を一切定めていない。", "Y": "出生前診断は胎児の状態を調べる検査であり、日本では法律によって全面的に禁止されている。", "xs": false, "ys": false, "e": "個人情報保護法は事業者に利用目的の特定や第三者提供の制限などの義務を定めている。出生前診断は日本でも実施されており、法律で禁止されてはいない。"}, {"id": "E21", "c": "E", "f": "S", "X": "ブーアスティンは、マスメディアによって報道されるために作り出された出来事を「疑似イベント」とよんだ。", "Y": "文化相対主義とは、各文化にはそれぞれ固有の価値があり、優劣をつけることはできないとする考え方である。", "xs": true, "ys": true, "e": "X・Yともに正しい。"}, {"id": "E22", "c": "E", "f": "S", "X": "「持続可能な開発」とは、将来の世代の必要を損なうことなく現在の世代の必要を満たす開発をいい、国連の「環境と開発に関する世界委員会（ブルントラント委員会）」の報告書で示された。", "Y": "ボールディングは、地球を無限の資源をもつ開かれた空間とみなし、資源を浪費する「カウボーイ経済」を理想とした。", "xs": true, "ys": false, "e": "Xは正しい。ボールディングは地球を閉じた系である「宇宙船地球号」にたとえ、カウボーイ経済から宇宙船経済への転換を説いたのでYは誤り。"}, {"id": "E23", "c": "E", "f": "N", "p": "次のⅠ〜Ⅲを古い順に並べよ。", "i": ["国連人間環境会議が開かれた", "パリ協定が採択された", "国連環境開発会議（地球サミット）が開かれた"], "yr": ["1972年", "2015年", "1992年"], "ord": "132", "e": "ストックホルムの国連人間環境会議（1972年）、リオデジャネイロの地球サミット（1992年）、COP21でのパリ協定採択（2015年）の順となる。"}, {"id": "E24", "c": "E", "f": "N", "p": "次のⅠ〜Ⅲを古い順に並べよ。", "i": ["障害者差別解消法が制定された", "臓器移植法が制定された", "男女雇用機会均等法が制定された"], "yr": ["2013年", "1997年", "1985年"], "ord": "321", "e": "男女雇用機会均等法（1985年）、臓器移植法（1997年）、障害者差別解消法（2013年、2016年施行）の順となる。"}]};

function rankOf(pct){let i=0;RANKS.forEach((r,k)=>{if(pct>=r.min)i=k});return i}
function stars(i){return "★".repeat(i)+"☆".repeat(RANKS.length-1-i)}

    <p class="kbd num">正解済み ${m.ok} / ${m.n} 問（${Math.floor(m.pct)}%）</p>
    <div class="meter rk-meter"><i style="width:${prog}%"></i></div>
    <p class="kbd">${nx?`次の「${nx.t}」まで、あと <b class="num">${need}</b> 問正解`:"最高ランクに到達しました！"}</p></div></div>`;
}
const TITLES=[[100,"名誉教授級"],[90,"教授級"],[75,"博士級"],[60,"修士級"],[40,"学士級"],[0,"新入生級"]];
function sessionRank(ok,n,r0){
  const p=n?ok/n*100:0;const t=TITLES.find(x=>p>=x[0])[1];
  const r1=rankOf(mastery().pct);
  const up=r1>r0?`<div class="rk-up">ランクアップ！ ${RANKS[r0].t} → <b>${RANKS[r1].t}</b></div>`:"";
  return `<div class="rk-session"><span class="kbd">今回の称号</span><span class="rk-title">${t}</span></div>${up}`;
}

/* ===== 状態 ===== */
const app=document.getElementById("app");
let S={view:"home",size:10,fmt:"ALL"};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const rich=s=>esc(s).replace(/&lt;(\/?)(sup|sub|u)&gt;/g,"<$1$2>").replace(/&lt;br&gt;/g,"<br>");
const ROM=["Ⅰ","Ⅱ","Ⅲ"];

function header(){return `<header class="top"><div class="subject"><h1><b>倫理</b> ドリル</h1><span class="tag">共通テスト対策</span></div>
  <div class="row"><a class="subj-link" href="index.html">メニュー</a><small class="num">全${Q.length}問</small></div></header>`}
const fmtOK=q=>S.fmt==="ALL"||q.f===S.fmt;
function stats(cat){const qs=Q.filter(q=>!cat||q.c===cat);let done=0,ok=0;qs.forEach(q=>{const r=rec[q.id];if(r){done++;if(r.last)ok++}});return{n:qs.length,done,ok}}

function home(){
  delete app.dataset.cat;
  const missN=Q.filter(q=>rec[q.id]&&rec[q.id].last===false&&fmtOK(q)).length;
  const all=stats();
  app.innerHTML=header()+`
  <p class="lead">分野を選んで始めてください。1問ごとに正誤と解説が出ます。正解を増やすとランクが上がります。記録はこの端末に保存されます。</p>
  <div class="row"><span class="kbd" ${FSEG.length<3?"hidden":""}>形式</span>
    <div class="seg" role="group" aria-label="形式" ${FSEG.length<3?"hidden":""}>${FSEG.map(([k,l])=>`<button id="fm${k}" aria-pressed="${S.fmt===k}" data-fmt="${k}">${l}</button>`).join("")}</div>
    <span class="kbd">出題数</span>
    <div class="seg" role="group" aria-label="出題数">${[10,20,0].map(n=>`<button id="sz${n}" aria-pressed="${S.size===n}" data-size="${n}">${n?n+"問":"全問"}</button>`).join("")}</div></div>
  <div class="cats">${Object.entries(CATS).map(([k,c])=>{const s=stats(k);const pct=s.n?Math.round(s.ok/s.n*100):0;
    return `<button class="cat" id="cat${k}" data-cat="${k}"><span class="k">${c.k}　<span class="era-yr">${c.yr}</span></span><span class="t">${c.name}</span><span class="d">${c.d}</span>
    <span class="meter" aria-hidden="true"><i style="width:${pct}%"></i></span><span class="s num">正解済 ${s.ok} / ${s.n}　解答済 ${s.done}</span></button>`}).join("")}</div>
  <div class="row">
    <button class="btn primary" id="mix" data-cat="ALL">全分野ミックス</button>
    <button class="btn" id="review" data-cat="MISS" ${missN?"":"disabled"}>間違えた問題を復習（${missN}問）</button>
  </div>
  ${rankPanel()}
  <div class="panel"><h2>これまでの成績</h2>
    <div class="score"><span class="big">${all.done?Math.round(all.ok/all.done*100):0}<small style="font-size:18px">%</small></span>
    <span class="kbd num">直近の正答率（解答済 ${all.done} 問中 ${all.ok} 問正解）</span></div>
    <div class="row" style="margin-top:10px"><button class="btn" id="reset" ${all.done?"":"disabled"}>記録を消す</button><span class="kbd" id="resetMsg"></span></div>
  </div>
  <footer>操作：選択肢は数字キー（1〜6）、次へは Enter キーでも進めます。</footer>`;
  app.querySelectorAll("[data-size]").forEach(b=>b.onclick=()=>{S.size=+b.dataset.size;home()});
  app.querySelectorAll("[data-fmt]").forEach(b=>b.onclick=()=>{S.fmt=b.dataset.fmt;home()});
  app.querySelectorAll("button[data-cat]").forEach(b=>b.onclick=()=>start(b.dataset.cat));
  let armed=false;const rb=document.getElementById("reset");
  rb.onclick=()=>{if(!armed){armed=true;rb.textContent="本当に消す";document.getElementById("resetMsg").textContent="もう一度押すと全記録を消去します";return}rec={};save();home()};
}

function start(cat){
  let pool=Q.filter(fmtOK);
  pool=cat==="ALL"?pool:cat==="MISS"?pool.filter(q=>rec[q.id]&&rec[q.id].last===false):pool.filter(q=>q.c===cat);
  if(!pool.length){home();return}
  pool=shuffle(pool);if(S.size&&cat!=="MISS")pool=pool.slice(0,S.size);
  S={...S,view:"quiz",r0:rankOf(mastery().pct),cat,list:pool,i:0,res:[],done:false};
  question();
}

function body(q){
  if(q.f==="S")return `<p class="stem">次の文X・Yについて、その正誤の組合せとして正しいものを選べ。</p>
    <div class="stmts"><div class="stmt"><span class="lb">X</span><span class="tx">${rich(q.X)}</span></div><div class="stmt"><span class="lb">Y</span><span class="tx">${rich(q.Y)}</span></div></div>`;
  if(q.f==="N")return `<p class="stem">${rich(q.p||"次のⅠ〜Ⅲについて、古いものから年代順に正しく配列したものを選べ。")}</p>
    <div class="stmts">${q.i.map((t,k)=>`<div class="stmt"><span class="lb">${ROM[k]}</span><span class="tx">${rich(t)}</span></div>`).join("")}</div>`;
  return `<p class="stem">${rich(q.q)}</p>`;
}

function question(){
  const q=S.list[S.i];S.done=false;app.dataset.cat=q.c;
  const label=S.cat==="ALL"?"全分野ミックス":S.cat==="MISS"?"復習":CATS[S.cat].name;
  S.opts=(q.f==="K"?shuffle(q.o.map((t,k)=>({t,k}))):q.o.map((t,k)=>({t,k})));
  app.innerHTML=`${header()}<div class="qhead"><span>${label}　<span class="num">${S.i+1} / ${S.list.length}</span></span><button class="btn" id="quit" style="padding:4px 12px;font-size:13px">やめる</button></div>
  <div class="bar"><i style="width:${S.i/S.list.length*100}%"></i></div>
  <div class="panel"><div><span class="qno">${q.id}</span><span class="kbd">${CATS[q.c].name}</span><span class="fmt">${FMT[q.f]}</span></div>
    ${body(q)}
    <div class="choices ${q.f==="N"?"six":""}">${S.opts.map((o,n)=>`<button class="ch" id="ch${n}" data-n="${n}"><span class="oval">${n+1}</span><span>${rich(o.t)}</span></button>`).join("")}</div>
    <div id="fb"></div></div>`;
  app.querySelectorAll(".ch").forEach(b=>b.onclick=()=>choose(+b.dataset.n));
  document.getElementById("quit").onclick=()=>{S.view="home";home()};
}

function answerText(q){
  if(q.f==="N"){const o=q.ord.split("").map(d=>+d-1);return `${NO[q.a]}（${o.map(k=>`${rich(q.i[k])}${q.yr?`〈${rich(q.yr[k])}〉`:""}`).join(" → ")}）`}
  return rich(q.o[q.a]);
}
function choose(n){
  if(S.done)return;S.done=true;
  const q=S.list[S.i];const ok=S.opts[n].k===q.a;
  app.querySelectorAll(".ch").forEach((b,m)=>{b.disabled=true;if(S.opts[m].k===q.a)b.classList.add("right")});
  const b=document.getElementById("ch"+n);b.classList.add("sel");if(!ok)b.classList.add("wrong");
  mark(q.id,ok);S.res.push({q,ok,your:S.opts[n].t});
  const last=S.i===S.list.length-1;
  document.getElementById("fb").innerHTML=`<div class="fb ${ok?"ok":"ng"}" role="status">
    <div class="v"><span class="mark">${ok?"○":"×"}</span>${ok?"正解！":"おしい！"}</div>
    <p>正解：<b>${answerText(q)}</b></p><p>${rich(q.e)}</p></div>
    <div class="row" style="margin-top:14px"><button class="btn primary" id="next">${last?"結果を見る":"次の問題へ"}</button></div>`;
  const nx=document.getElementById("next");nx.focus({preventScroll:true});
  nx.onclick=()=>{if(last){result()}else{S.i++;question();window.scrollTo({top:0})}};
}

function qSummary(q){
  if(q.f==="S")return `X：${rich(q.X)}<br>Y：${rich(q.Y)}`;
  if(q.f==="N")return q.i.map((t,k)=>`${ROM[k]} ${rich(t)}`).join("　");
  return rich(q.q);
}
function result(){
  S.view="result";delete app.dataset.cat;
  const n=S.res.length,ok=S.res.filter(r=>r.ok).length,miss=S.res.filter(r=>!r.ok);
  app.innerHTML=header()+`<div class="panel"><h2>結果</h2>
    <div class="score"><span class="big">${ok}</span><span class="num" style="font-size:20px">/ ${n}</span><span class="kbd">正答率 ${Math.round(ok/n*100)}%</span></div>${sessionRank(ok,n,S.r0)}
    ${miss.length?`<ul class="miss">${miss.map(r=>`<li data-cat="${r.q.c}"><div class="kbd"><span class="qno">${r.q.id}</span>${CATS[r.q.c].name}<span class="fmt">${FMT[r.q.f]}</span></div>
      <div class="en">${qSummary(r.q)}</div>
      <div class="x">正解：<b>${answerText(r.q)}</b>　／　あなたの解答：${rich(r.your)}</div><div class="x">${rich(r.q.e)}</div></li>`).join("")}</ul>`:`<p style="font-size:18px;font-weight:900">全問正解！すばらしい！</p>`}
    <div class="row" style="margin-top:16px"><button class="btn primary" id="again">同じ条件でもう一度</button><button class="btn" id="back">トップへ戻る</button></div></div>`;
  document.getElementById("again").onclick=()=>start(S.cat);
  document.getElementById("back").onclick=home;
}

document.addEventListener("keydown",e=>{
  if(S.view!=="quiz")return;
  const n=S.list[S.i].o.length;
  if(/^[1-6]$/.test(e.key)&&!S.done&&+e.key<=n){choose(+e.key-1)}
  else if(e.key==="Enter"&&S.done){const nx=document.getElementById("next");if(nx&&document.activeElement!==nx){e.preventDefault();nx.click()}}
});
home();
</script>

<script>if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}</script>
</body>
</html>
