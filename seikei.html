<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Nunito:wght@600;800;900&family=Fredoka:wght@600;700&display=swap">
<style>
/* Layout: ステッカー風のポップな一列カラム。太いフチ＋ずらした影、分野ごとにカラー */
:root{
  --bg:#EAF4FF; --dot:#CFE3FA; --card:#FFFFFF; --ink:#1B1E3A; --muted:#5C6385; --edge:#1B1E3A;
  --g:#FF5C8A; --v:#2FA8FF; --o:#FFB800; --c:var(--g);
  --c-soft:#FFE3EC;
  --ok:#14B06A; --ok-soft:#DDF7EA; --ng:#FF4D4D; --ng-soft:#FFE4E4;
  --btn-ink:#FFFFFF;
  --f-jp:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",Meiryo,sans-serif;
  --f-en:"Nunito","Segoe UI",system-ui,sans-serif;
  --f-num:"Fredoka","Nunito",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#161A2E; --dot:#22284A; --card:#232945; --ink:#F2F4FF; --muted:#A9B0D4; --edge:#060815;
  --g:#FF7AA2; --v:#5BBEFF; --o:#FFC933; --c-soft:#3A2440;
  --ok:#3DD68C; --ok-soft:#173829; --ng:#FF6F6F; --ng-soft:#3E1D22; --btn-ink:#161A2E; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#161A2E; --dot:#22284A; --card:#232945; --ink:#F2F4FF; --muted:#A9B0D4; --edge:#060815;
  --g:#FF7AA2; --v:#5BBEFF; --o:#FFC933; --c-soft:#3A2440;
  --ok:#3DD68C; --ok-soft:#173829; --ng:#FF6F6F; --ng-soft:#3E1D22; --btn-ink:#161A2E; color-scheme:dark}
[data-cat="G"]{--c:var(--g)} [data-cat="V"]{--c:var(--v)} [data-cat="O"]{--c:var(--o)}
*{box-sizing:border-box}
body{background-color:var(--bg);background-image:radial-gradient(var(--dot) 2px,transparent 2.5px);background-size:22px 22px;
  color:var(--ink);font-family:var(--f-jp);font-weight:500;font-size:15px;line-height:1.7;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--v);outline-offset:3px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.subject{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.subject h1{margin:0;font-size:30px;font-weight:900;letter-spacing:.02em;text-wrap:balance;
  text-shadow:3px 3px 0 var(--g)}
.subject h1 b{font-family:var(--f-num);font-weight:700;color:var(--v);text-shadow:3px 3px 0 var(--o)}
.tag{font-size:12px;font-weight:900;background:var(--o);color:#1B1E3A;border:2px solid var(--edge);border-radius:999px;padding:2px 12px;transform:rotate(-4deg);box-shadow:2px 2px 0 var(--edge)}
.top small{font-family:var(--f-num);font-size:14px;background:var(--card);border:2px solid var(--edge);border-radius:999px;padding:2px 12px}
.lead{color:var(--muted);margin:0}
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.cat{background:var(--card);border:3px solid var(--edge);border-radius:20px;padding:16px 16px 14px;text-align:left;display:flex;flex-direction:column;gap:6px;min-width:0;
  box-shadow:5px 5px 0 var(--c);transition:transform .15s,box-shadow .15s;position:relative;overflow:hidden}
.cat::after{content:"";position:absolute;right:-24px;top:-24px;width:80px;height:80px;border-radius:50%;background:var(--c);opacity:.25}
.cat:hover{transform:translate(-2px,-3px) rotate(-.6deg);box-shadow:8px 8px 0 var(--c)}
.cat:active{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--c)}
.cat .k{font-family:var(--f-num);font-size:12px;font-weight:700;color:var(--c);letter-spacing:.12em;filter:brightness(.85)}
.cat .t{font-size:20px;font-weight:900}
.cat .d{font-size:13px;color:var(--muted)}
.meter{height:12px;background:var(--bg);border:2px solid var(--edge);border-radius:999px;position:relative;margin-top:6px;overflow:hidden}
.meter i{position:absolute;inset:0 auto 0 0;background:var(--c);border-radius:999px}
.cat .s{font-size:12px;color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{background:var(--card);border:3px solid var(--edge);border-radius:999px;padding:8px 20px;font-weight:700;box-shadow:3px 3px 0 var(--edge);transition:transform .1s,box-shadow .1s}
.btn:hover:not([disabled]){transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--edge)}
.btn:active:not([disabled]){transform:translate(3px,3px);box-shadow:0 0 0 var(--edge)}
.btn.primary{background:var(--g);color:#fff}
#mix.primary{background:linear-gradient(90deg,var(--g),var(--v))}
.btn[disabled]{opacity:.4;cursor:default;box-shadow:none}
.seg{display:inline-flex;border:3px solid var(--edge);border-radius:999px;overflow:hidden;box-shadow:3px 3px 0 var(--edge)}
.seg button{background:var(--card);border:0;padding:5px 16px;font-size:13px;font-weight:700}
.seg button+button{border-left:2px solid var(--edge)}
.seg button[aria-pressed="true"]{background:var(--o);color:#1B1E3A}
.panel{background:var(--card);border:3px solid var(--edge);border-radius:24px;padding:20px;box-shadow:6px 6px 0 var(--edge)}
.panel h2{margin:0 0 8px;font-size:18px;font-weight:900}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-size:14px;font-weight:700}
.bar{height:14px;background:var(--card);border:3px solid var(--edge);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:repeating-linear-gradient(45deg,var(--c) 0 10px,color-mix(in srgb,var(--c) 70%,#fff) 10px 20px);transition:width .35s cubic-bezier(.3,1.6,.5,1)}
.qno{display:inline-block;background:var(--c);color:#fff;font-family:var(--f-num);font-weight:700;padding:1px 10px;margin-right:8px;font-size:13px;border-radius:999px;border:2px solid var(--edge)}
[data-cat="O"] .qno{color:#1B1E3A}
.stem{font-family:var(--f-en);font-weight:800;font-size:21px;line-height:1.6;margin:14px 0 6px}
.stem .blank{display:inline-block;min-width:5.5em;background:var(--c-soft);border:2px dashed var(--c);border-radius:10px;text-align:center;font-family:var(--f-num);font-size:14px;color:var(--ink);line-height:1.8}
.ja{color:var(--muted);font-size:14px;margin:0}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
@media (max-width:520px){.choices{grid-template-columns:1fr}}
.ch{display:flex;align-items:center;gap:12px;background:var(--card);border:3px solid var(--edge);border-radius:16px;padding:10px 14px;text-align:left;font-family:var(--f-en);font-weight:800;font-size:17px;
  box-shadow:3px 3px 0 var(--edge);transition:transform .12s,box-shadow .12s;min-width:0}
.ch:hover:not([disabled]){transform:translate(-1px,-2px);box-shadow:4px 5px 0 var(--c)}
.oval{flex:none;width:30px;height:30px;border:2px solid var(--edge);border-radius:50%;display:grid;place-items:center;font-family:var(--f-num);font-size:14px;font-weight:700;background:var(--c);color:#fff}
[data-cat="O"] .oval{color:#1B1E3A}
.ch.right{background:var(--ok-soft);border-color:var(--ok);box-shadow:3px 3px 0 var(--ok)}
.ch.right .oval{background:var(--ok)}
.ch.wrong{background:var(--ng-soft);border-color:var(--ng);box-shadow:3px 3px 0 var(--ng);animation:shake .35s}
.ch.wrong .oval{background:var(--ng)}
.ch.sel.right{animation:pop .4s}
.ch[disabled]{cursor:default}
.ch[disabled]:not(.right):not(.wrong){opacity:.55}
.fb{margin-top:18px;border:3px solid var(--ok);border-radius:18px;background:var(--ok-soft);padding:12px 16px;animation:pop .35s}
.fb.ng{border-color:var(--ng);background:var(--ng-soft)}
.fb .v{font-weight:900;font-size:20px;display:flex;align-items:center;gap:8px}
.fb.ok .v{color:var(--ok)} .fb.ng .v{color:var(--ng)}
.fb p{margin:6px 0 0}
.fb .en{font-family:var(--f-en);font-weight:800;font-size:16px}
.mark{font-family:var(--f-num);font-size:26px;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff;border:2px solid var(--edge)}
.fb.ok .mark{background:var(--ok)} .fb.ng .mark{background:var(--ng)}
/* 並べ替え */
.build{min-height:60px;border:3px dashed var(--c);border-radius:16px;background:var(--bg);padding:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:14px;font-family:var(--f-en);font-weight:800;font-size:17px}
.build .fix{color:var(--muted)}
.build .ph{color:var(--muted);font-family:var(--f-jp);font-size:13px}
.pool{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{border:2px solid var(--edge);border-radius:12px;background:var(--card);padding:4px 14px;font-family:var(--f-en);font-weight:800;font-size:17px;box-shadow:2px 2px 0 var(--edge);transition:transform .1s}
.chip:hover:not([disabled]){transform:translateY(-2px) rotate(-2deg)}
.chip.used{opacity:.2;cursor:default;box-shadow:none}
.build .chip{background:var(--c);color:#fff;animation:pop .25s}
[data-cat="O"] .build .chip{color:#1B1E3A}
.kbd{font-size:12px;color:var(--muted)}
.score{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.score .big{font-family:var(--f-num);font-weight:700;font-size:56px;line-height:1;color:var(--g);text-shadow:3px 3px 0 var(--o)}
.miss{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;gap:10px}
.miss li{border:2px solid var(--edge);border-radius:14px;padding:10px 12px;min-width:0;background:var(--bg)}
.miss .en{font-family:var(--f-en);font-weight:800;font-size:16px}
.miss .en b{color:var(--ok)}
.miss .x{font-size:13px;color:var(--muted)}
footer{color:var(--muted);font-size:12px;text-align:center}
@keyframes pop{0%{transform:scale(.9)}60%{transform:scale(1.04)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
<style>
/* 日本史用の追加：時代ごとのカラーと設問ブロック */
:root{--ey:#B88A00;--ea:#F26A2E;--em:#0E9C8C;--ee:#E8457A;--ed:#7353F0;--ep:#2C8FE0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ea:#FF8F5C;--em:#2CC7B5;--ee:#FF7AA2;--ed:#9C85FF;--ep:#5BBEFF;--ey:#E6C340}}
:root[data-theme="dark"]{--ea:#FF8F5C;--em:#2CC7B5;--ee:#FF7AA2;--ed:#9C85FF;--ep:#5BBEFF;--ey:#E6C340}
[data-cat="A"]{--c:var(--ea)} [data-cat="B"]{--c:var(--em)} [data-cat="C"]{--c:var(--ee)} [data-cat="D"]{--c:var(--ed)} [data-cat="E"]{--c:var(--ep)}
.stem{font-family:var(--f-jp);font-weight:700;font-size:18px}
.stmts{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.stmt{display:flex;gap:10px;align-items:flex-start;background:var(--bg);border:2px solid var(--edge);border-radius:14px;padding:8px 12px;min-width:0}
.stmt .lb{flex:none;font-family:var(--f-num);font-weight:700;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--c);color:#fff;border:2px solid var(--edge)}
.stmt .tx{font-weight:700;min-width:0}
.ch{font-family:var(--f-jp);font-weight:700}
.choices.six{grid-template-columns:repeat(3,1fr)}
@media (max-width:520px){.choices.six{grid-template-columns:1fr 1fr}}
.choices.six .ch{white-space:nowrap;gap:8px;padding:10px}
@media (max-width:520px){.choices.six .ch{font-size:15px;padding:10px 8px}.choices.six .oval{width:26px;height:26px;font-size:13px}}
.fmt{display:inline-block;font-size:11px;font-weight:900;border:2px solid var(--edge);border-radius:999px;padding:0 8px;margin-left:6px;background:var(--o);color:#1B1E3A}
.era-yr{font-family:var(--f-num);font-size:12px;color:var(--muted)}
.subj-link{font-size:13px;font-weight:700;color:var(--ink);text-decoration:none;border:2px solid var(--edge);border-radius:999px;padding:2px 12px;background:var(--card)}
.subj-link:hover{background:var(--o);color:#1B1E3A}
.miss .en{font-family:var(--f-jp);font-weight:700}
.subject h1 b{font-family:var(--f-jp);font-weight:900}
</style>
<style>
/* ランク表示 */
.rankp{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.rk-body{flex:1;min-width:200px}
.rk-body h2{margin:0 0 2px}
.rk-body p{margin:4px 0}
.rk-meter i{background:linear-gradient(90deg,var(--o),var(--g))}
.rk-badge{flex:none;width:118px;height:118px;border-radius:50%;border:4px solid var(--edge);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;box-shadow:4px 4px 0 var(--edge);transform:rotate(-6deg);text-align:center;color:#1B1E3A}
.rk-badge .rk-en{font-family:var(--f-num);font-size:10px;letter-spacing:.12em;font-weight:700}
.rk-badge .rk-t{font-size:22px;font-weight:900;line-height:1.2}
.rk-badge .rk-st{font-size:12px;letter-spacing:1px}
.rk0{background:#E4E8F2}.rk1{background:#BFE6FF}.rk2{background:#C9F2DA}.rk3{background:#FFD873}.rk4{background:#FFB3CB}
.rk5{background:conic-gradient(#FFD873,#FFB3CB,#BFE6FF,#C9F2DA,#FFD873)}
.rk-session{display:flex;align-items:baseline;gap:10px;margin-top:12px;flex-wrap:wrap}
.rk-title{font-size:26px;font-weight:900;color:var(--ink);background:var(--o);border:3px solid var(--edge);border-radius:999px;padding:0 16px;box-shadow:3px 3px 0 var(--edge);transform:rotate(-2deg);display:inline-block;color:#1B1E3A}
.rk-up{margin-top:12px;font-weight:900;font-size:18px;color:var(--g);animation:pop .5s}

<script>
/* ===== 問題データ ===== */
const D={"cats": {"A": {"name": "日本国憲法と人権", "k": "CONSTITUTION", "yr": "公共・政治経済", "d": "憲法の基本原理、基本的人権の保障と主な判例"}, "B": {"name": "日本の政治機構", "k": "GOVERNMENT", "yr": "公共・政治経済", "d": "国会・内閣・裁判所・地方自治・選挙制度"}, "C": {"name": "国際政治・国際法", "k": "INTERNATIONAL", "yr": "政治経済", "d": "国際法と国際連合、冷戦と軍縮、日本の安全保障"}, "D": {"name": "経済のしくみ", "k": "ECONOMY", "yr": "公共・政治経済", "d": "市場と価格、企業、国民所得、金融と財政"}, "E": {"name": "日本経済と国際経済・社会保障・労働", "k": "JAPAN & GLOBAL", "yr": "公共・政治経済", "d": "戦後日本経済、貿易と為替、社会保障、労働問題"}}, "q": [{"id": "A01", "c": "A", "f": "K", "q": "日本国憲法において、天皇の国事に関するすべての行為に必要とされるものはどれか。", "o": ["内閣の助言と承認", "国会の議決と承認", "最高裁判所の同意", "衆議院議長の助言"], "e": "憲法3条により、天皇の国事行為には内閣の助言と承認が必要で、内閣がその責任を負う。"}, {"id": "A02", "c": "A", "f": "K", "q": "日本国憲法の改正手続として正しいものはどれか。", "o": ["各議院の総議員の3分の2以上の賛成で国会が発議し、国民投票で過半数の賛成を得る", "各議院の出席議員の3分の2以上の賛成で国会が発議し、国民投票で過半数の賛成を得る", "衆議院の総議員の3分の2以上の賛成で発議し、参議院の同意は必要としない", "各議院の総議員の過半数の賛成で発議し、国民投票で3分の2以上の賛成を得る"], "e": "憲法96条は、各議院の総議員の3分の2以上の賛成による発議と、国民投票での過半数の承認を定めている。"}, {"id": "A03", "c": "A", "f": "K", "q": "国民投票法（日本国憲法の改正手続に関する法律）で定められている投票権年齢はどれか。", "o": ["満18歳以上", "満20歳以上", "満16歳以上", "満25歳以上"], "e": "国民投票法の投票権年齢は2018年から満18歳以上となっている。選挙権年齢と同じである。"}, {"id": "A04", "c": "A", "f": "K", "q": "最高裁判所が、法の下の平等（憲法14条）に反するとして違憲と判断したものはどれか。", "o": ["尊属殺人を普通殺人より著しく重く罰していた刑法の規定", "地鎮祭に市が公金を支出したこと（津地鎮祭訴訟）", "日米安全保障条約に基づく米軍の駐留（砂川事件）", "生活保護の給付水準をめぐる朝日訴訟の保護基準"], "e": "1973年の尊属殺重罰規定違憲判決は、刑罰が著しく不合理な差別であるとして刑法200条を違憲とした。津地鎮祭訴訟は合憲、砂川事件は統治行為論で判断が回避された。"}, {"id": "A05", "c": "A", "f": "K", "q": "社会権に分類される権利はどれか。", "o": ["勤労の権利", "表現の自由", "請願権", "財産権"], "e": "社会権には生存権・教育を受ける権利・勤労の権利・労働三権がある。表現の自由と財産権は自由権、請願権は請求権（参政権的権利）に分類される。"}, {"id": "A06", "c": "A", "f": "K", "q": "憲法25条の生存権について、最高裁判所が朝日訴訟や堀木訴訟で示した考え方に最も近いものはどれか。", "o": ["国の政策的な努力目標を定めたもので、具体的な内容は立法府や行政府の広い裁量に委ねられる", "国民は憲法25条を直接の根拠として、国に具体的な金額の給付を請求できる", "生存権は自由権であり、国家が個人の生活に介入しないことを求める権利である", "生存権は外国人には一切保障されず、日本国民のみが裁判で主張できる"], "e": "最高裁は生存権規定を国の責務を宣言したものと捉え、具体的な基準の設定には立法府・行政府の広い裁量を認めた（プログラム規定説に近い立場）。"}, {"id": "A07", "c": "A", "f": "K", "q": "小説のモデルとされた人物が私生活を公開されたとして訴え、1964年に東京地裁がプライバシーの権利を認めた事件はどれか。", "o": ["『宴のあと』事件", "大阪空港公害訴訟", "家永教科書裁判", "恵庭事件"], "e": "『宴のあと』事件ではプライバシーの権利が「私生活をみだりに公開されない権利」として認められた。大阪空港公害訴訟は環境権、家永教科書裁判は教科書検定、恵庭事件は自衛隊が争点となった。"}, {"id": "A08", "c": "A", "f": "K", "q": "「知る権利」を背景として、国の行政機関が保有する行政文書の開示を請求できることを定めた法律はどれか。", "o": ["情報公開法", "個人情報保護法", "特定秘密保護法", "通信傍受法"], "e": "1999年に制定された情報公開法により、何人も国の行政機関に行政文書の開示を請求できるようになった。"}, {"id": "A09", "c": "A", "f": "K", "q": "日本の違憲審査制についての説明として正しいものはどれか。", "o": ["具体的な訴訟事件の解決に必要な範囲で、すべての裁判所が法令などの合憲性を審査する", "最高裁判所だけが、具体的な事件と関係なく法令の合憲性を抽象的に審査する", "内閣法制局が法令の合憲性を最終的に判断し、裁判所はそれに拘束される", "国会の憲法審査会が法律の違憲を宣言し、その法律を無効にする"], "e": "日本はアメリカ型の付随的違憲審査制をとり、下級裁判所も違憲審査権をもつ。最高裁判所は終審裁判所である（憲法81条）。"}, {"id": "A10", "c": "A", "f": "K", "q": "日本国憲法が定める人身の自由に関する記述として正しいものはどれか。", "o": ["現行犯として逮捕される場合を除き、裁判官が発する令状がなければ逮捕されない", "本人の自白だけが証拠である場合でも、有罪とすることができる", "同一の犯罪について、重ねて刑事上の責任を問うことができる", "公務員による拷問は、公共の福祉のために必要な場合に限り許される"], "e": "憲法33条は令状主義を定める。自白のみでの有罪は禁止（38条3項）、二重処罰は禁止（39条）、拷問は絶対に禁止されている（36条）。"}, {"id": "A11", "c": "A", "f": "K", "q": "政教分離の原則に反するとして、最高裁判所が違憲と判断した訴訟はどれか。", "o": ["愛媛玉串料訴訟", "津地鎮祭訴訟", "長沼ナイキ基地訴訟", "堀木訴訟"], "e": "1997年の愛媛玉串料訴訟で、県が靖国神社などに公金から玉串料を支出したことは政教分離に反し違憲とされた。津地鎮祭訴訟は合憲とされた。"}, {"id": "A12", "c": "A", "f": "K", "q": "大日本帝国憲法の特徴として正しいものはどれか。", "o": ["陸海軍の指揮命令権である統帥権は天皇に属し、議会や内閣の関与が及ばないとされた", "主権は国民にあり、天皇は国民統合の象徴とされた", "帝国議会は衆議院と参議院の二院で構成された", "裁判所に法律の違憲審査権が明文で与えられていた"], "e": "大日本帝国憲法は天皇主権の欽定憲法で、統帥権の独立が認められていた。帝国議会は貴族院と衆議院からなり、違憲審査権の規定はなかった。"}, {"id": "A13", "c": "A", "f": "K", "q": "2013年に最高裁判所が法の下の平等に反し違憲と判断した規定はどれか。", "o": ["婚外子（非嫡出子）の法定相続分を嫡出子の2分の1とする民法の規定", "夫婦は婚姻の際に同じ氏を称するとする民法の規定", "死刑を定める刑法の規定", "裁判員制度を定める法律の規定"], "e": "2013年の決定を受けて民法が改正され、婚外子と嫡出子の相続分は同等になった。夫婦同氏規定、死刑、裁判員制度はいずれも最高裁で合憲とされている。"}, {"id": "A14", "c": "A", "f": "K", "q": "薬局開設の距離制限を定めた旧薬事法の規定を違憲とした1975年の最高裁判決で、主に問題となった権利はどれか。", "o": ["職業選択の自由", "集会の自由", "学問の自由", "信教の自由"], "e": "薬事法距離制限違憲判決は、距離制限が必要かつ合理的な規制とはいえないとして、憲法22条の職業選択の自由を侵害すると判断した。"}, {"id": "A15", "c": "A", "f": "S", "X": "日本国憲法では、天皇は日本国と日本国民統合の象徴であり、その地位は主権の存する日本国民の総意に基づくとされている。", "Y": "日本国憲法では、国会議員は在任中、いかなる場合も逮捕されないと定められている。", "xs": true, "ys": false, "e": "Xは憲法1条の内容で正しい。Yは誤りで、不逮捕特権は国会の会期中に限られ、法律の定める場合（院外の現行犯など）は例外となる（50条）。"}, {"id": "A16", "c": "A", "f": "S", "X": "2022年4月から、民法上の成年年齢は20歳から18歳に引き下げられた。", "Y": "成年年齢の引下げにより、18歳になれば親の同意がなくてもクレジットカードの契約などを結べるようになった。", "xs": true, "ys": true, "e": "どちらも正しい。成年に達すると未成年者取消権が使えなくなるため、契約トラブルへの注意が必要となる。なお飲酒・喫煙は引き続き20歳から。"}, {"id": "A17", "c": "A", "f": "S", "X": "日本国憲法では、基本的人権は法律の範囲内においてのみ保障されるとされている。", "Y": "日本国憲法では、国民は勤労の権利を有し、義務を負うと定められている。", "xs": false, "ys": true, "e": "Xは誤りで、「法律の範囲内」という法律の留保は大日本帝国憲法の特徴である。Yは憲法27条の内容で正しい。"}, {"id": "A18", "c": "A", "f": "S", "X": "日本国憲法では、私有財産を公共のために用いる場合でも、補償は不要であると定められている。", "Y": "日本国憲法では、検閲は公共の福祉のために必要な限度で認められると定められている。", "xs": false, "ys": false, "e": "どちらも誤り。29条3項は正当な補償の下で私有財産を公共のために用いることができると定め、21条2項は検閲を例外なく禁止している。"}, {"id": "A19", "c": "A", "f": "S", "X": "日本国憲法では、何人も自己に不利益な供述を強要されないと定められている。", "Y": "刑事被告人が自ら弁護人を依頼できないときは、国が弁護人を付けると定められている。", "xs": true, "ys": true, "e": "どちらも正しい。Xは黙秘権（38条1項）、Yは国選弁護人制度（37条3項）の根拠である。"}, {"id": "A20", "c": "A", "f": "S", "X": "大日本帝国憲法は、天皇が定めて国民に与える欽定憲法であった。", "Y": "日本国憲法は、帝国議会の審議を経ずに、新しい憲法として公布された。", "xs": true, "ys": false, "e": "Xは正しい。Yは誤りで、日本国憲法は大日本帝国憲法の改正手続に従い、帝国議会の審議・議決を経て1946年に公布された。"}, {"id": "A21", "c": "A", "f": "N", "p": "次の出来事を古い順に並べよ。", "i": ["フランス人権宣言", "マグナ・カルタ", "権利章典"], "yr": ["1789年", "1215年", "1689年"], "ord": "231", "e": "マグナ・カルタ（1215年）→権利章典（1689年）→フランス人権宣言（1789年）の順。いずれも人権保障の歴史上の重要文書である。"}, {"id": "A22", "c": "A", "f": "N", "p": "次の出来事を古い順に並べよ。", "i": ["国際人権規約の採択", "世界人権宣言の採択", "日本国憲法の公布"], "yr": ["1966年", "1948年", "1946年"], "ord": "321", "e": "日本国憲法公布（1946年）→世界人権宣言（1948年）→国際人権規約（1966年）の順。国際人権規約は世界人権宣言を条約化したものである。"}, {"id": "A23", "c": "A", "f": "N", "p": "次の出来事を古い順に並べよ。", "i": ["愛媛玉串料訴訟の最高裁違憲判決", "婚外子相続分規定の最高裁違憲決定", "尊属殺重罰規定の最高裁違憲判決"], "yr": ["1997年", "2013年", "1973年"], "ord": "312", "e": "尊属殺重罰規定違憲判決（1973年）→愛媛玉串料訴訟（1997年）→婚外子相続分規定違憲決定（2013年）の順。"}, {"id": "A24", "c": "A", "f": "N", "p": "次の出来事を古い順に並べよ。", "i": ["男女雇用機会均等法の制定", "民法上の成年年齢が18歳となる改正法の施行", "情報公開法の制定"], "yr": ["1985年", "2022年", "1999年"], "ord": "132", "e": "男女雇用機会均等法（1985年）→情報公開法（1999年）→成年年齢18歳の施行（2022年）の順。"}, {"id": "B01", "c": "B", "f": "K", "q": "衆議院だけに認められている権限はどれか。", "o": ["内閣不信任の決議", "国政調査権の行使", "弾劾裁判所の設置", "憲法改正の発議"], "e": "内閣不信任決議は衆議院のみに認められ、可決されると内閣は10日以内に解散か総辞職を選ぶ（69条）。国政調査権・弾劾裁判所の設置・憲法改正の発議は両議院が関わる。"}, {"id": "B02", "c": "B", "f": "K", "q": "衆議院で可決した法律案を参議院が否決した場合の扱いとして正しいものはどれか。", "o": ["衆議院が出席議員の3分の2以上の多数で再び可決すれば法律となる", "衆議院が総議員の過半数で再び可決すれば法律となる", "必ず両院協議会を開き、その成案が両院で可決されなければ廃案となる", "参議院の議決が優先し、その法律案は直ちに廃案となる"], "e": "憲法59条により、衆議院が出席議員の3分の2以上で再可決すれば法律となる。法律案の場合、両院協議会の開催は任意である。"}, {"id": "B03", "c": "B", "f": "K", "q": "内閣についての日本国憲法の規定として正しいものはどれか。", "o": ["国務大臣の過半数は、国会議員の中から選ばれなければならない", "内閣総理大臣は、衆議院議員の中から選ばれなければならない", "国務大臣を任命するには、国会の同意が必要である", "内閣総理大臣は、国民の直接選挙によって選ばれる"], "e": "内閣総理大臣は国会議員の中から国会の議決で指名され（67条）、国務大臣は内閣総理大臣が任命するが、その過半数は国会議員でなければならない（68条）。"}, {"id": "B04", "c": "B", "f": "K", "q": "衆議院の解散による総選挙の日から30日以内に召集される国会はどれか。", "o": ["特別会（特別国会）", "常会（通常国会）", "臨時会（臨時国会）", "参議院の緊急集会"], "e": "解散総選挙後30日以内に特別会が召集され、内閣総理大臣の指名が行われる（54条）。"}, {"id": "B05", "c": "B", "f": "K", "q": "最高裁判所の裁判官だけを対象として行われる制度はどれか。", "o": ["国民審査", "弾劾裁判所による裁判", "心身の故障を理由とする罷免の裁判", "定年による退官"], "e": "国民審査は最高裁判所裁判官のみが対象である。弾劾裁判や心身の故障による罷免、定年は下級裁判所の裁判官にも関係する。"}, {"id": "B06", "c": "B", "f": "K", "q": "裁判員制度の説明として正しいものはどれか。", "o": ["重大な刑事事件の第一審で、裁判員が裁判官とともに有罪・無罪と量刑を判断する", "民事事件の控訴審で、裁判員が裁判官とともに判決を下す", "裁判員は有罪・無罪のみを判断し、量刑は裁判官だけで決める", "検察官の不起訴処分が妥当かどうかを、裁判員が審査する"], "e": "2009年に始まった裁判員制度は、地方裁判所で行われる重大な刑事事件の第一審が対象で、事実認定と量刑の両方に裁判員が関わる。"}, {"id": "B07", "c": "B", "f": "K", "q": "検察官が事件を起訴しなかった処分の当否を、くじで選ばれた市民が審査する機関はどれか。", "o": ["検察審査会", "裁判員制度", "最高裁判所裁判官の国民審査", "陪審制"], "e": "検察審査会が2回「起訴すべき」と議決すると、強制的に起訴される制度がある。"}, {"id": "B08", "c": "B", "f": "K", "q": "地方自治の直接請求のうち、条例の制定・改廃の請求を受け付ける請求先はどれか。", "o": ["首長", "選挙管理委員会", "議会の議長", "監査委員"], "e": "条例の制定・改廃の請求は有権者の50分の1以上の署名を集めて首長に行う。議会の解散や首長・議員の解職の請求は選挙管理委員会、事務の監査請求は監査委員に行う。"}, {"id": "B09", "c": "B", "f": "K", "q": "「地方自治は民主主義の学校」という言葉を残したイギリスの政治学者はどれか。", "o": ["ブライス", "ロック", "モンテスキュー", "ルソー"], "e": "ブライスは『近代民主政治』で、住民が地方自治を通じて民主政治を学ぶことを説いた。"}, {"id": "B10", "c": "B", "f": "K", "q": "現在の衆議院議員選挙の制度はどれか。", "o": ["小選挙区比例代表並立制", "中選挙区制", "小選挙区比例代表併用制", "全国区制"], "e": "衆議院は1994年の政治改革で中選挙区制から小選挙区比例代表並立制に改められ、1996年の総選挙から実施された。"}, {"id": "B11", "c": "B", "f": "K", "q": "日本の比例代表選挙で、各政党への議席配分に用いられている方式はどれか。", "o": ["ドント式", "サン＝ラグ式", "ヘア＝ニーマイヤー式", "単記移譲式"], "e": "ドント式は、各党の得票数を1、2、3…の整数で順に割り、商の大きい順に議席を配分する方式である。"}, {"id": "B12", "c": "B", "f": "K", "q": "議員定数の不均衡（一票の格差）訴訟で、最高裁判所が選挙を違憲としながらも、公の利益を考慮して選挙自体は無効としなかった考え方はどれか。", "o": ["事情判決の法理", "統治行為論", "プログラム規定説", "部分社会の法理"], "e": "最高裁は1976年・1985年に衆議院議員定数配分を違憲としたが、事情判決の法理を用いて選挙は無効としなかった。"}, {"id": "B13", "c": "B", "f": "K", "q": "両議院が国政に関する調査を行い、証人の出頭や証言、記録の提出を求めることができる権限はどれか。", "o": ["国政調査権", "弾劾裁判権", "違憲審査権", "恩赦の決定権"], "e": "国政調査権は憲法62条に規定されている。恩赦の決定は内閣の権限、違憲審査権は裁判所の権限である。"}, {"id": "B14", "c": "B", "f": "K", "q": "内閣の権限として正しいものはどれか。", "o": ["最高裁判所の長たる裁判官を指名すること", "条約を承認すること", "弾劾裁判所を設置すること", "法律の合憲性を最終的に判断すること"], "e": "内閣は最高裁判所長官を指名し（天皇が任命）、その他の最高裁判事を任命する。条約の承認と弾劾裁判所の設置は国会、違憲審査の終審は最高裁判所の権限である。"}, {"id": "B15", "c": "B", "f": "S", "X": "参議院議員の任期は6年で、3年ごとに半数が改選される。", "Y": "衆議院議員の被選挙権は、満30歳以上の者に認められている。", "xs": true, "ys": false, "e": "Xは正しい。Yは誤りで、衆議院議員の被選挙権は満25歳以上、参議院議員が満30歳以上である。"}, {"id": "B16", "c": "B", "f": "S", "X": "衆議院で内閣不信任決議案が可決された場合、内閣は10日以内に衆議院が解散されない限り、総辞職しなければならない。", "Y": "日本国憲法では、国会は国権の最高機関であって、国の唯一の立法機関であるとされている。", "xs": true, "ys": true, "e": "どちらも正しい。Xは憲法69条、Yは憲法41条の内容である。"}, {"id": "B17", "c": "B", "f": "S", "X": "地方公共団体の首長は、その地方議会の議員の中から議会によって選ばれる。", "Y": "一つの地方公共団体のみに適用される特別法は、その住民の投票で過半数の同意を得なければ制定できない。", "xs": false, "ys": true, "e": "Xは誤りで、首長は住民の直接選挙で選ばれる（二元代表制）。Yは憲法95条の内容で正しい。"}, {"id": "B18", "c": "B", "f": "S", "X": "インターネットを利用した選挙運動は、現在も全面的に禁止されている。", "Y": "日本では、候補者が有権者の家を一軒ずつ訪ねる戸別訪問による選挙運動が認められている。", "xs": false, "ys": false, "e": "どちらも誤り。2013年の公職選挙法改正でインターネット選挙運動が解禁された。戸別訪問は禁止されている。"}, {"id": "B19", "c": "B", "f": "S", "X": "弾劾裁判所は、最高裁判所の裁判官によって構成される。", "Y": "内閣が制定する命令は、条例とよばれる。", "xs": false, "ys": false, "e": "どちらも誤り。弾劾裁判所は両議院の議員で構成される。内閣が制定する命令は政令であり、条例は地方公共団体の議会が制定する。"}, {"id": "B20", "c": "B", "f": "S", "X": "地方交付税は、国が使いみちを特定して地方公共団体に交付する資金である。", "Y": "1999年に成立した地方分権一括法により、機関委任事務は廃止された。", "xs": false, "ys": true, "e": "Xは誤りで、地方交付税は使途が特定されない一般財源である。使途が特定されるのは国庫支出金。Yは正しく、事務は自治事務と法定受託事務に再編された。"}, {"id": "B21", "c": "B", "f": "N", "p": "次の出来事を古い順に並べよ。", "i": ["細川護熙を首相とする非自民連立内閣の成立", "民主党を中心とする政権の誕生", "自由民主党の結成による55年体制の成立"], "yr": ["1993年", "2009年", "1955年"], "ord": "312", "e": "55年体制の成立（1955年）→細川連立内閣（1993年）→民主党政権（2009年）の順。"}, {"id": "B22", "c": "B", "f": "N", "p": "次の出来事を古い順に並べよ。", "i": ["選挙権年齢を18歳以上とした初めての国政選挙の実施", "満25歳以上の男子に選挙権を認める普通選挙法の成立", "女性の参政権を認める選挙法の改正"], "yr": ["2016年", "1925年", "1945年"], "ord": "231", "e": "男子普通選挙法（1925年）→女性参政権を認める改正（1945年）→18歳選挙権の初の国政選挙（2016年）の順。"}, {"id": "B23", "c": "B", "f": "N", "p": "次の出来事を古い順に並べよ。", "i": ["大津事件", "裁判員制度の開始", "日本国憲法の施行と最高裁判所の設置"], "yr": ["1891年", "2009年", "1947年"], "ord": "132", "e": "大津事件（1891年）→日本国憲法施行・最高裁判所設置（1947年）→裁判員制度開始（2009年）の順。大津事件は司法権の独立を守った事例とされる。"}, {"id": "B24", "c": "B", "f": "N", "p": "次の出来事を古い順に並べよ。", "i": ["中央省庁の再編（1府12省庁体制）", "ロッキード事件の発覚", "デジタル庁の発足"], "yr": ["2001年", "1976年", "2021年"], "ord": "213", "e": "ロッキード事件（1976年）→中央省庁再編（2001年）→デジタル庁発足（2021年）の順。"}, {"id": "C01", "c": "C", "f": "K", "q": "『戦争と平和の法』を著し、「国際法の父」とよばれる人物はどれか。", "o": ["グロティウス", "ホッブズ", "カント", "モンテスキュー"], "e": "グロティウスは自然法に基づき、戦争においても守るべき法があると説いた。カントは『永遠平和のために』を著した。"}, {"id": "C02", "c": "C", "f": "K", "q": "三十年戦争を終結させ、主権国家を単位とする国際社会が成立する契機となった条約はどれか。", "o": ["ウェストファリア条約", "ヴェルサイユ条約", "パリ不戦条約", "ウィーン議定書"], "e": "1648年のウェストファリア条約により、主権・対等な国家が並び立つ主権国家体制が成立したとされる。"}, {"id": "C03", "c": "C", "f": "K", "q": "国際連合の安全保障理事会についての説明として正しいものはどれか。", "o": ["実質事項の決定は、常任理事国が1か国でも反対すれば成立しない", "非常任理事国にも、常任理事国と同様に拒否権が認められている", "安全保障理事会の決定は勧告にとどまり、加盟国を拘束することはない", "常任理事国は、総会の選挙で2年ごとに選び直される"], "e": "常任理事国（米・英・仏・露・中）は拒否権をもつ。非常任理事国10か国は任期2年で総会が選ぶ。安保理の決定は加盟国を拘束する。"}, {"id": "C04", "c": "C", "f": "K", "q": "国際司法裁判所（ICJ）の説明として正しいものはどれか。", "o": ["国家間の紛争を扱い、裁判を始めるには原則として当事国の同意が必要である", "戦争犯罪などを行った個人を裁く常設の裁判所である", "本部はスイスのジュネーブに置かれている", "安全保障理事会の下部機関で、常任理事国が判決に拒否権をもつ"], "e": "国際司法裁判所はオランダのハーグにある国連の主要機関で、当事国が付託に同意しなければ裁判は始まらない。"}, {"id": "C05", "c": "C", "f": "K", "q": "集団殺害犯罪（ジェノサイド）や戦争犯罪などを犯した個人を裁くために設けられた常設の国際裁判所はどれか。", "o": ["国際刑事裁判所（ICC）", "国際司法裁判所（ICJ）", "常設仲裁裁判所", "国際海洋法裁判所"], "e": "国際刑事裁判所は2003年に活動を開始し、日本は2007年に加盟した。アメリカ・中国・ロシアは加盟していない。"}, {"id": "C06", "c": "C", "f": "K", "q": "日本が1992年に成立したPKO協力法に基づき、初めて自衛隊を国連平和維持活動に派遣した国はどれか。", "o": ["カンボジア", "イラク", "南スーダン", "東ティモール"], "e": "1992年、PKO協力法に基づき自衛隊がカンボジアに派遣された。イラクへの派遣は2003年のイラク復興支援特別措置法による。"}, {"id": "C07", "c": "C", "f": "K", "q": "国連海洋法条約で、沿岸国が資源の探査・開発などの権利をもつ排他的経済水域（EEZ）の範囲はどれか。", "o": ["基線から200海里まで", "基線から12海里まで", "基線から24海里まで", "基線から100海里まで"], "e": "領海は基線から12海里、接続水域は24海里まで、排他的経済水域は200海里までである。"}, {"id": "C08", "c": "C", "f": "K", "q": "対立する国々も含めて一つの体制に加わり、平和を破壊した国に対して加盟国全体で制裁を加える仕組みはどれか。", "o": ["集団安全保障", "勢力均衡", "集団的自衛権", "非同盟主義"], "e": "集団安全保障は国際連盟・国際連合が採用した方式である。勢力均衡は対立する陣営間の力のつりあいで平和を保とうとする考え方。"}, {"id": "C09", "c": "C", "f": "K", "q": "核兵器の開発・保有・使用などを全面的に禁止し、2021年に発効した条約はどれか。", "o": ["核兵器禁止条約", "核拡散防止条約（NPT）", "包括的核実験禁止条約（CTBT）", "部分的核実験禁止条約（PTBT）"], "e": "核兵器禁止条約は2017年に採択され2021年に発効したが、核保有国や日本は参加していない。CTBTは未発効である。"}, {"id": "C10", "c": "C", "f": "K", "q": "1989年にアメリカとソ連の首脳が会談し、冷戦の終結を宣言した会談はどれか。", "o": ["マルタ会談", "ヤルタ会談", "ポツダム会談", "レイキャビク会談"], "e": "マルタ会談でブッシュ（父）大統領とゴルバチョフ書記長が冷戦終結を宣言した。ヤルタ会談とポツダム会談は第二次世界大戦中の1945年。"}, {"id": "C11", "c": "C", "f": "K", "q": "難民条約などに定められている、難民を迫害のおそれのある国へ追放・送還してはならないという原則はどれか。", "o": ["ノン・ルフールマン原則", "内政不干渉の原則", "民族自決の原則", "公海自由の原則"], "e": "ノン・ルフールマン原則は難民保護の中核をなす原則である。日本は1981年に難民条約に加入した。"}, {"id": "C12", "c": "C", "f": "K", "q": "安全保障理事会が拒否権の行使で機能しない場合に、総会が平和維持のための集団的措置を勧告できるとした1950年の総会決議はどれか。", "o": ["平和のための結集決議", "世界人権宣言", "友好関係原則宣言", "植民地独立付与宣言"], "e": "朝鮮戦争をきっかけに採択された「平和のための結集」決議により、緊急特別総会が開かれるようになった。"}, {"id": "C13", "c": "C", "f": "K", "q": "国際連盟の特徴として正しいものはどれか。", "o": ["総会や理事会の議決は、原則として全会一致で行われた", "アメリカが中心となって設立し、発足時から加盟していた", "国際連盟は加盟国の部隊からなる軍事的制裁の仕組みを常備していた", "本部はアメリカのニューヨークに置かれた"], "e": "国際連盟は全会一致制のため迅速な意思決定が難しく、制裁は主に経済制裁であった。アメリカは上院の反対で加盟せず、本部はジュネーブに置かれた。"}, {"id": "C14", "c": "C", "f": "K", "q": "2015年に成立した安全保障関連法によって可能になったこととして正しいものはどれか。", "o": ["存立危機事態において、集団的自衛権を限定的に行使すること", "非核三原則を撤廃し、核兵器を保有すること", "自衛隊を国連軍として常時提供すること", "徴兵制を導入して兵力を確保すること"], "e": "安全保障関連法により、日本と密接な関係にある他国への武力攻撃で日本の存立が脅かされる「存立危機事態」に、集団的自衛権の限定的な行使が認められた。"}, {"id": "C15", "c": "C", "f": "S", "X": "国連安全保障理事会の常任理事国は、アメリカ・イギリス・フランス・ロシア・中国の5か国である。", "Y": "国連総会では、加盟国の人口に応じて投票権の数が配分されている。", "xs": true, "ys": false, "e": "Xは正しい。Yは誤りで、総会は主権平等の原則に基づき一国一票制をとる。"}, {"id": "C16", "c": "C", "f": "S", "X": "国際慣習法は、条約を結んでいない国にも適用されうる。", "Y": "条約は、国家だけでなく国際機構が当事者となって結ばれることもある。", "xs": true, "ys": true, "e": "どちらも正しい。国際法には条約と国際慣習法があり、国際機構も条約の当事者となりうる。"}, {"id": "C17", "c": "C", "f": "S", "X": "日本は、1951年のサンフランシスコ平和条約の調印と同時に国連に加盟した。", "Y": "日本は、核兵器を「持たず、つくらず、持ち込ませず」という非核三原則を掲げている。", "xs": false, "ys": true, "e": "Xは誤りで、日本の国連加盟は1956年の日ソ共同宣言でソ連との国交が回復した後である。Yは正しい。"}, {"id": "C18", "c": "C", "f": "S", "X": "国連の専門機関であるユネスコ（UNESCO）は、主に難民の保護を任務としている。", "Y": "国連人権理事会は、安全保障理事会の下部機関として設けられている。", "xs": false, "ys": false, "e": "どちらも誤り。ユネスコは教育・科学・文化の分野を担当し、難民保護は国連難民高等弁務官事務所（UNHCR）が担う。人権理事会は総会の下部機関である。"}, {"id": "C19", "c": "C", "f": "S", "X": "冷戦期には、北大西洋条約機構（NATO）とワルシャワ条約機構が軍事的に対立した。", "Y": "1991年にソ連が解体した。", "xs": true, "ys": true, "e": "どちらも正しい。ワルシャワ条約機構は1991年に解体し、同年末にソ連も消滅した。"}, {"id": "C20", "c": "C", "f": "S", "X": "国連憲章は、加盟国による個別的自衛権・集団的自衛権の行使を一切認めていない。", "Y": "国連平和維持活動（PKO）は、国連憲章第7章に明文で規定されている。", "xs": false, "ys": false, "e": "どちらも誤り。国連憲章51条は、安保理が措置をとるまでの間の個別的・集団的自衛権を認めている。PKOは憲章に明文規定がなく、慣行として発展した（「6章半」の活動とよばれる）。"}, {"id": "C21", "c": "C", "f": "N", "p": "次の出来事を古い順に並べよ。", "i": ["国際連合の発足", "ソ連の解体", "国際連盟の発足"], "yr": ["1945年", "1991年", "1920年"], "ord": "312", "e": "国際連盟の発足（1920年）→国際連合の発足（1945年）→ソ連の解体（1991年）の順。"}, {"id": "C22", "c": "C", "f": "N", "p": "次の出来事を古い順に並べよ。", "i": ["核兵器禁止条約の発効", "部分的核実験禁止条約（PTBT）の調印", "中距離核戦力（INF）全廃条約の調印"], "yr": ["2021年", "1963年", "1987年"], "ord": "231", "e": "PTBT（1963年）→INF全廃条約（1987年）→核兵器禁止条約の発効（2021年）の順。"}, {"id": "C23", "c": "C", "f": "N", "p": "次の出来事を古い順に並べよ。", "i": ["朝鮮戦争の勃発", "湾岸戦争の勃発", "ベトナム戦争の終結"], "yr": ["1950年", "1991年", "1975年"], "ord": "132", "e": "朝鮮戦争（1950年）→ベトナム戦争終結（1975年）→湾岸戦争（1991年）の順。"}, {"id": "C24", "c": "C", "f": "N", "p": "次の出来事を古い順に並べよ。", "i": ["国際連合憲章の採択", "パリ不戦条約の締結", "ウェストファリア条約の締結"], "yr": ["1945年", "1928年", "1648年"], "ord": "321", "e": "ウェストファリア条約（1648年）→パリ不戦条約（1928年）→国連憲章（1945年）の順。"}, {"id": "D01", "c": "D", "f": "K", "q": "消費者の所得が増えて、ある財（正常財）の需要が増加した。他の条件が一定であるとき、均衡価格と均衡取引量の変化として正しいものはどれか。", "o": ["価格は上昇し、取引量は増加する", "価格は上昇し、取引量は減少する", "価格は下落し、取引量は増加する", "価格は下落し、取引量は減少する"], "e": "需要曲線が右に移動するため、均衡点は右上に移り、価格は上昇し取引量は増加する。"}, {"id": "D02", "c": "D", "f": "K", "q": "外部不経済の例として最も適当なものはどれか。", "o": ["工場の排煙で周辺住民に健康被害が生じたが、その費用は市場取引で考慮されていない", "新しい駅ができたことで、駅周辺の地価が上昇した", "原材料の価格が上がったため、製品の価格が値上げされた", "人気商品が品薄になり、販売価格が上昇した"], "e": "外部不経済とは、市場取引を通さずに第三者に不利益を与えることで、公害が典型例である。駅周辺の地価上昇は外部経済の例。"}, {"id": "D03", "c": "D", "f": "K", "q": "寡占市場でみられやすい現象として正しいものはどれか。", "o": ["価格が下がりにくくなる価格の下方硬直性", "多数の売り手が価格を受け入れるだけの存在として行動すること", "広告や品質などによる非価格競争が行われなくなること", "独占禁止法の適用がすべて除外されること"], "e": "寡占市場では、プライス・リーダーが設定する管理価格が形成されやすく、価格が下がりにくい。一方で広告などの非価格競争は激しくなる。"}, {"id": "D04", "c": "D", "f": "K", "q": "独占禁止法を運用し、カルテルなどの違反行為を取り締まる行政委員会はどれか。", "o": ["公正取引委員会", "金融庁", "消費者庁", "会計検査院"], "e": "公正取引委員会は独占禁止法の目的を達成するために設けられた行政委員会で、違反行為に排除措置命令や課徴金納付命令を出す。"}, {"id": "D05", "c": "D", "f": "K", "q": "日本の株式会社についての説明として正しいものはどれか。", "o": ["株主は、出資額を限度として会社の債務に責任を負う", "株主は、会社の債務について無限に責任を負う", "株式会社の最高意思決定機関は取締役会である", "株式会社を設立するには、最低1000万円の資本金が必要である"], "e": "株主は有限責任であり、最高意思決定機関は株主総会である。最低資本金制度は2006年施行の会社法で撤廃された。"}, {"id": "D06", "c": "D", "f": "K", "q": "国内総生産（GDP）に含まれないものはどれか。", "o": ["家庭内で行われる家事労働", "持ち家に住む人が支払ったとみなす家賃（帰属家賃）", "農家が自分で生産し消費した農産物", "日本国内で外国企業が生み出した付加価値"], "e": "GDPは市場で取引された財・サービスの付加価値が基本だが、帰属家賃や農家の自家消費は例外的に含まれる。家事労働は含まれない。"}, {"id": "D07", "c": "D", "f": "K", "q": "国民総所得（GNI）の説明として正しいものはどれか。", "o": ["GDPに海外からの所得の純受取を加えたもの", "GDPから固定資本減耗を差し引いたもの", "GDPから海外からの所得の純受取を差し引いたもの", "国内で生産されたすべての財の売上の合計"], "e": "GNI＝GDP＋海外からの所得－海外への所得で、国民が国内外で得た所得を表す。GDPから固定資本減耗を引いたものは国内純生産（NDP）。"}, {"id": "D08", "c": "D", "f": "K", "q": "景気が過熱しインフレの懸念があるとき、日本銀行がとる政策として最も適当なものはどれか。", "o": ["国債などを売る売りオペレーションを行い、市場の資金を吸収する", "国債などを買う買いオペレーションを行い、市場に資金を供給する", "政府に代わって公共事業を増やし、需要を抑える", "政府が発行する国債を直接引き受け、通貨量を増やす"], "e": "金融引締めでは売りオペで資金を吸収し金利を上昇させる。日銀による国債の直接引受けは財政法で原則禁止されている。"}, {"id": "D09", "c": "D", "f": "K", "q": "銀行に新たに100万円が預金され、支払準備率が10％で、銀行が準備金以外をすべて貸し出し、貸し出された資金がすべて銀行に預金されるとする。信用創造によって新たに生み出される預金額はどれか。", "o": ["900万円", "1000万円", "90万円", "1100万円"], "e": "預金総額は100万円÷0.1＝1000万円となり、最初の預金100万円を除いた900万円が新たに生み出された預金である。"}, {"id": "D10", "c": "D", "f": "K", "q": "財政の自動安定化装置（ビルト・イン・スタビライザー）の説明として正しいものはどれか。", "o": ["累進課税制度や雇用保険の給付によって、景気の変動が自動的に緩和されるしくみ", "政府が景気の状況に応じて公共事業や減税を裁量的に行うしくみ", "日本銀行が政策金利を上下させて景気を調整するしくみ", "政府が外国為替市場に介入して為替相場を安定させるしくみ"], "e": "好況時には税収が増え給付が減り、不況時には税収が減り給付が増えるため、自動的に景気が安定する。裁量的に行うものはフィスカル・ポリシー。"}, {"id": "D11", "c": "D", "f": "K", "q": "間接税に分類される税はどれか。", "o": ["消費税", "所得税", "法人税", "相続税"], "e": "間接税は納税者と税を実際に負担する者（担税者）が異なる税で、消費税や酒税がその例である。"}, {"id": "D12", "c": "D", "f": "K", "q": "日本の国債についての説明として正しいものはどれか。", "o": ["財政法は原則として国債の発行を認めていないが、公共事業などの財源となる建設国債の発行は認めている", "特例国債（赤字国債）は、財政法の規定に基づいて毎年自由に発行できる", "日本銀行が国債を政府から直接引き受けることは、財政法で自由に認められている", "1965年度以降、日本では国債がまったく発行されていない"], "e": "赤字国債の発行には毎年度などの特例法が必要である。日銀の直接引受けは原則禁止（市中消化の原則）。日本の国債発行は1965年度の補正予算から本格化した。"}, {"id": "D13", "c": "D", "f": "K", "q": "インフレーション（物価の持続的な上昇）の影響として最も適当なものはどれか。", "o": ["貨幣価値が下がるため、借金の実質的な負担は軽くなる", "年金など一定額の収入を得る人の実質的な購買力が高まる", "銀行預金の実質的な価値が高まる", "お金を貸している債権者にとって有利になる"], "e": "インフレでは貨幣価値が下がるため、債務者に有利、債権者や固定収入者・預金者に不利になる。"}, {"id": "D14", "c": "D", "f": "K", "q": "直接金融の例として正しいものはどれか。", "o": ["企業が社債を発行し、投資家から資金を調達する", "銀行が預金者から集めた資金を企業に貸し出す", "企業が内部留保を設備投資に充てる", "企業が取引先の銀行から融資を受ける"], "e": "直接金融は株式や社債の発行により資金の出し手から直接資金を集める方法である。銀行を仲介するのは間接金融、内部留保の利用は自己金融。"}, {"id": "D15", "c": "D", "f": "S", "X": "景気が後退しているとき、日本銀行は一般に金融緩和を行い、金利を引き下げる方向に誘導する。", "Y": "管理通貨制度の下では、通貨の発行量は中央銀行が保有する金の量によって制約される。", "xs": true, "ys": false, "e": "Xは正しい。Yは誤りで、金の保有量に通貨発行量が制約されるのは金本位制である。管理通貨制度では通貨量を政策的に調整できる。"}, {"id": "D16", "c": "D", "f": "S", "X": "累進課税制度では、所得が高くなるほど高い税率が適用される。", "Y": "消費税は、所得の低い人ほど所得に占める税負担の割合が高くなる逆進性があるとされる。", "xs": true, "ys": true, "e": "どちらも正しい。累進課税は所得再分配の機能をもち、消費税には逆進性の問題が指摘されている。"}, {"id": "D17", "c": "D", "f": "S", "X": "市場において超過需要が生じているとき、一般に価格は下落する。", "Y": "公共財は非排除性と非競合性をもつため、市場では十分に供給されにくい。", "xs": false, "ys": true, "e": "Xは誤りで、超過需要（品不足）のときは価格が上昇する。Yは正しく、公共財の供給は市場の失敗の一つであり政府が担う。"}, {"id": "D18", "c": "D", "f": "S", "X": "日本の国の一般会計歳出で最も大きな割合を占めているのは、防衛関係費である。", "Y": "国の予算は、国会の議決を経ずに内閣の判断だけで執行することができる。", "xs": false, "ys": false, "e": "どちらも誤り。歳出で最大の割合を占めるのは社会保障関係費である。予算は内閣が作成し、国会の議決を経なければならない（86条）。"}, {"id": "D19", "c": "D", "f": "S", "X": "株式会社が大規模になると、会社の所有者である株主と実際の経営者が分かれる「所有と経営の分離」が進みやすい。", "Y": "コーポレート・ガバナンスとは、企業が行う芸術・文化への支援活動のことである。", "xs": true, "ys": false, "e": "Xは正しい。Yは誤りで、コーポレート・ガバナンスは企業統治のことであり、芸術・文化支援はメセナとよばれる。"}, {"id": "D20", "c": "D", "f": "S", "X": "実質GDPは、名目GDPから物価変動の影響を取り除いたものである。", "Y": "国民所得の三面等価の原則とは、生産・分配・支出の三つの面からみた国民所得が等しくなることをいう。", "xs": true, "ys": true, "e": "どちらも正しい。名目GDPが増えても物価上昇が大きければ、実質GDPは減ることもある。"}, {"id": "D21", "c": "D", "f": "N", "p": "次の出来事を古い順に並べよ。", "i": ["マルクスが『資本論』第1巻を刊行", "アダム＝スミスが『国富論』を刊行", "ケインズが『雇用・利子および貨幣の一般理論』を刊行"], "yr": ["1867年", "1776年", "1936年"], "ord": "213", "e": "アダム＝スミス『国富論』（1776年）→マルクス『資本論』（1867年）→ケインズ『一般理論』（1936年）の順。"}, {"id": "D22", "c": "D", "f": "N", "p": "次の出来事を古い順に並べよ。", "i": ["日本銀行がゼロ金利政策を導入", "日本銀行がマイナス金利政策を解除", "日本銀行が量的・質的金融緩和を導入"], "yr": ["1999年", "2024年", "2013年"], "ord": "132", "e": "ゼロ金利政策（1999年）→量的・質的金融緩和（2013年）→マイナス金利政策の解除（2024年）の順。"}, {"id": "D23", "c": "D", "f": "N", "p": "次の出来事を古い順に並べよ。", "i": ["消費税率が5％に引き上げ", "消費税率が10％に引き上げ", "消費税の導入（税率3％）"], "yr": ["1997年", "2019年", "1989年"], "ord": "312", "e": "消費税導入（1989年）→5％へ引上げ（1997年）→10％へ引上げ（2019年、軽減税率導入）の順。"}, {"id": "D24", "c": "D", "f": "N", "p": "次の出来事を古い順に並べよ。", "i": ["会社法の施行", "独占禁止法の制定", "独占禁止法改正による持株会社の解禁"], "yr": ["2006年", "1947年", "1997年"], "ord": "231", "e": "独占禁止法の制定（1947年）→持株会社の解禁（1997年）→会社法の施行（2006年）の順。"}, {"id": "E01", "c": "E", "f": "K", "q": "日本の高度経済成長が終わるきっかけとなった出来事はどれか。", "o": ["1973年の第一次石油危機", "1985年のプラザ合意", "1990年代初めのバブル経済の崩壊", "2008年のリーマン・ショック"], "e": "1973年の第一次石油危機で原油価格が急騰し、翌1974年に戦後初のマイナス成長となって高度経済成長は終わった。"}, {"id": "E02", "c": "E", "f": "K", "q": "1985年のプラザ合意の内容と影響として正しいものはどれか。", "o": ["ドル高を是正するため先進5か国が協調介入に合意し、急速な円高が進んだ", "主要国が固定相場制に復帰することに合意し、為替相場が安定した", "円高を是正するため協調介入が行われ、急速な円安が進んだ", "アメリカが金とドルの交換を停止し、ブレトン・ウッズ体制が崩れた"], "e": "プラザ合意後の円高で円高不況となり、その対策としての金融緩和がバブル経済の一因となった。金・ドル交換停止は1971年のニクソン・ショック。"}, {"id": "E03", "c": "E", "f": "K", "q": "各国が比較優位をもつ財の生産に特化して貿易を行えば双方が利益を得られるとする比較生産費説を唱えた人物はどれか。", "o": ["リカード", "リスト", "ケインズ", "マルサス"], "e": "リカードは比較生産費説で自由貿易を主張した。リストは発展途上の国の幼稚産業を守る保護貿易を主張した。"}, {"id": "E04", "c": "E", "f": "K", "q": "円高・ドル安が進んだ場合の影響として最も適当なものはどれか。", "o": ["日本の輸出企業は、海外での価格競争力が低下しやすい", "日本から海外旅行をする費用は割高になる", "ドル建ての輸入品の円での価格は上昇する", "外国人旅行者にとって、日本での旅行費用は割安になる"], "e": "円高になると外国から見た日本製品の価格が上がり、輸出に不利になる。一方、輸入品や海外旅行は割安になる。"}, {"id": "E05", "c": "E", "f": "K", "q": "日本企業が海外の子会社から受け取る配当は、国際収支のどの項目に計上されるか。", "o": ["第一次所得収支", "第二次所得収支", "金融収支", "資本移転等収支"], "e": "投資から得られる利子や配当は第一次所得収支に計上される。対価を伴わない援助や送金は第二次所得収支である。"}, {"id": "E06", "c": "E", "f": "K", "q": "世界貿易機関（WTO）の説明として正しいものはどれか。", "o": ["GATTを発展させて1995年に発足し、サービス貿易や知的財産権も対象としている", "固定相場制を維持するために1945年に発足した", "発展途上国の経済開発のために長期資金を融資する機関である", "加盟国間の関税を全廃し、共通の通貨を導入した共同市場である"], "e": "WTOはウルグアイ・ラウンドの合意に基づき設立され、紛争解決の手続も強化された。長期融資は世界銀行（IBRD）の役割である。"}, {"id": "E07", "c": "E", "f": "K", "q": "1971年にアメリカが金とドルの交換停止を発表した出来事はどれか。", "o": ["ニクソン・ショック", "プラザ合意", "スミソニアン協定", "キングストン合意"], "e": "ニクソン・ショックでブレトン・ウッズ体制は const RANKS=[
  {t:"新入生",en:"FRESHMAN",min:0},
  {t:"学士",en:"BACHELOR",min:15},
  {t:"修士",en:"MASTER",min:35},
  {t:"博士",en:"DOCTOR",min:55},

function rankOf(pct){let i=0;RANKS.forEach((r,k)=>{if(pct>=r.min)i=k});return i}
function stars(i){return "★".repeat(i)+"☆".repeat(RANKS.length-1-i)}
function rankPanel(){
  const m=mastery(),i=rankOf(m.pct),r=RANKS[i],nx=RANKS[i+1];

  return `<div class="panel rankp"><div class="rk-badge rk${i}" aria-hidden="true"><span class="rk-en">${r.en}</span><span class="rk-t">${r.t}</span><span class="rk-st">${stars(i)}</span></div>
    <div class="rk-body"><h2>あなたのランク：${r.t}</h2>
    <p class="kbd num">正解済み ${m.ok} / ${m.n} 問（${Math.floor(m.pct)}%）</p>
    <div class="meter rk-meter"><i style="width:${prog}%"></i></div>

}
const TITLES=[[100,"名誉教授級"],[90,"教授級"],[75,"博士級"],[60,"修士級"],[40,"学士級"],[0,"新入生級"]];

}

/* ===== 状態 ===== */
const app=document.getElementById("app");
let S={view:"home",size:10,fmt:"ALL"};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const rich=s=>esc(s).replace(/&lt;(\/?)(sup|sub|u)&gt;/g,"<$1$2>").replace(/&lt;br&gt;/g,"<br>");
const ROM=["Ⅰ","Ⅱ","Ⅲ"];

function header(){return `<header class="top"><div class="subject"><h1><b>政治・経済</b> ドリル</h1><span class="tag">共通テスト対策</span></div>
  <div class="row"><a class="subj-link" href="index.html">メニュー</a><small class="num">全${Q.length}問</small></div></header>`}
const fmtOK=q=>S.fmt==="ALL"||q.f===S.fmt;
function stats(cat){const qs=Q.filter(q=>!cat||q.c===cat);let done=0,ok=0;qs.forEach(q=>{const r=rec[q.id];if(r){done++;if(r.last)ok++}});return{n:qs.length,done,ok}}

function home(){
  delete app.dataset.cat;
  const missN=Q.filter(q=>rec[q.id]&&rec[q.id].last===false&&fmtOK(q)).length;
  const all=stats();
  app.innerHTML=header()+`
  <p class="lead">分野を選んで始めてください。1問ごとに正誤と解説が出ます。正解を増やすとランクが上がります。記録はこの端末に保存されます。</p>
  <div class="row"><span class="kbd" ${FSEG.length<3?"hidden":""}>形式</span>
    <div class="seg" role="group" aria-label="形式" ${FSEG.length<3?"hidden":""}>${FSEG.map(([k,l])=>`<button id="fm${k}" aria-pressed="${S.fmt===k}" data-fmt="${k}">${l}</button>`).join("")}</div>
    <span class="kbd">出題数</span>
    <div class="seg" role="group" aria-label="出題数">${[10,20,0].map(n=>`<button id="sz${n}" aria-pressed="${S.size===n}" data-size="${n}">${n?n+"問":"全問"}</button>`).join("")}</div></div>
  <div class="cats">${Object.entries(CATS).map(([k,c])=>{const s=stats(k);const pct=s.n?Math.round(s.ok/s.n*100):0;
    return `<button class="cat" id="cat${k}" data-cat="${k}"><span class="k">${c.k}　<span class="era-yr">${c.yr}</span></span><span class="t">${c.name}</span><span class="d">${c.d}</span>
    <span class="meter" aria-hidden="true"><i style="width:${pct}%"></i></span><span class="s num">正解済 ${s.ok} / ${s.n}　解答済 ${s.done}</span></button>`}).join("")}</div>
  <div class="row">
    <button class="btn primary" id="mix" data-cat="ALL">全分野ミックス</button>
    <button class="btn" id="review" data-cat="MISS" ${missN?"":"disabled"}>間違えた問題を復習（${missN}問）</button>
  </div>
  ${rankPanel()}
  <div class="panel"><h2>これまでの成績</h2>
    <div class="score"><span class="big">${all.done?Math.round(all.ok/all.done*100):0}<small style="font-size:18px">%</small></span>
    <span class="kbd num">直近の正答率（解答済 ${all.done} 問中 ${all.ok} 問正解）</span></div>
    <div class="row" style="margin-top:10px"><button class="btn" id="reset" ${all.done?"":"disabled"}>記録を消す</button><span class="kbd" id="resetMsg"></span></div>
  </div>
  <footer>操作：選択肢は数字キー（1〜6）、次へは Enter キーでも進めます。</footer>`;
  app.querySelectorAll("[data-size]").forEach(b=>b.onclick=()=>{S.size=+b.dataset.size;home()});
  app.querySelectorAll("[data-fmt]").forEach(b=>b.onclick=()=>{S.fmt=b.dataset.fmt;home()});
  app.querySelectorAll("button[data-cat]").forEach(b=>b.onclick=()=>start(b.dataset.cat));
  let armed=false;const rb=document.getElementById("reset");
  rb.onclick=()=>{if(!armed){armed=true;rb.textContent="本当に消す";document.getElementById("resetMsg").textContent="もう一度押すと全記録を消去します";return}rec={};save();home()};
}

function start(cat){
  let pool=Q.filter(fmtOK);
  pool=cat==="ALL"?pool:cat==="MISS"?pool.filter(q=>rec[q.id]&&rec[q.id].last===false):pool.filter(q=>q.c===cat);
  if(!pool.length){home();return}
  pool=shuffle(pool);if(S.size&&cat!=="MISS")pool=pool.slice(0,S.size);
  S={...S,view:"quiz",r0:rankOf(mastery().pct),cat,list:pool,i:0,res:[],done:false};
  question();
}

function body(q){
  if(q.f==="S")return `<p class="stem">次の文X・Yについて、その正誤の組合せとして正しいものを選べ。</p>
    <div class="stmts"><div class="stmt"><span class="lb">X</span><span class="tx">${rich(q.X)}</span></div><div class="stmt"><span class="lb">Y</span><span class="tx">${rich(q.Y)}</span></div></div>`;
  if(q.f==="N")return `<p class="stem">${rich(q.p||"次のⅠ〜Ⅲについて、古いものから年代順に正しく配列したものを選べ。")}</p>
    <div class="stmts">${q.i.map((t,k)=>`<div class="stmt"><span class="lb">${ROM[k]}</span><span class="tx">${rich(t)}</span></div>`).join("")}</div>`;
  return `<p class="stem">${rich(q.q)}</p>`;
}

function question(){
  const q=S.list[S.i];S.done=false;app.dataset.cat=q.c;
  const label=S.cat==="ALL"?"全分野ミックス":S.cat==="MISS"?"復習":CATS[S.cat].name;
  S.opts=(q.f==="K"?shuffle(q.o.map((t,k)=>({t,k}))):q.o.map((t,k)=>({t,k})));
  app.innerHTML=`${header()}<div class="qhead"><span>${label}　<span class="num">${S.i+1} / ${S.list.length}</span></span><button class="btn" id="quit" style="padding:4px 12px;font-size:13px">やめる</button></div>
  <div class="bar"><i style="width:${S.i/S.list.length*100}%"></i></div>
  <div class="panel"><div><span class="qno">${q.id}</span><span class="kbd">${CATS[q.c].name}</span><span class="fmt">${FMT[q.f]}</span></div>
    ${body(q)}
    <div class="choices ${q.f==="N"?"six":""}">${S.opts.map((o,n)=>`<button class="ch" id="ch${n}" data-n="${n}"><span class="oval">${n+1}</span><span>${rich(o.t)}</span></button>`).join("")}</div>
    <div id="fb"></div></div>`;
  app.querySelectorAll(".ch").forEach(b=>b.onclick=()=>choose(+b.dataset.n));
  document.getElementById("quit").onclick=()=>{S.view="home";home()};
}

function answerText(q){
  if(q.f==="N"){const o=q.ord.split("").map(d=>+d-1);return `${NO[q.a]}（${o.map(k=>`${rich(q.i[k])}${q.yr?`〈${rich(q.yr[k])}〉`:""}`).join(" → ")}）`}
  return rich(q.o[q.a]);
}
function choose(n){
  if(S.done)return;S.done=true;
  const q=S.list[S.i];const ok=S.opts[n].k===q.a;
  app.querySelectorAll(".ch").forEach((b,m)=>{b.disabled=true;if(S.opts[m].k===q.a)b.classList.add("right")});
  const b=document.getElementById("ch"+n);b.classList.add("sel");if(!ok)b.classList.add("wrong");
  mark(q.id,ok);S.res.push({q,ok,your:S.opts[n].t});
  const last=S.i===S.list.length-1;
  document.getElementById("fb").innerHTML=`<div class="fb ${ok?"ok":"ng"}" role="status">
    <div class="v"><span class="mark">${ok?"○":"×"}</span>${ok?"正解！":"おしい！"}</div>
    <p>正解：<b>${answerText(q)}</b></p><p>${rich(q.e)}</p></div>
    <div class="row" style="margin-top:14px"><button class="btn primary" id="next">${last?"結果を見る":"次の問題へ"}</button></div>`;
  const nx=document.getElementById("next");nx.focus({preventScroll:true});
  nx.onclick=()=>{if(last){result()}else{S.i++;question();window.scrollTo({top:0})}};
}

function qSummary(q){
  if(q.f==="S")return `X：${rich(q.X)}<br>Y：${rich(q.Y)}`;
  if(q.f==="N")return q.i.map((t,k)=>`${ROM[k]} ${rich(t)}`).join("　");
  return rich(q.q);
}
function result(){
  S.view="result";delete app.dataset.cat;
  const n=S.res.length,ok=S.res.filter(r=>r.ok).length,miss=S.res.filter(r=>!r.ok);
  app.innerHTML=header()+`<div class="panel"><h2>結果</h2>
    <div class="score"><span class="big">${ok}</span><span class="num" style="font-size:20px">/ ${n}</span><span class="kbd">正答率 ${Math.round(ok/n*100)}%</span></div>${sessionRank(ok,n,S.r0)}
    ${miss.length?`<ul class="miss">${miss.map(r=>`<li data-cat="${r.q.c}"><div class="kbd"><span class="qno">${r.q.id}</span>${CATS[r.q.c].name}<span class="fmt">${FMT[r.q.f]}</span></div>
      <div class="en">${qSummary(r.q)}</div>
      <div class="x">正解：<b>${answerText(r.q)}</b>　／　あなたの解答：${rich(r.your)}</div><div class="x">${rich(r.q.e)}</div></li>`).join("")}</ul>`:`<p style="font-size:18px;font-weight:900">全問正解！すばらしい！</p>`}
    <div class="row" style="margin-top:16px"><button class="btn primary" id="again">同じ条件でもう一度</button><button class="btn" id="back">トップへ戻る</button></div></div>`;
  document.getElementById("again").onclick=()=>start(S.cat);
  document.getElementById("back").onclick=home;
}

document.addEventListener("keydown",e=>{
  if(S.view!=="quiz")return;
  const n=S.list[S.i].o.length;
  if(/^[1-6]$/.test(e.key)&&!S.done&&+e.key<=n){choose(+e.key-1)}
  else if(e.key==="Enter"&&S.done){const nx=document.getElementById("next");if(nx&&document.activeElement!==nx){e.preventDefault();nx.click()}}
});
home();
</script>

<script>if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}</script>
</body>
</html>
