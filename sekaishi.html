<title>世界史ドリル</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Nunito:wght@600;800;900&family=Fredoka:wght@600;700&display=swap">
<style>
/* Layout: ステッカー風のポップな一列カラム。太いフチ＋ずらした影、分野ごとにカラー */
:root{
  --bg:#EAF4FF; --dot:#CFE3FA; --card:#FFFFFF; --ink:#1B1E3A; --muted:#5C6385; --edge:#1B1E3A;
  --g:#FF5C8A; --v:#2FA8FF; --o:#FFB800; --c:var(--g);
  --c-soft:#FFE3EC;
  --ok:#14B06A; --ok-soft:#DDF7EA; --ng:#FF4D4D; --ng-soft:#FFE4E4;
  --btn-ink:#FFFFFF;
  --f-jp:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",Meiryo,sans-serif;
  --f-en:"Nunito","Segoe UI",system-ui,sans-serif;
  --f-num:"Fredoka","Nunito",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#161A2E; --dot:#22284A; --card:#232945; --ink:#F2F4FF; --muted:#A9B0D4; --edge:#060815;
  --g:#FF7AA2; --v:#5BBEFF; --o:#FFC933; --c-soft:#3A2440;
  --ok:#3DD68C; --ok-soft:#173829; --ng:#FF6F6F; --ng-soft:#3E1D22; --btn-ink:#161A2E; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#161A2E; --dot:#22284A; --card:#232945; --ink:#F2F4FF; --muted:#A9B0D4; --edge:#060815;
  --g:#FF7AA2; --v:#5BBEFF; --o:#FFC933; --c-soft:#3A2440;
  --ok:#3DD68C; --ok-soft:#173829; --ng:#FF6F6F; --ng-soft:#3E1D22; --btn-ink:#161A2E; color-scheme:dark}
[data-cat="G"]{--c:var(--g)} [data-cat="V"]{--c:var(--v)} [data-cat="O"]{--c:var(--o)}
*{box-sizing:border-box}
body{background-color:var(--bg);background-image:radial-gradient(var(--dot) 2px,transparent 2.5px);background-size:22px 22px;
  color:var(--ink);font-family:var(--f-jp);font-weight:500;font-size:15px;line-height:1.7;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--v);outline-offset:3px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.subject{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.subject h1{margin:0;font-size:30px;font-weight:900;letter-spacing:.02em;text-wrap:balance;
  text-shadow:3px 3px 0 var(--g)}
.subject h1 b{font-family:var(--f-num);font-weight:700;color:var(--v);text-shadow:3px 3px 0 var(--o)}
.tag{font-size:12px;font-weight:900;background:var(--o);color:#1B1E3A;border:2px solid var(--edge);border-radius:999px;padding:2px 12px;transform:rotate(-4deg);box-shadow:2px 2px 0 var(--edge)}
.top small{font-family:var(--f-num);font-size:14px;background:var(--card);border:2px solid var(--edge);border-radius:999px;padding:2px 12px}
.lead{color:var(--muted);margin:0}
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.cat{background:var(--card);border:3px solid var(--edge);border-radius:20px;padding:16px 16px 14px;text-align:left;display:flex;flex-direction:column;gap:6px;min-width:0;
  box-shadow:5px 5px 0 var(--c);transition:transform .15s,box-shadow .15s;position:relative;overflow:hidden}
.cat::after{content:"";position:absolute;right:-24px;top:-24px;width:80px;height:80px;border-radius:50%;background:var(--c);opacity:.25}
.cat:hover{transform:translate(-2px,-3px) rotate(-.6deg);box-shadow:8px 8px 0 var(--c)}
.cat:active{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--c)}
.cat .k{font-family:var(--f-num);font-size:12px;font-weight:700;color:var(--c);letter-spacing:.12em;filter:brightness(.85)}
.cat .t{font-size:20px;font-weight:900}
.cat .d{font-size:13px;color:var(--muted)}
.meter{height:12px;background:var(--bg);border:2px solid var(--edge);border-radius:999px;position:relative;margin-top:6px;overflow:hidden}
.meter i{position:absolute;inset:0 auto 0 0;background:var(--c);border-radius:999px}
.cat .s{font-size:12px;color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{background:var(--card);border:3px solid var(--edge);border-radius:999px;padding:8px 20px;font-weight:700;box-shadow:3px 3px 0 var(--edge);transition:transform .1s,box-shadow .1s}
.btn:hover:not([disabled]){transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--edge)}
.btn:active:not([disabled]){transform:translate(3px,3px);box-shadow:0 0 0 var(--edge)}
.btn.primary{background:var(--g);color:#fff}
#mix.primary{background:linear-gradient(90deg,var(--g),var(--v))}
.btn[disabled]{opacity:.4;cursor:default;box-shadow:none}
.seg{display:inline-flex;border:3px solid var(--edge);border-radius:999px;overflow:hidden;box-shadow:3px 3px 0 var(--edge)}
.seg button{background:var(--card);border:0;padding:5px 16px;font-size:13px;font-weight:700}
.seg button+button{border-left:2px solid var(--edge)}
.seg button[aria-pressed="true"]{background:var(--o);color:#1B1E3A}
.panel{background:var(--card);border:3px solid var(--edge);border-radius:24px;padding:20px;box-shadow:6px 6px 0 var(--edge)}
.panel h2{margin:0 0 8px;font-size:18px;font-weight:900}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-size:14px;font-weight:700}
.bar{height:14px;background:var(--card);border:3px solid var(--edge);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:repeating-linear-gradient(45deg,var(--c) 0 10px,color-mix(in srgb,var(--c) 70%,#fff) 10px 20px);transition:width .35s cubic-bezier(.3,1.6,.5,1)}
.qno{display:inline-block;background:var(--c);color:#fff;font-family:var(--f-num);font-weight:700;padding:1px 10px;margin-right:8px;font-size:13px;border-radius:999px;border:2px solid var(--edge)}
[data-cat="O"] .qno{color:#1B1E3A}
.stem{font-family:var(--f-en);font-weight:800;font-size:21px;line-height:1.6;margin:14px 0 6px}
.stem .blank{display:inline-block;min-width:5.5em;background:var(--c-soft);border:2px dashed var(--c);border-radius:10px;text-align:center;font-family:var(--f-num);font-size:14px;color:var(--ink);line-height:1.8}
.ja{color:var(--muted);font-size:14px;margin:0}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
@media (max-width:520px){.choices{grid-template-columns:1fr}}
.ch{display:flex;align-items:center;gap:12px;background:var(--card);border:3px solid var(--edge);border-radius:16px;padding:10px 14px;text-align:left;font-family:var(--f-en);font-weight:800;font-size:17px;
  box-shadow:3px 3px 0 var(--edge);transition:transform .12s,box-shadow .12s;min-width:0}
.ch:hover:not([disabled]){transform:translate(-1px,-2px);box-shadow:4px 5px 0 var(--c)}
.oval{flex:none;width:30px;height:30px;border:2px solid var(--edge);border-radius:50%;display:grid;place-items:center;font-family:var(--f-num);font-size:14px;font-weight:700;background:var(--c);color:#fff}
[data-cat="O"] .oval{color:#1B1E3A}
.ch.right{background:var(--ok-soft);border-color:var(--ok);box-shadow:3px 3px 0 var(--ok)}
.ch.right .oval{background:var(--ok)}
.ch.wrong{background:var(--ng-soft);border-color:var(--ng);box-shadow:3px 3px 0 var(--ng);animation:shake .35s}
.ch.wrong .oval{background:var(--ng)}
.ch.sel.right{animation:pop .4s}
.ch[disabled]{cursor:default}
.ch[disabled]:not(.right):not(.wrong){opacity:.55}
.fb{margin-top:18px;border:3px solid var(--ok);border-radius:18px;background:var(--ok-soft);padding:12px 16px;animation:pop .35s}
.fb.ng{border-color:var(--ng);background:var(--ng-soft)}
.fb .v{font-weight:900;font-size:20px;display:flex;align-items:center;gap:8px}
.fb.ok .v{color:var(--ok)} .fb.ng .v{color:var(--ng)}
.fb p{margin:6px 0 0}
.fb .en{font-family:var(--f-en);font-weight:800;font-size:16px}
.mark{font-family:var(--f-num);font-size:26px;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff;border:2px solid var(--edge)}
.fb.ok .mark{background:var(--ok)} .fb.ng .mark{background:var(--ng)}
/* 並べ替え */
.build{min-height:60px;border:3px dashed var(--c);border-radius:16px;background:var(--bg);padding:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:14px;font-family:var(--f-en);font-weight:800;font-size:17px}
.build .fix{color:var(--muted)}
.build .ph{color:var(--muted);font-family:var(--f-jp);font-size:13px}
.pool{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{border:2px solid var(--edge);border-radius:12px;background:var(--card);padding:4px 14px;font-family:var(--f-en);font-weight:800;font-size:17px;box-shadow:2px 2px 0 var(--edge);transition:transform .1s}
.chip:hover:not([disabled]){transform:translateY(-2px) rotate(-2deg)}
.chip.used{opacity:.2;cursor:default;box-shadow:none}
.build .chip{background:var(--c);color:#fff;animation:pop .25s}
[data-cat="O"] .build .chip{color:#1B1E3A}
.kbd{font-size:12px;color:var(--muted)}
.score{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.score .big{font-family:var(--f-num);font-weight:700;font-size:56px;line-height:1;color:var(--g);text-shadow:3px 3px 0 var(--o)}
.miss{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;gap:10px}
.miss li{border:2px solid var(--edge);border-radius:14px;padding:10px 12px;min-width:0;background:var(--bg)}
.miss .en{font-family:var(--f-en);font-weight:800;font-size:16px}
.miss .en b{color:var(--ok)}
.miss .x{font-size:13px;color:var(--muted)}
footer{color:var(--muted);font-size:12px;text-align:center}
@keyframes pop{0%{transform:scale(.9)}60%{transform:scale(1.04)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
<style>
/* 日本史用の追加：時代ごとのカラーと設問ブロック */
:root{--ey:#B88A00;--ea:#F26A2E;--em:#0E9C8C;--ee:#E8457A;--ed:#7353F0;--ep:#2C8FE0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ea:#FF8F5C;--em:#2CC7B5;--ee:#FF7AA2;--ed:#9C85FF;--ep:#5BBEFF;--ey:#E6C340}}
:root[data-theme="dark"]{--ea:#FF8F5C;--em:#2CC7B5;--ee:#FF7AA2;--ed:#9C85FF;--ep:#5BBEFF;--ey:#E6C340}
[data-cat="A"]{--c:var(--ea)} [data-cat="B"]{--c:var(--em)} [data-cat="C"]{--c:var(--ee)} [data-cat="D"]{--c:var(--ed)} [data-cat="E"]{--c:var(--ep)}
.stem{font-family:var(--f-jp);font-weight:700;font-size:18px}
.stmts{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.stmt{display:flex;gap:10px;align-items:flex-start;background:var(--bg);border:2px solid var(--edge);border-radius:14px;padding:8px 12px;min-width:0}
.stmt .lb{flex:none;font-family:var(--f-num);font-weight:700;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--c);color:#fff;border:2px solid var(--edge)}
.stmt .tx{font-weight:700;min-width:0}
.ch{font-family:var(--f-jp);font-weight:700}
.choices.six{grid-template-columns:repeat(3,1fr)}
@media (max-width:520px){.choices.six{grid-template-columns:1fr 1fr}}
.choices.six .ch{white-space:nowrap;gap:8px;padding:10px}
@media (max-width:520px){.choices.six .ch{font-size:15px;padding:10px 8px}.choices.six .oval{width:26px;height:26px;font-size:13px}}
.fmt{display:inline-block;font-size:11px;font-weight:900;border:2px solid var(--edge);border-radius:999px;padding:0 8px;margin-left:6px;background:var(--o);color:#1B1E3A}
.era-yr{font-family:var(--f-num);font-size:12px;color:var(--muted)}
.subj-link{font-size:13px;font-weight:700;color:var(--ink);text-decoration:none;border:2px solid var(--edge);border-radius:999px;padding:2px 12px;background:var(--card)}
.subj-link:hover{background:var(--o);color:#1B1E3A}
.miss .en{font-family:var(--f-jp);font-weight:700}
.subject h1 b{font-family:var(--f-jp);font-weight:900}
</style>
<style>
/* ランク表示 */
.rankp{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.rk-body{flex:1;min-width:200px}
.rk-body h2{margin:0 0 2px}
.rk-body p{margin:4px 0}
.rk-meter i{background:linear-gradient(90deg,var(--o),var(--g))}
.rk-badge{flex:none;width:118px;height:118px;border-radius:50%;border:4px solid var(--edge);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;box-shadow:4px 4px 0 var(--edge);transform:rotate(-6deg);text-align:center;color:#1B1E3A}
.rk-badge .rk-en{font-family:var(--f-num);font-size:10px;letter-spacing:.12em;font-weight:700}
.rk-badge .rk-t{font-size:22px;font-weight:900;line-height:1.2}
.rk-badge .rk-st{font-size:12px;letter-spacing:1px}
.rk0{background:#E4E8F2}.rk1{background:#BFE6FF}.rk2{background:#C9F2DA}.rk3{background:#FFD873}.rk4{background:#FFB3CB}
.rk5{background:conic-gradient(#FFD873,#FFB3CB,#BFE6FF,#C9F2DA,#FFD873)}
.rk-session{display:flex;align-items:baseline;gap:10px;margin-top:12px;flex-wrap:wrap}
.rk-title{font-size:26px;font-weight:900;color:var(--ink);background:var(--o);border:3px solid var(--edge);border-radius:999px;padding:0 16px;box-shadow:3px 3px 0 var(--edge);transform:rotate(-2deg);display:inline-block;color:#1B1E3A}
.rk-up{margin-top:12px;font-weight:900;font-size:18px;color:var(--g);animation:pop .5s}
</style>

<script>
/* ===== 問題データ ===== */
const D={"cats": {"A": {"name": "古代文明・古代地中海世界・古代アジア", "k": "ANCIENT", "yr": "〜5世紀", "d": "オリエント・インダス・中国の古代文明、ギリシア・ローマ、古代インド・イラン・東南アジア・アフリカ・アメリカ"}, "B": {"name": "中世ヨーロッパ・イスラーム世界・中世アジア", "k": "MEDIEVAL", "yr": "5〜15世紀", "d": "西欧封建社会とビザンツ、イスラーム諸王朝、宋〜明・モンゴル帝国、アフリカ・東南アジアの諸国"}, "C": {"name": "近世", "k": "EARLY MODERN", "yr": "15〜18世紀", "d": "大航海時代・宗教改革・主権国家体制、清・オスマン帝国・サファヴィー朝・ムガル帝国"}, "D": {"name": "近代", "k": "MODERN", "yr": "18〜19世紀", "d": "市民革命・産業革命・国民国家の形成、帝国主義とアジア・アフリカ・ラテンアメリカの変革"}, "E": {"name": "現代", "k": "CONTEMPORARY", "yr": "20世紀〜現代", "d": "二つの世界大戦、冷戦、脱植民地化、冷戦終結とグローバル化"}}, "q": [{"id": "A01", "c": "A", "f": "K", "q": "「目には目を、歯には歯を」の復讐法の原則で知られるハンムラビ法典を制定した王の王朝はどれか。", "o": ["バビロン第1王朝（古バビロニア王国）", "アッシリア王国", "ヒッタイト", "新バビロニア（カルデア）"], "e": "ハンムラビ王はバビロン第1王朝の王で、メソポタミアを統一してハンムラビ法典を制定した。"}, {"id": "A02", "c": "A", "f": "K", "q": "古代エジプト新王国時代に、従来の神々の崇拝を退けてアテン神のみを信仰する改革を行った王は誰か。", "o": ["アメンホテプ4世（イクナートン）", "ラメセス2世", "クフ王", "トトメス3世"], "e": "アメンホテプ4世はアテン神の一神教的な信仰を強制し、都をテル=エル=アマルナに移した。写実的なアマルナ美術も生まれた。"}, {"id": "A03", "c": "A", "f": "K", "q": "インダス文明の代表的な都市遺跡はどれか。", "o": ["モエンジョ=ダーロ", "アジャンター", "サーンチー", "ウル"], "e": "モエンジョ=ダーロやハラッパーはインダス文明の計画都市である。アジャンターは石窟寺院、サーンチーは仏塔の遺跡、ウルはメソポタミアのシュメール人の都市。"}, {"id": "A04", "c": "A", "f": "K", "q": "殷で、神意を占った結果を記録するために亀の甲や獣の骨に刻まれた文字はどれか。", "o": ["甲骨文字", "楔形文字", "金文", "隷書"], "e": "殷では王が祭祀や占いによって政治を行い、その記録が甲骨文字として残る。金文は青銅器に鋳込まれた文字、楔形文字はメソポタミアの文字である。"}, {"id": "A05", "c": "A", "f": "K", "q": "前5世紀半ばにアテネの民主政を完成させた指導者は誰か。", "o": ["ペリクレス", "ドラコン", "ペイシストラトス", "リュクルゴス"], "e": "ペリクレスの時代に成年男性市民による民会を中心とする民主政が完成した。ペイシストラトスは僭主、リュクルゴスはスパルタの伝説的立法者。"}, {"id": "A06", "c": "A", "f": "K", "q": "前27年にオクタウィアヌスが元老院からアウグストゥスの称号を受けて始めた政治体制はどれか。", "o": ["元首政（プリンキパトゥス）", "専制君主政（ドミナトゥス）", "四帝分治制（テトラルキア）", "共和政"], "e": "アウグストゥスは共和政の形式を尊重しつつ「市民の第一人者」として実権を握った（元首政）。専制君主政はディオクレティアヌス帝が始めた。"}, {"id": "A07", "c": "A", "f": "K", "q": "313年にミラノ勅令を出してキリスト教を公認したローマ皇帝は誰か。", "o": ["コンスタンティヌス帝", "テオドシウス帝", "ディオクレティアヌス帝", "ネロ帝"], "e": "コンスタンティヌス帝がミラノ勅令でキリスト教を公認した。テオドシウス帝は392年にキリスト教を国教化し、ディオクレティアヌス帝は大迫害を行った。"}, {"id": "A08", "c": "A", "f": "K", "q": "秦の始皇帝が行った政策として正しいものはどれか。", "o": ["郡県制を全国に施行した", "科挙を始めて官吏を登用した", "均田制を施行した", "塩・鉄・酒の専売を始めた"], "e": "始皇帝は郡県制を全国に広げ、度量衡・貨幣・文字を統一した。科挙は隋、均田制は北魏、塩・鉄・酒の専売は前漢の武帝が始めた。"}, {"id": "A09", "c": "A", "f": "K", "q": "匈奴を挟撃するため、張騫を大月氏に派遣した中国の皇帝は誰か。", "o": ["前漢の武帝", "後漢の光武帝", "前漢の高祖（劉邦）", "前漢の文帝"], "e": "前漢の武帝は張騫を大月氏に派遣し、その結果西域の事情が中国に伝わった。光武帝は後漢を建てた皇帝である。"}, {"id": "A10", "c": "A", "f": "K", "q": "仏教を保護し、ダルマ（法）による統治を理想として各地に詔勅を磨崖や石柱に刻ませたマウリヤ朝の王は誰か。", "o": ["アショーカ王", "カニシカ王", "チャンドラグプタ2世", "ハルシャ王"], "e": "アショーカ王はカリンガ征服後に仏教に帰依し、ダルマに基づく統治をめざした。カニシカ王はクシャーナ朝、チャンドラグプタ2世はグプタ朝、ハルシャ王はヴァルダナ朝の王。"}, {"id": "A11", "c": "A", "f": "K", "q": "ゾロアスター教を国教とし、その教典『アヴェスター』を編纂したイランの王朝はどれか。", "o": ["ササン朝", "パルティア", "セレウコス朝", "ウマイヤ朝"], "e": "3世紀に成立したササン朝はゾロアスター教を国教とし、『アヴェスター』が編纂された。ウマイヤ朝はイスラーム王朝である。"}, {"id": "A12", "c": "A", "f": "K", "q": "ナイル川上流に栄え、一時エジプトを支配し、のちメロエに都を移して製鉄で栄えたアフリカの王国はどれか。", "o": ["クシュ王国", "アクスム王国", "ガーナ王国", "モノモタパ王国"], "e": "クシュ王国は前8世紀にエジプトを支配し、のちメロエに遷都して製鉄などで栄えた。アクスム王国はエチオピア高原の王国で、4世紀にメロエを滅ぼした。"}, {"id": "A13", "c": "A", "f": "K", "q": "ユカタン半島を中心に栄え、ピラミッド状の神殿をもち、二十進法や精密な暦を用いた文明はどれか。", "o": ["マヤ文明", "インカ帝国", "アステカ王国", "チャビン文化"], "e": "マヤ文明はユカタン半島などで栄え、二十進法や暦、マヤ文字を用いた。インカ帝国とチャビン文化はアンデス地域、アステカ王国はメキシコ高原。"}, {"id": "A14", "c": "A", "f": "K", "q": "1世紀頃メコン川下流域に建国され、外港のオケオからはインドやローマの文物が出土している国はどれか。", "o": ["扶南", "チャンパー", "シュリーヴィジャヤ", "マジャパヒト王国"], "e": "扶南はメコン川下流域の港市国家で、オケオからローマ金貨やインドの神像などが出土している。チャンパーはベトナム中部、シュリーヴィジャヤはスマトラ島の国。"}, {"id": "A15", "c": "A", "f": "S", "X": "儒家の祖とされる孔子は、仁の実践を説いた。", "Y": "韓非は、法による厳格な統治を説く法家の思想を大成した。", "xs": true, "ys": true, "e": "X：孔子は仁と礼を重んじる徳治を説いた。Y：韓非は法家思想を大成し、秦の統治に影響を与えた。いずれも正しい。"}, {"id": "A16", "c": "A", "f": "S", "X": "アケメネス朝のダレイオス1世は、「王の道」と呼ばれる国道を整備した。", "Y": "ペルシア戦争のマラトンの戦いで、アテネ軍はペルシア軍に敗れた。", "xs": true, "ys": false, "e": "Xは正しい。Y：マラトンの戦い（前490年）ではアテネ軍がペルシア軍を破った。"}, {"id": "A17", "c": "A", "f": "S", "X": "グプタ朝の時代には、ガンダーラ美術が最盛期を迎えた。", "Y": "グプタ朝の時代には、サンスクリット文学が栄え、カーリダーサが『シャクンタラー』を著した。", "xs": false, "ys": true, "e": "X：ガンダーラ美術はクシャーナ朝の時代に栄えた。グプタ朝ではインド的なグプタ様式が成立した。Yは正しい。"}, {"id": "A18", "c": "A", "f": "S", "X": "カルタゴの将軍ハンニバルは、ザマの戦いでローマ軍に大勝した。", "Y": "ローマ帝国は、ディオクレティアヌス帝の死に際して東西に分割された。", "xs": false, "ys": false, "e": "X：ハンニバルはザマの戦い（前202年）でスキピオの率いるローマ軍に敗れた。Y：東西分割はテオドシウス帝の死（395年）の際である。"}, {"id": "A19", "c": "A", "f": "S", "X": "中国の戦国時代には、鉄製農具や牛耕が普及して農業生産が高まった。", "Y": "前漢の武帝は、黄巾の乱を鎮圧して漢を再興した。", "xs": true, "ys": false, "e": "Xは正しい。Y：黄巾の乱は後漢末の184年の農民反乱である。漢を再興（後漢を建国）したのは光武帝。"}, {"id": "A20", "c": "A", "f": "S", "X": "ヘレニズム時代の文化の中心地は、ナイル川上流のメロエであった。", "Y": "アレクサンドロス大王の東方遠征によって、アケメネス朝は滅亡した。", "xs": false, "ys": true, "e": "X：ヘレニズム文化の中心地はエジプトのアレクサンドリアで、ムセイオンが置かれた。Yは正しい（前330年）。"}, {"id": "A21", "c": "A", "f": "N", "p": "次のⅠ〜Ⅲの出来事を、年代の古いものから順に並べよ。", "i": ["サラミスの海戦", "アレクサンドロス大王の東方遠征の開始", "ペロポネソス戦争の開始"], "yr": ["前480年", "前334年", "前431年"], "ord": "132", "e": "サラミスの海戦（前480年）でギリシア側がペルシアを破り、のちアテネとスパルタのペロポネソス戦争（前431年〜）が起こった。アレクサンドロスの東方遠征は前334年に始まった。"}, {"id": "A22", "c": "A", "f": "N", "p": "次のⅠ〜Ⅲの出来事を、年代の古いものから順に並べよ。", "i": ["ミラノ勅令によるキリスト教の公認", "ポエニ戦争の開始", "オクタウィアヌスがアウグストゥスの称号を受ける"], "yr": ["313年", "前264年", "前27年"], "ord": "231", "e": "ポエニ戦争は前264年に始まり、前27年に元首政が始まった。キリスト教の公認は313年である。"}, {"id": "A23", "c": "A", "f": "N", "p": "次のⅠ〜Ⅲの出来事を、年代の古いものから順に並べよ。", "i": ["王莽が新を建てる", "呉楚七国の乱", "秦による中国の統一"], "yr": ["8年", "前154年", "前221年"], "ord": "321", "e": "秦の統一（前221年）ののち、前漢では呉楚七国の乱（前154年）を経て中央集権化が進んだ。王莽は8年に前漢を倒して新を建てた。"}, {"id": "A24", "c": "A", "f": "N", "p": "次のⅠ〜Ⅲの出来事を、年代の古いものから順に並べよ。", "i": ["西晋による中国の統一", "黄巾の乱", "北魏による華北の統一"], "yr": ["280年", "184年", "439年"], "ord": "213", "e": "後漢末の黄巾の乱（184年）ののち三国時代となり、西晋が280年に中国を統一した。北魏は439年に華北を統一した。"}, {"id": "B01", "c": "B", "f": "K", "q": "800年にローマ教皇レオ3世からローマ皇帝の冠を授けられたフランク王は誰か。", "o": ["カール大帝", "クローヴィス", "ピピン", "オットー1世"], "e": "カール大帝の戴冠により、西ヨーロッパにローマ・キリスト教・ゲルマンが融合した世界が成立したとされる。オットー1世は962年に戴冠した東フランク（ドイツ）王。"}, {"id": "B02", "c": "B", "f": "K", "q": "聖職叙任権をめぐって教皇グレゴリウス7世と争い、1077年に「カノッサの屈辱」で教皇に謝罪した皇帝は誰か。", "o": ["ハインリヒ4世", "フリードリヒ2世", "オットー1世", "カール5世"], "e": "叙任権闘争で破門されたハインリヒ4世は、カノッサで教皇に謝罪し破門を解かれた。"}, {"id": "B03", "c": "B", "f": "K", "q": "1095年のクレルモン宗教会議で、聖地奪回のための十字軍を提唱した教皇は誰か。", "o": ["ウルバヌス2世", "インノケンティウス3世", "ボニファティウス8世", "グレゴリウス7世"], "e": "ビザンツ皇帝の救援要請を受けたウルバヌス2世が十字軍を提唱し、翌1096年に第1回十字軍が出発した。"}, {"id": "B04", "c": "B", "f": "K", "q": "1215年、イングランドの貴族らがジョン王に認めさせ、課税には貴族らの同意を必要とすることなどを定めた文書はどれか。", "o": ["マグナ=カルタ（大憲章）", "権利の章典", "権利の請願", "金印勅書"], "e": "マグナ=カルタは王権を制限した文書で、のちイギリス立憲政治の基礎とされた。権利の請願は17世紀前半、権利の章典は名誉革命期、金印勅書は神聖ローマ帝国の文書。"}, {"id": "B05", "c": "B", "f": "K", "q": "6世紀に『ローマ法大全』を編纂させ、ハギア=ソフィア聖堂を再建したビザンツ皇帝は誰か。", "o": ["ユスティニアヌス帝", "レオン3世", "ヘラクレイオス1世", "コンスタンティヌス帝"], "e": "ユスティニアヌス帝は旧ローマ帝国領の一部を回復し、法典編纂や聖堂建設を行った。レオン3世は聖像禁止令を出した皇帝。"}, {"id": "B06", "c": "B", "f": "K", "q": "661年に成立し、ダマスクスを都としたイスラーム王朝はどれか。", "o": ["ウマイヤ朝", "アッバース朝", "ファーティマ朝", "後ウマイヤ朝"], "e": "ウマイヤ朝はムアーウィヤが開き、ダマスクスを都とした。アッバース朝はバグダード、ファーティマ朝はカイロ、後ウマイヤ朝はコルドバを都とした。"}, {"id": "B07", "c": "B", "f": "K", "q": "アッバース朝の第2代カリフ、マンスールが建設した新首都はどれか。", "o": ["バグダード", "カイロ", "コルドバ", "イスファハーン"], "e": "マンスールはティグリス川沿いに円形都市バグダードを建設した。カイロはファーティマ朝、コルドバは後ウマイヤ朝、イスファハーンはサファヴィー朝の都。"}, {"id": "B08", "c": "B", "f": "K", "q": "北宋で財政の立て直しと富国強兵をめざし、青苗法・募役法などの新法を実施した宰相は誰か。", "o": ["王安石", "司馬光", "朱熹", "張居正"], "e": "王安石は神宗に登用されて新法を実施したが、司馬光ら旧法党が反対し、新法党と旧法党の対立が続いた。張居正は明の政治家。"}, {"id": "B09", "c": "B", "f": "K", "q": "国号を元と定め、大都（現在の北京）を都とした皇帝は誰か。", "o": ["フビライ", "チンギス=ハン", "オゴタイ", "バトゥ"], "e": "フビライは1271年に国号を元とし、1279年に南宋を滅ぼした。チンギス=ハンはモンゴル帝国の建国者、オゴタイはカラコルムを都とした。"}, {"id": "B10", "c": "B", "f": "K", "q": "鄭和に命じて、東南アジアからインド洋・アフリカ東岸に至る大艦隊の遠征を行わせた明の皇帝は誰か。", "o": ["永楽帝", "洪武帝", "万暦帝", "乾隆帝"], "e": "永楽帝は鄭和の南海遠征を行わせ、朝貢をうながした。乾隆帝は清の皇帝である。"}, {"id": "B11", "c": "B", "f": "K", "q": "明の洪武帝が行った政策として正しいものはどれか。", "o": ["里甲制を整えて農村を把握した", "科挙に皇帝自ら試験官となる殿試を加えた", "軍機処を設置した", "両税法を施行した"], "e": "洪武帝は里甲制や賦役黄冊・魚鱗図冊により農村を掌握した。殿試は宋の太祖、軍機処は清の雍正帝、両税法は唐で始まった。"}, {"id": "B12", "c": "B", "f": "K", "q": "14世紀にマンサ=ムーサ王が大量の金を携えてメッカに巡礼したことで知られる西アフリカの王国はどれか。", "o": ["マリ王国", "ガーナ王国", "アクスム王国", "モノモタパ王国"], "e": "マリ王国はサハラ縦断交易で栄え、マンサ=ムーサのメッカ巡礼でその富が知られた。トンブクトゥはイスラームの学術の中心にもなった。"}, {"id": "B13", "c": "B", "f": "K", "q": "12世紀にヒンドゥー教寺院として造営されたアンコール=ワットを建てた王朝はどれか。", "o": ["アンコール朝（カンボジア）", "パガン朝（ビルマ）", "マジャパヒト王国（ジャワ）", "李朝（ベトナム）"], "e": "アンコール=ワットはカンボジアのアンコール朝が造営した寺院で、のちに仏教寺院となった。"}, {"id": "B14", "c": "B", "f": "K", "q": "1206年、アイバクがデリーを都として建てたインド最初のイスラーム王朝はどれか。", "o": ["奴隷王朝", "ロディー朝", "ムガル帝国", "ハルジー朝"], "e": "アイバクの奴隷王朝に始まり、ロディー朝までの5王朝をデリー=スルタン朝という。ムガル帝国は1526年にバーブルが建てた。"}, {"id": "B15", "c": "B", "f": "S", "X": "北宋では、交子と呼ばれる紙幣が使われるようになった。", "Y": "南宋の朱熹は、朱子学を大成した。", "xs": true, "ys": true, "e": "X：宋代には商業が発達し、交子・会子などの紙幣が用いられた。Y：朱熹（朱子）は宋学を大成した。いずれも正しい。"}, {"id": "B16", "c": "B", "f": "S", "X": "セルジューク朝の君主は、アッバース朝のカリフからスルタンの称号を授けられた。", "Y": "第4回十字軍は、イェルサレムを占領してイェルサレム王国を建てた。", "xs": true, "ys": false, "e": "Xは正しい（トゥグリル=ベク）。Y：第4回十字軍はコンスタンティノープルを占領してラテン帝国を建てた。イェルサレム王国は第1回十字軍が建てた。"}, {"id": "B17", "c": "B", "f": "S", "X": "百年戦争では、ジャンヌ=ダルクの活躍によりイギリス軍がオルレアンの包囲を破った。", "Y": "14世紀の黒死病（ペスト）の流行による人口減少は、農民の地位が向上する一因となった。", "xs": false, "ys": true, "e": "X：ジャンヌ=ダルクに率いられたフランス軍が、イギリス軍によるオルレアンの包囲を破った。Yは正しい。"}, {"id": "B18", "c": "B", "f": "S", "X": "バトゥは、ヨーロッパ遠征ののち南ロシアにイル=ハン国を建てた。", "Y": "マルコ=ポーロは、明の永楽帝に仕えたと伝えられる。", "xs": false, "ys": false, "e": "X：バトゥが建てたのはキプチャク=ハン国。イル=ハン国はフラグがイランに建てた。Y：マルコ=ポーロは元のフビライに仕えたとされる。"}, {"id": "B19", "c": "B", "f": "S", "X": "アッバース朝の時代には、ギリシア語の哲学や医学などの文献がアラビア語に翻訳された。", "Y": "イブン=バットゥータは、アジア・アフリカ各地を旅し『大旅行記（三大陸周遊記）』を残した。", "xs": true, "ys": true, "e": "X：バグダードの「知恵の館」などで翻訳が進められた。Y：イブン=バットゥータはモロッコ出身の旅行家である。いずれも正しい。"}, {"id": "B20", "c": "B", "f": "S", "X": "神聖ローマ帝国では、1356年の金印勅書によって皇帝の選出権がローマ教皇に与えられた。", "Y": "ノルマン人の首長ロロは、イングランドにノルマン朝を開いた。", "xs": false, "ys": false, "e": "X：金印勅書は皇帝選出権を7人の選帝侯に認めた。Y：ロロは北フランスにノルマンディー公国を建てた。ノルマン朝を開いたのはノルマンディー公ウィリアム。"}, {"id": "B21", "c": "B", "f": "N", "p": "次のⅠ〜Ⅲの出来事を、年代の古いものから順に並べよ。", "i": ["カノッサの屈辱", "オットー1世の戴冠", "カール大帝の戴冠"], "yr": ["1077年", "962年", "800年"], "ord": "321", "e": "カール大帝の戴冠（800年）、オットー1世の戴冠による神聖ローマ帝国の始まり（962年）、叙任権闘争のなかのカノッサの屈辱（1077年）の順。"}, {"id": "B22", "c": "B", "f": "N", "p": "次のⅠ〜Ⅲの出来事を、年代の古いものから順に並べよ。", "i": ["百年戦争の開始", "第1回十字軍の出発", "マグナ=カルタの制定"], "yr": ["1339年", "1096年", "1215年"], "ord": "231", "e": "第1回十字軍は1096年、マグナ=カルタは1215年、英仏の百年戦争は1339年に始まった。"}, {"id": "B23", "c": "B", "f": "N", "p": "次のⅠ〜Ⅲの出来事を、年代の古いものから順に並べよ。", "i": ["靖康の変", "フビライが国号を元とする", "宋（北宋）の建国"], "yr": ["1126〜27年", "1271年", "960年"], "ord": "312", "e": "趙匡胤が960年に宋を建て、靖康の変（1126〜27年）で北宋は金に滅ぼされた。フビライが国号を元としたのは1271年。"}, {"id": "B24", "c": "B", "f": "N", "p": "次のⅠ〜Ⅲの出来事を、年代の古いものから順に並べよ。", "i": ["モンゴル軍によるアッバース朝の滅亡", "ムハンマドのヒジュラ（聖遷）", "アッバース朝の成立"], "yr": ["1258年", "622年", "750年"], "ord": "231", "e": "ヒジュラは622年でイスラーム暦の紀元となった。アッバース朝は750年に成立し、1258年にフラグ率いるモンゴル軍に滅ぼされた。"}, {"id": "C01", "c": "C", "f": "K", "q": "喜望峰を回り、1498年にインド西岸のカリカットに到達した航海者は誰か。", "o": ["ヴァスコ=ダ=ガマ", "バルトロメウ=ディアス", "コロンブス", "マゼラン"], "e": "ポルトガルのヴァスコ=ダ=ガマがインド航路を開いた。ディアスは喜望峰に到達し、コロンブスはカリブ海の島に到達した。"}, {"id": "C02", "c": "C", "f": "K", "q": "1517年に「九十五か条の論題」を発表し、贖宥状（免罪符）の販売を批判した人物は誰か。", "o": ["ルター", "カルヴァン", "ツヴィングリ", "フス"], "e": "ルターの批判をきっかけにドイツで宗教改革が始まった。カルヴァンはジュネーヴ、ツヴィングリはチューリヒで改革を行い、フスは15世紀ベーメンの改革者。"}, {"id": "C03", "c": "C", "f": "K", "q": "首長法（国王至上法）を制定して、国王をイギリス国内の教会の首長とした国王は誰か。", "o": ["ヘンリ8世", "エリザベス1世", "ジェームズ1世", "メアリ1世"], "e": "ヘンリ8世は離婚問題から教皇と対立し、1534年の首長法でイギリス国教会を成立させた。エリザベス1世は統一法で国教会を確立した。"}, {"id": "C04", "c": "C", "f": "K", "q": "16世紀前半にインカ帝国を征服したスペイン人は誰か。", "o": ["ピサロ", "コルテス", "ラス=カサス", "カブラル"], "e": "ピサロがインカ帝国を、コルテスがアステカ王国を征服した。ラス=カサスは先住民の保護を訴えた聖職者、カブラルはブラジルに漂着したポルトガル人。"}, {"id": "C05", "c": "C", "f": "K", "q": "1598年にナントの王令を出し、ユグノー（新教徒）にも信仰の自由を認めてユグノー戦争を終わらせたフランス国王は誰か。", "o": ["アンリ4世", "ルイ14世", "ルイ13世", "フランソワ1世"], "e": "ブルボン朝を開いたアンリ4世がナントの王令を出した。ルイ14世は1685年にこれを廃止した。"}, {"id": "C06", "c": "C", "f": "K", "q": "三十年戦争を終結させ、スイスとオランダの独立が国際的に承認された条約はどれか。", "o": ["ウェストファリア条約", "ユトレヒト条約", "アウクスブルクの和議", "ネルチンスク条約"], "e": "1648年のウェストファリア条約で神聖ローマ帝国内の諸侯の主権がほぼ認められ、主権国家体制が確立したとされる。"}, {"id": "C07", "c": "C", "f": "K", "q": "西欧化政策を進め、バルト海沿岸に新都ペテルブルクを建設したロシアの皇帝は誰か。", "o": ["ピョートル1世", "イヴァン4世", "エカチェリーナ2世", "ニコライ1世"], "e": "ピョートル1世は北方戦争でスウェーデンを破り、ペテルブルクを建設した。"}, {"id": "C08", "c": "C", "f": "K", "q": "1529年にウィーンを包囲し、ヨーロッパに大きな脅威を与えたオスマン帝国のスルタンは誰か。", "o": ["スレイマン1世", "メフメト2世", "セリム1世", "バヤジット1世"], "e": "スレイマン1世のもとでオスマン帝国は最盛期を迎えた。メフメト2世はコンスタンティノープルを攻略し、セリム1世はマムルーク朝を滅ぼした。"}, {"id": "C09", "c": "C", "f": "K", "q": "非ムスリムに課されていた人頭税（ジズヤ）を廃止し、ヒンドゥー教徒との融和をはかったムガル帝国の皇帝は誰か。", "o": ["アクバル", "アウラングゼーブ", "バーブル", "シャー=ジャハーン"], "e": "アクバルはジズヤを廃止して融和策をとった。アウラングゼーブは厳格なイスラーム政策をとり、ジズヤを復活させた。"}, {"id": "C10", "c": "C", "f": "K", "q": "16世紀末に新首都イスファハーンを建設し、サファヴィー朝の最盛期を築いた君主は誰か。", "o": ["アッバース1世", "イスマーイール1世", "スレイマン1世", "ナーディル=シャー"], "e": "アッバース1世はイスファハーンを都とし、「イスファハーンは世界の半分」とたたえられた。イスマーイール1世はサファヴィー朝の創始者。"}, {"id": "C11", "c": "C", "f": "K", "q": "1689年にロシアとネルチンスク条約を結び、両国の国境を定めた清の皇帝は誰か。", "o": ["康熙帝", "雍正帝", "乾隆帝", "順治帝"], "e": "康熙帝はネルチンスク条約でアルグン川と外興安嶺を国境とした。雍正帝はキャフタ条約（1727年）でモンゴル方面の国境を定めた。"}, {"id": "C12", "c": "C", "f": "K", "q": "清の雍正帝が設置し、のちに政治の最高機関となった機関はどれか。", "o": ["軍機処", "理藩院", "総理各国事務衙門", "中書省"], "e": "軍機処はジュンガル遠征に際し軍事機密を扱うため設けられ、のち政治の最高機関となった。理藩院は藩部を統轄する機関、総理各国事務衙門は1861年に設置された外交官庁。"}, {"id": "C13", "c": "C", "f": "K", "q": "17世紀にオランダ東インド会社がジャワ島に建設し、アジア交易の拠点とした都市はどれか。", "o": ["バタヴィア", "マニラ", "マラッカ", "ゴア"], "e": "オランダはバタヴィア（現在のジャカルタ）を拠点とした。マニラはスペイン、ゴアとマラッカはポルトガルの拠点として知られる。"}, {"id": "C14", "c": "C", "f": "K", "q": "17〜18世紀の大西洋三角貿易で、アフリカ西岸から南北アメリカ・カリブ海へ主に運ばれたものはどれか。", "o": ["奴隷とされた黒人", "砂糖・タバコ", "武器・雑貨", "茶・陶磁器"], "e": "ヨーロッパから武器・雑貨がアフリカへ、アフリカから黒人奴隷がアメリカ大陸へ、アメリカ大陸から砂糖・タバコなどがヨーロッパへ運ばれた。"}, {"id": "C15", "c": "C", "f": "S", "X": "エリザベス1世の時代、イギリスはスペインの無敵艦隊を破った。", "Y": "オランダは、スペインからの独立戦争を経て、17世紀に海上貿易で繁栄した。", "xs": true, "ys": true, "e": "X：1588年にイギリスはスペインの無敵艦隊（アルマダ）を破った。Y：オランダはアムステルダムを中心に17世紀前半に繁栄した。いずれも正しい。"}, {"id": "C16", "c": "C", "f": "S", "X": "フランスのルイ14世は、コルベールを登用して重商主義政策を進めた。", "Y": "ルイ14世は、ナントの王令を発布してユグノーの信仰を認めた。", "xs": true, "ys": false, "e": "Xは正しい。Y：ナントの王令はアンリ4世が発布したもので、ルイ14世はこれを廃止した。"}, {"id": "C17", "c": "C", "f": "S", "X": "コペルニクスは、天動説を唱えて地動説を否定した。", "Y": "グーテンベルクが改良した活版印刷術は、宗教改革の思想の普及を助けた。", "xs": false, "ys": true, "e": "X：コペルニクスは地動説を唱えた。Yは正しい。"}, {"id": "C18", "c": "C", "f": "S", "X": "オスマン帝国は、1453年にウィーンを攻略して首都とした。", "Y": "オスマン帝国は、キリスト教徒の子弟を徴用してマムルーク軍団を編成した。", "xs": false, "ys": false, "e": "X：1453年にメフメト2世が攻略して首都としたのはコンスタンティノープル（イスタンブル）。Y：キリスト教徒の子弟を徴用（デヴシルメ）して編成したのはイェニチェリである。"}, {"id": "C19", "c": "C", "f": "S", "X": "清は、漢人男性に辮髪を禁止した。", "Y": "清は、中央の官職に満洲人と漢人を同数任用する満漢併用制をとった。", "xs": false, "ys": true, "e": "X：清は漢人男性に辮髪を強制した。Yは正しい。清は懐柔策と威圧策を併用した。"}, {"id": "C20", "c": "C", "f": "S", "X": "ムガル帝国のシャー=ジャハーンは、タージ=マハルを造営させた。", "Y": "ムガル帝国のアウラングゼーブは、ヒンドゥー教徒に寛容な政策をとってジズヤを廃止した。", "xs": true, "ys": false, "e": "Xは正しい。Y：アウラングゼーブはジズヤを復活させ、ヒンドゥー教徒などの反発を招いた。ジズヤを廃止したのはアクバル。"}, {"id": "C21", "c": "C", "f": "N", "p": "次のⅠ〜Ⅲの出来事を、年代の古いものから順に並べよ。", "i": ["ルターが九十五か条の論題を発表", "コロンブスがカリブ海の島に到達", "アウクスブルクの和議"], "yr": ["1517年", "1492年", "1555年"], "ord": "213", "e": "コロンブスの到達は1492年、ルターの宗教改革開始は1517年、ルター派が公認されたアウクスブルクの和議は1555年。"}, {"id": "C22", "c": "C", "f": "N", "p": "次のⅠ〜Ⅲの出来事を、年代の古いものから順に並べよ。", "i": ["ウェストファリア条約", "ナントの王令", "ユトレヒト条約"], "yr": ["1648年", "1598年", "1713年"], "ord": "213", "e": "ナントの王令（1598年）、三十年戦争を終えたウェストファリア条約（1648年）、スペイン継承戦争を終えたユトレヒト条約（1713年）の順。"}, {"id": "C23", "c": "C", "f": "N", "p": "次のⅠ〜Ⅲの出来事を、年代の古いものから順に並べよ。", "i": ["ネルチンスク条約", "キャフタ条約", "明の滅亡"], "yr": ["1689年", "1727年", "1644年"], "ord": "312", "e": "明は1644年に李自成の反乱軍に滅ぼされ、清が北京に入った。ネルチンスク条約は康熙帝期の1689年、キャフタ条約は雍正帝期の1727年。"}, {"id": "C24", "c": "C", "f": "N", "p": "次のⅠ〜Ⅲの出来事を、年代の古いものから順に並べよ。", "i": ["プレヴェザの海戦", "レパントの海戦", "オスマン帝国によるコンスタンティノープル攻略"], "yr": ["1538年", "1571年", "1453年"], "ord": "312", "e": "1453年にビザンツ帝国が滅亡した。オスマン帝国はプレヴェザの海戦（1538年）で地中海の制海権を握ったが、レパントの海戦（1571年）ではスペインなどに敗れた。"}, {"id": "D01", "c": "D", "f": "K", "q": "1776年に発表されたアメリカ独立宣言の主な起草者は誰か。", "o": ["トマス=ジェファソン", "ジョージ=ワシントン", "リンカン", "モンロー"], "e": "独立宣言はジェファソンらが起草し、ロックの思想の影響を受けて自然権や抵抗権を掲げた。ワシントンは独立戦争の総司令官で初代大統領。"}, {"id": "D02", "c": "D", "f": "K", "q": "1789年、フランスで人権宣言（人間および市民の権利の宣言）を採択した機関はどれか。", "o": ["国民議会", "国民公会", "立法議会", "総裁政府"], "e": "三部会から分かれた国民議会が人権宣言を採択した。国民公会は1792年に成立し王政廃止を宣言した。"}, {"id": "D03", "c": "D", "f": "K", "q": "法の前の平等や私有財産の不可侵などを定めた民法典を1804年に公布した人物は誰か。", "o": ["ナポレオン", "ロベスピエール", "ルイ16世", "ルイ=フィリップ"], "e": "ナポレオン法典（フランス民法典）は革命の成果を法的に定着させた。"}, {"id": "D04", "c": "D", "f": "K", "q": "ナポレオン戦争後のウィーン会議を主宰したオーストリアの政治家は誰か。", "o": ["メッテルニヒ", "ビスマルク", "カヴール", "グラッドストン"], "e": "メッテルニヒのもとで、正統主義を原則とする保守的なウィーン体制が成立した。"}, {"id": "D05", "c": "D", "f": "K", "q": "18世紀後半に蒸気機関を改良し、工場の動力として広く使えるようにした人物は誰か。", "o": ["ワット", "スティーヴンソン", "カートライト", "ハーグリーヴズ"], "e": "ワットの改良した蒸気機関は綿工業などの動力となった。スティーヴンソンは蒸気機関車、カートライトは力織機、ハーグリーヴズはジェニー紡績機で知られる。"}, {"id": "D06", "c": "D", "f": "K", "q": "「鉄血政策」により軍備拡張を進め、プロイセン中心のドイツ統一を実現した首相は誰か。", "o": ["ビスマルク", "ヴィルヘルム2世", "メッテルニヒ", "カヴール"], "e": "ビスマルクは普墺戦争・普仏戦争に勝利し、1871年にドイツ帝国が成立した。カヴールはサルデーニャ王国の首相。"}, {"id": "D07", "c": "D", "f": "K", "q": "千人隊（赤シャツ隊）を率いて両シチリア王国を占領し、その地をサルデーニャ王に献じた人物は誰か。", "o": ["ガリバルディ", "マッツィーニ", "カヴール", "ヴィットーリオ=エマヌエーレ2世"], "e": "ガリバルディの献上により南北イタリアが合わさり、1861年にイタリア王国が成立した。マッツィーニは「青年イタリア」を結成した人物。"}, {"id": "D08", "c": "D", "f": "K", "q": "南北戦争中の1863年に奴隷解放宣言を発したアメリカ大統領は誰か。", "o": ["リンカン", "ジャクソン", "ジェファソン", "セオドア=ローズヴェルト"], "e": "共和党のリンカンは奴隷解放宣言で内外の世論を味方につけ、北部が勝利した。"}, {"id": "D09", "c": "D", "f": "K", "q": "1804年にフランスから独立し、ラテンアメリカ最初の独立国となり、黒人による共和国が成立した国はどれか。", "o": ["ハイチ", "ブラジル", "メキシコ", "アルゼンチン"], "e": "トゥサン=ルヴェルチュールらの指導した革命により、ハイチが独立した。"}, {"id": "D10", "c": "D", "f": "K", "q": "アヘン戦争の講和条約である南京条約で、清がイギリスに割譲したものはどれか。", "o": ["香港島", "九竜半島南部", "台湾", "遼東半島"], "e": "南京条約（1842年）で香港島が割譲され、上海など5港が開かれた。九竜半島南部は北京条約、台湾と遼東半島は下関条約で日本に割譲された（遼東半島は三国干渉で返還）。"}, {"id": "D11", "c": "D", "f": "K", "q": "上帝会を組織し、「滅満興漢」を掲げて太平天国を建てた人物は誰か。", "o": ["洪秀全", "曽国藩", "李鴻章", "康有為"], "e": "洪秀全はキリスト教の影響を受けて上帝会を組織した。曽国藩・李鴻章は郷勇を率いて太平天国の鎮圧に当たった。康有為は変法運動の指導者。"}, {"id": "D12", "c": "D", "f": "K", "q": "1857年に東インド会社のインド人傭兵（シパーヒー）の反乱から広がったインド大反乱の結果として正しいものはどれか。", "o": ["ムガル帝国が滅亡し、東インド会社は解散した", "インドがただちに独立を達成した", "ベンガル分割令が撤回された", "インド国民会議が解散させられた"], "e": "反乱鎮圧の過程でムガル帝国は滅亡し、東インド会社は解散してイギリス政府の直接統治となった。1877年にはインド帝国が成立した。"}, {"id": "D13", "c": "D", "f": "K", "q": "1876年にオスマン帝国で発布された、アジアで最初の憲法とされるものはどれか。", "o": ["ミドハト憲法", "ギュルハネ勅令", "大日本帝国憲法", "欽定憲法大綱"], "e": "大宰相ミドハト=パシャが起草したミドハト憲法は、露土戦争を口実に停止された。ギュルハネ勅令（1839年）はタンジマートを開始した勅令。"}, {"id": "D14", "c": "D", "f": "K", "q": "1884〜85年に開かれ、アフリカの領有について先占権や実効支配の原則を定めた国際会議はどれか。", "o": ["ベルリン会議（ベルリン=コンゴ会議）", "ウィーン会議", "パリ講和会議", "ワシントン会議"], "e": "ビスマルクが主催したこの会議以後、列強によるアフリカ分割が急速に進んだ。"}, {"id": "D15", "c": "D", "f": "S", "X": "イギリスでは、1832年の第1回選挙法改正により産業資本家が選挙権を得た。", "Y": "イギリスのチャーティスト運動は、男性普通選挙などを要求した。", "xs": true, "ys": true, "e": "X：第1回選挙法改正で都市の中産階級が選挙権を得た。Y：労働者は人民憲章を掲げ男性普通選挙などを求めた。いずれも正しい。"}, {"id": "D16", "c": "D", "f": "S", "X": "日清戦争の講和条約である下関条約で、清は朝鮮の独立を認めた。", "Y": "清の戊戌の変法は、西太后ら保守派の支持を受けて成功した。", "xs": true, "ys": false, "e": "Xは正しい。Y：康有為らの戊戌の変法は、西太后ら保守派のクーデタ（戊戌の政変）で失敗した。"}, {"id": "D17", "c": "D", "f": "S", "X": "ベトナムでは、ファン=ボイ=チャウがドイツへの留学を勧めるドンズー（東遊）運動を進めた。", "Y": "フィリピンでは、ホセ=リサールがスペインの支配を批判する言論活動を行った。", "xs": false, "ys": true, "e": "X：ドンズー運動は日本への留学を勧める運動である。Yは正しい。"}, {"id": "D18", "c": "D", "f": "S", "X": "アメリカ合衆国は、メキシコとの戦争の結果、ルイジアナを獲得した。", "Y": "クリミア戦争で、ロシアはオスマン帝国・イギリス・フランスに勝利した。", "xs": false, "ys": false, "e": "X：アメリカ=メキシコ戦争で獲得したのはカリフォルニアなど。ルイジアナはフランスから買収した。Y：クリミア戦争ではロシアが敗れた。"}, {"id": "D19", "c": "D", "f": "S", "X": "エチオピアは、アドワの戦いでイタリア軍を破り、独立を守った。", "Y": "南アフリカ戦争で、イギリスはブール人のトランスヴァール共和国とオレンジ自由国を併合した。", "xs": true, "ys": true, "e": "X：エチオピアは1896年にイタリア軍を破った。Y：イギリスは南アフリカ戦争（1899〜1902年）でブール人の2国を併合した。いずれも正しい。"}, {"id": "D20", "c": "D", "f": "S", "X": "清朝最後の皇帝は、光緒帝である。", "Y": "1905年に孫文が東京で結成した革命団体は、興中会である。", "xs": false, "ys": false, "e": "X：清朝最後の皇帝は宣統帝（溥儀）である。Y：1905年に東京で結成されたのは中国同盟会。興中会は1894年にハワイで結成された。"}, {"id": "D21", "c": "D", "f": "N", "p": "次のⅠ〜Ⅲの出来事を、年代の古いものから順に並べよ。", "i": ["フランス人権宣言", "アメリカ独立宣言", "ナポレオンの皇帝即位"], "yr": ["1789年", "1776年", "1804年"], "ord": "213", "e": "アメリカ独立宣言（1776年）の影響も受けてフランス人権宣言（1789年）が出され、のちナポレオンが1804年に皇帝となった。"}, {"id": "D22", "c": "D", "f": "N", "p": "次のⅠ〜Ⅲの出来事を、年代の古いものから順に並べよ。", "i": ["ウィーン会議の開催", "ドイツ帝国の成立", "フランス二月革命"], "yr": ["1814年", "1871年", "1848年"], "ord": "132", "e": "ウィーン会議は1814〜15年、二月革命は1848年、ドイツ帝国の成立は1871年。"}, {"id": "D23", "c": "D", "f": "N", "p": "次のⅠ〜Ⅲの出来事を、年代の古いものから順に並べよ。", "i": ["日清戦争の開始", "アヘン戦争の開始", "太平天国の乱の開始"], "yr": ["1894年", "1840年", "1851年"], "ord": "231", "e": "アヘン戦争は1840年、太平天国の乱は1851年、日清戦争は1894年に始まった。"}, {"id": "D24", "c": "D", "f": "N", "p": "次のⅠ〜Ⅲの出来事を、年代の古いものから順に並べよ。", "i": ["インド国民会議の結成", "インド大反乱", "ベンガル分割令"], "yr": ["1885年", "1857年", "1905年"], "ord": "213", "e": "インド大反乱（1857年）ののち、インド国民会議が1885年に結成された。1905年のベンガル分割令に対して反英運動が高まった。"}, {"id": "E01", "c": "E", "f": "K", "q": "第一次世界大戦のきっかけとなった、オーストリアの帝位継承者夫妻が暗殺された事件はどれか。", "o": ["サライェヴォ事件", "柳条湖事件", "盧溝橋事件", "ファショダ事件"], "e": "1914年、ボスニアのサライェヴォでセルビア人青年がオーストリア帝位継承者夫妻を暗殺した。"}, {"id": "E02", "c": "E", "f": "K", "q": "1917年の十月革命（十一月革命）で、ボリシェヴィキを率いて臨時政府を倒した指導者は誰か。", "o": ["レーニン", "スターリン", "ケレンスキー", "ニコライ2世"], "e": "レーニンの指導するボリシェヴィキが武装蜂起し、ケレンスキーの臨時政府を倒してソヴィエト政権を樹立した。"}, {"id": "E03", "c": "E", "f": "K", "q": "十四か条の平和原則を発表し、国際連盟の設立を提唱したアメリカ大統領は誰か。", "o": ["ウィルソン", "フランクリン=ローズヴェルト", "セオドア=ローズヴェルト", "トルーマン"], "e": "ウィルソンは国際連盟の設立を提唱したが、アメリカは上院の反対で連盟に加盟しなかった。"}, {"id": "E04", "c": "E", "f": "K", "q": "1929年に始まった世界恐慌に対して、テネシー川流域開発公社（TVA）の設立などのニューディールを進めたアメリカ大統領は誰か。", "o": ["フランクリン=ローズヴェルト", "フーヴァー", "トルーマン", "ウィルソン"], "e": "フランクリン=ローズヴェルトは政府が経済に積極的に介入するニューディールを実施した。フーヴァーは恐慌発生時の大統領。"}, {"id": "E05", "c": "E", "f": "K", "q": "1923年にトルコ共和国を樹立し、カリフ制の廃止や文字改革などの近代化を進めた人物は誰か。", "o": ["ムスタファ=ケマル", "ミドハト=パシャ", "ナセル", "レザー=ハーン"], "e": "ムスタファ=ケマルはトルコ共和国の初代大統領となり、政教分離や文字改革を進めた。ナセルはエジプト、レザー=ハーンはイランの指導者。"}, {"id": "E06", "c": "E", "f": "K", "q": "非暴力・不服従を掲げ、1930年には「塩の行進」を行ってイギリスの支配に抵抗したインドの指導者は誰か。", "o": ["ガンディー", "ネルー", "ジンナー", "ティラク"], "e": "ガンディーはイギリスの塩の専売に反対して塩の行進を行った。ジンナーは全インド=ムスリム連盟の指導者で、パキスタン建国を主導した。"}, {"id": "E07", "c": "E", "f": "K", "q": "第二次世界大戦の開始の直接の契機となった出来事はどれか。", "o": ["ドイツのポーランド侵攻", "ドイツのラインラント進駐", "ドイツのオーストリア併合", "独ソ戦の開始"], "e": "1939年9月、ドイツがポーランドに侵攻し、イギリス・フランスがドイツに宣戦した。ラインラント進駐は1936年、オーストリア併合は1938年、独ソ戦は1941年。"}, {"id": "E08", "c": "E", "f": "K", "q": "1947年にアメリカが発表した、ヨーロッパの経済復興を援助する計画はどれか。", "o": ["マーシャル=プラン", "トルーマン=ドクトリン", "コメコン", "ドーズ案"], "e": "マーシャル=プランに対抗して、ソ連と東欧諸国はコメコン（経済相互援助会議）を結成した。トルーマン=ドクトリンはギリシア・トルコへの援助による「封じ込め政策」。"}, {"id": "E09", "c": "E", "f": "K", "q": "1949年に成立した中華人民共和国の国家主席に就任した人物は誰か。", "o": ["毛沢東", "蒋介石", "鄧小平", "孫文"], "e": "毛沢東が主席、周恩来が首相となった。蒋介石の国民政府は台湾に逃れた。"}, {"id": "E10", "c": "E", "f": "K", "q": "1950年に始まった朝鮮戦争について述べた文として正しいものはどれか。", "o": ["国連安全保障理事会の決議に基づき、アメリカ軍を主力とする国連軍が派遣された", "ソ連軍が国連軍として韓国を支援した", "戦争の結果、朝鮮半島は統一された", "中華人民共和国は韓国側に立って参戦した"], "e": "北朝鮮の侵攻に対し、ソ連欠席の安保理決議によって国連軍が派遣された。中国は人民義勇軍を北朝鮮側に送り、1953年に休戦協定が結ばれ南北分断が続いた。"}, {"id": "E11", "c": "E", "f": "K", "q": "1957年にエンクルマ（ンクルマ）の指導で独立し、サハラ以南のアフリカで最初の自力独立の黒人国家となった国はどれか。", "o": ["ガーナ", "ケニア", "アルジェリア", "コンゴ"], "e": "ガーナの独立はアフリカ諸国の独立運動を勢いづけ、1960年には17か国が独立して「アフリカの年」と呼ばれた。"}, {"id": "E12", "c": "E", "f": "K", "q": "1954年にインドシナ戦争の休戦を定め、北緯17度線をベトナムの暫定的な軍事境界線とした協定はどれか。", "o": ["ジュネーヴ休戦協定", "パリ和平協定", "板門店での休戦協定", "ヤルタ協定"], "e": "ディエンビエンフーの戦いでフランスが敗れ、ジュネーヴ休戦協定が結ばれた。パリ和平協定（1973年）はベトナム戦争、板門店の協定は朝鮮戦争の休戦。"}, {"id": "E13", "c": "E", "f": "K", "q": "1959年、親米的なバティスタ政権を倒してキューバ革命を指導した人物は誰か。", "o": ["カストロ", "アジェンデ", "ペロン", "ヴァルガス"], "e": "カストロは革命後に社会主義宣言を行い、ソ連に接近した。アジェンデはチリ、ペロンはアルゼンチン、ヴァルガスはブラジルの指導者。"}, {"id": "E14", "c": "E", "f": "K", "q": "1989年、アメリカのブッシュ（父）とソ連のゴルバチョフが冷戦の終結を宣言した会談はどれか。", "o": ["マルタ会談", "ヤルタ会談", "ポツダム会談", "ジュネーヴ4巨頭会談"], "e": "地中海のマルタ島での米ソ首脳会談で冷戦の終結が宣言された。ヤルタ会談とポツダム会談は第二次世界大戦末期の会談。"}, {"id": "E15", "c": "E", "f": "S", "X": "1955年、インドネシアのバンドンでアジア・アフリカ会議が開かれた。", "Y": "1961年、第1回非同盟諸国首脳会議がユーゴスラヴィアのベオグラードで開かれた。", "xs": true, "ys": true, "e": "X：アジア・アフリカ会議では平和十原則が採択された。Y：ティトー・ネルー・ナセルらが主導した。いずれも正しい。"}, {"id": "E16", "c": "E", "f": "S", "X": "キューバ危機は、ソ連がキューバにミサイル基地を建設したことから起こった。", "Y": "キューバ危機の後、米ソは首脳間の直通通信回線（ホットライン）の設置を拒否した。", "xs": true, "ys": false, "e": "Xは正しい（1962年）。Y：危機の後、米ソはホットラインを設置し、部分的核実験禁止条約を結ぶなど緊張緩和に向か const CATS=D.cats;const Q=D.q;
const FMT={K:"4択",S:"正誤",N:"整序"};
const SO=["X 正　Y 正","X 正　Y 誤","X 誤　Y 正","X 誤　Y 誤"];
const NO=["Ⅰ－Ⅱ－Ⅲ","Ⅰ－Ⅲ－Ⅱ","Ⅱ－Ⅰ－Ⅲ","Ⅱ－Ⅲ－Ⅰ","Ⅲ－Ⅰ－Ⅱ","Ⅲ－Ⅱ－Ⅰ"];
const NK=["123","132","213","231","312","321"];
Q.forEach(q=>{if(q.f==="S"){q.o=SO;q.a=(q.xs?0:2)+(q.ys?0:1)}else if(q.f==="N"){q.o=NO;q.a=NK.indexOf(q.ord)}else{q.a=0}});
const FSEG=[["ALL","すべて"]].concat(["K","S","N"].filter(f=>Q.some(q=>q.f===f)).map(f=>[f,FMT[f]]));

/* ===== 記録（このブラウザのみ） ===== */
const KEY="kyotsu-sekaishi-v1";
let rec={};
try{rec=JSON.parse(localStorage.getItem(KEY)||"{}")||{}}catch(e){rec={}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(rec))}catch(e){}}
function mark(id,ok){const r=rec[id]||{c:0,w:0};ok?r.c++:r.w++;r.last=ok;rec[id]=r;save()}
/* ===== ランク（習得度：正解済み問題の割合） ===== */
const RANKS=[
  {t:"新入生",en:"FRESHMAN",min:0},
  {t:"学士",en:"BACHELOR",min:15},
  {t:"修士",en:"MASTER",min:35},
  {t:"博士",en:"DOCTOR",min:55},
  {t:"教授",en:"PROFESSOR",min:75},
  {t:"名誉教授",en:"EMERITUS",min:90}
];
function mastery(){let ok=0;Q.forEach(q=>{const r=rec[q.id];if(r&&r.last)ok++});return{ok,n:Q.length,pct:Q.length?ok/Q.length*100:0}}
function rankOf(pct){let i=0;RANKS.forEach((r,k)=>{if(pct>=r.min)i=k});return i}
function stars(i){return "★".repeat(i)+"☆".repeat(RANKS.length-1-i)}
function rankPanel(){
  const m=mastery(),i=rankOf(m.pct),r=RANKS[i],nx=RANKS[i+1];
  const need=nx?Math.max(1,Math.ceil(nx.min/100*m.n)-m.ok):0;
  const lo=r.min,hi=nx?nx.min:100,prog=nx?Math.min(100,Math.max(0,(m.pct-lo)/(hi-lo)*100)):100;
  return `<div class="panel rankp"><div class="rk-badge rk${i}" aria-hidden="true"><span class="rk-en">${r.en}</span><span class="rk-t">${r.t}</span><span class="rk-st">${stars(i)}</span></div>
    <div class="rk-body"><h2>あなたのランク：${r.t}</h2>
    <p class="kbd num">正解済み ${m.ok} / ${m.n} 問（${Math.floor(m.pct)}%）</p>
    <div class="meter rk-meter"><i style="width:${prog}%"></i></div>
    <p class="kbd">${nx?`次の「${nx.t}」まで、あと <b class="num">${need}</b> 問正解`:"最高ランクに到達しました！"}</p></div></div>`;
}
const TITLES=[[100,"名誉教授級"],[90,"教授級"],[75,"博士級"],[60,"修士級"],[40,"学士級"],[0,"新入生級"]];
function sessionRank(ok,n,r0){
  const p=n?ok/n*100:0;const t=TITLES.find(x=>p>=x[0])[1];
  const r1=rankOf(mastery().pct);
  const up=r1>r0?`<div class="rk-up">ランクアップ！ ${RANKS[r0].t} → <b>${RANKS[r1].t}</b></div>`:"";
  return `<div class="rk-session"><span class="kbd">今回の称号</span><span class="rk-title">${t}</span></div>${up}`;
}

/* ===== 状態 ===== */
const app=document.getElementById("app");
let S={view:"home",size:10,fmt:"ALL"};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const rich=s=>esc(s).replace(/&lt;(\/?)(sup|sub|u)&gt;/g,"<$1$2>").replace(/&lt;br&gt;/g,"<br>");
const ROM=["Ⅰ","Ⅱ","Ⅲ"];

function header(){return `<header class="top"><div class="subject"><h1><b>世界史</b> ドリル</h1><span class="tag">共通テスト対策</span></div>
  <div class="row"><a class="subj-link" href="index.html">メニュー</a><small class="num">全${Q.length}問</small></div></header>`}
const fmtOK=q=>S.fmt==="ALL"||q.f===S.fmt;
function stats(cat){const qs=Q.filter(q=>!cat||q.c===cat);let done=0,ok=0;qs.forEach(q=>{const r=rec[q.id];if(r){done++;if(r.last)ok++}});return{n:qs.length,done,ok}}

function home(){
  delete app.dataset.cat;
  const missN=Q.filter(q=>rec[q.id]&&rec[q.id].last===false&&fmtOK(q)).length;
  const all=stats();
  app.innerHTML=header()+`
  <p class="lead">分野を選んで始めてください。1問ごとに正誤と解説が出ます。正解を増やすとランクが上がります。記録はこの端末に保存されます。</p>
  <div class="row"><span class="kbd" ${FSEG.length<3?"hidden":""}>形式</span>
    <div class="seg" role="group" aria-label="形式" ${FSEG.length<3?"hidden":""}>${FSEG.map(([k,l])=>`<button id="fm${k}" aria-pressed="${S.fmt===k}" data-fmt="${k}">${l}</button>`).join("")}</div>
    <span class="kbd">出題数</span>
    <div class="seg" role="group" aria-label="出題数">${[10,20,0].map(n=>`<button id="sz${n}" aria-pressed="${S.size===n}" data-size="${n}">${n?n+"問":"全問"}</button>`).join("")}</div></div>
  <div class="cats">${Object.entries(CATS).map(([k,c])=>{const s=stats(k);const pct=s.n?Math.round(s.ok/s.n*100):0;
    return `<button class="cat" id="cat${k}" data-cat="${k}"><span class="k">${c.k}　<span class="era-yr">${c.yr}</span></span><span class="t">${c.name}</span><span class="d">${c.d}</span>
    <span class="meter" aria-hidden="true"><i style="width:${pct}%"></i></span><span class="s num">正解済 ${s.ok} / ${s.n}　解答済 ${s.done}</span></button>`}).join("")}</div>
  <div class="row">
    <button class="btn primary" id="mix" data-cat="ALL">全分野ミックス</button>
    <button class="btn" id="review" data-cat="MISS" ${missN?"":"disabled"}>間違えた問題を復習（${missN}問）</button>
  </div>
  ${rankPanel()}
  <div class="panel"><h2>これまでの成績</h2>
    <div class="score"><span class="big">${all.done?Math.round(all.ok/all.done*100):0}<small style="font-size:18px">%</small></span>
    <span class="kbd num">直近の正答率（解答済 ${all.done} 問中 ${all.ok} 問正解）</span></div>
    <div class="row" style="margin-top:10px"><button class="btn" id="reset" ${all.done?"":"disabled"}>記録を消す</button><span class="kbd" id="resetMsg"></span></div>
  </div>
  <footer>操作：選択肢は数字キー（1〜6）、次へは Enter キーでも進めます。</footer>`;
  app.querySelectorAll("[data-size]").forEach(b=>b.onclick=()=>{S.size=+b.dataset.size;home()});
  app.querySelectorAll("[data-fmt]").forEach(b=>b.onclick=()=>{S.fmt=b.dataset.fmt;home()});
  app.querySelectorAll("button[data-cat]").forEach(b=>b.onclick=()=>start(b.dataset.cat));
  let armed=false;const rb=document.getElementById("reset");
  rb.onclick=()=>{if(!armed){armed=true;rb.textContent="本当に消す";document.getElementById("resetMsg").textContent="もう一度押すと全記録を消去します";return}rec={};save();home()};
}

function start(cat){
  let pool=Q.filter(fmtOK);
  pool=cat==="ALL"?pool:cat==="MISS"?pool.filter(q=>rec[q.id]&&rec[q.id].last===false):pool.filter(q=>q.c===cat);
  if(!pool.length){home();return}
  pool=shuffle(pool);if(S.size&&cat!=="MISS")pool=pool.slice(0,S.size);
  S={...S,view:"quiz",r0:rankOf(mastery().pct),cat,list:pool,i:0,res:[],done:false};
  question();
}

function body(q){
  if(q.f==="S")return `<p class="stem">次の文X・Yについて、その正誤の組合せとして正しいものを選べ。</p>
    <div class="stmts"><div class="stmt"><span class="lb">X</span><span class="tx">${rich(q.X)}</span></div><div class="stmt"><span class="lb">Y</span><span class="tx">${rich(q.Y)}</span></div></div>`;
  if(q.f==="N")return `<p class="stem">${rich(q.p||"次のⅠ〜Ⅲについて、古いものから年代順に正しく配列したものを選べ。")}</p>
    <div class="stmts">${q.i.map((t,k)=>`<div class="stmt"><span class="lb">${ROM[k]}</span><span class="tx">${rich(t)}</span></div>`).join("")}</div>`;
  return `<p class="stem">${rich(q.q)}</p>`;
}

function question(){
  const q=S.list[S.i];S.done=false;app.dataset.cat=q.c;
  const label=S.cat==="ALL"?"全分野ミックス":S.cat==="MISS"?"復習":CATS[S.cat].name;
  S.opts=(q.f==="K"?shuffle(q.o.map((t,k)=>({t,k}))):q.o.map((t,k)=>({t,k})));
  app.innerHTML=`${header()}<div class="qhead"><span>${label}　<span class="num">${S.i+1} / ${S.list.length}</span></span><button class="btn" id="quit" style="padding:4px 12px;font-size:13px">やめる</button></div>
  <div class="bar"><i style="width:${S.i/S.list.length*100}%"></i></div>
  <div class="panel"><div><span class="qno">${q.id}</span><span class="kbd">${CATS[q.c].name}</span><span class="fmt">${FMT[q.f]}</span></div>
    ${body(q)}
    <div class="choices ${q.f==="N"?"six":""}">${S.opts.map((o,n)=>`<button class="ch" id="ch${n}" data-n="${n}"><span class="oval">${n+1}</span><span>${rich(o.t)}</span></button>`).join("")}</div>
    <div id="fb"></div></div>`;
  app.querySelectorAll(".ch").forEach(b=>b.onclick=()=>choose(+b.dataset.n));
  document.getElementById("quit").onclick=()=>{S.view="home";home()};
}

function answerText(q){
  if(q.f==="N"){const o=q.ord.split("").map(d=>+d-1);return `${NO[q.a]}（${o.map(k=>`${rich(q.i[k])}${q.yr?`〈${rich(q.yr[k])}〉`:""}`).join(" → ")}）`}
  return rich(q.o[q.a]);
}
function choose(n){
  if(S.done)return;S.done=true;
  const q=S.list[S.i];const ok=S.opts[n].k===q.a;
  app.querySelectorAll(".ch").forEach((b,m)=>{b.disabled=true;if(S.opts[m].k===q.a)b.classList.add("right")});
  const b=document.getElementById("ch"+n);b.classList.add("sel");if(!ok)b.classList.add("wrong");
  mark(q.id,ok);S.res.push({q,ok,your:S.opts[n].t});
  const last=S.i===S.list.length-1;
  document.getElementById("fb").innerHTML=`<div class="fb ${ok?"ok":"ng"}" role="status">
    <div class="v"><span class="mark">${ok?"○":"×"}</span>${ok?"正解！":"おしい！"}</div>
    <p>正解：<b>${answerText(q)}</b></p><p>${rich(q.e)}</p></div>
    <div class="row" style="margin-top:14px"><button class="btn primary" id="next">${last?"結果を見る":"次の問題へ"}</button></div>`;
  const nx=document.getElementById("next");nx.focus({preventScroll:true});
  nx.onclick=()=>{if(last){result()}else{S.i++;question();window.scrollTo({top:0})}};
}

function qSummary(q){
  if(q.f==="S")return `X：${rich(q.X)}<br>Y：${rich(q.Y)}`;
  if(q.f==="N")return q.i.map((t,k)=>`${ROM[k]} ${rich(t)}`).join("　");
  return rich(q.q);
}
function result(){
  S.view="result";delete app.dataset.cat;
  const n=S.res.length,ok=S.res.filter(r=>r.ok).length,miss=S.res.filter(r=>!r.ok);
  app.innerHTML=header()+`<div class="panel"><h2>結果</h2>
    <div class="score"><span class="big">${ok}</span><span class="num" style="font-size:20px">/ ${n}</span><span class="kbd">正答率 ${Math.round(ok/n*100)}%</span></div>${sessionRank(ok,n,S.r0)}
    ${miss.length?`<ul class="miss">${miss.map(r=>`<li data-cat="${r.q.c}"><div class="kbd"><span class="qno">${r.q.id}</span>${CATS[r.q.c].name}<span class="fmt">${FMT[r.q.f]}</span></div>
      <div class="en">${qSummary(r.q)}</div>
      <div class="x">正解：<b>${answerText(r.q)}</b>　／　あなたの解答：${rich(r.your)}</div><div class="x">${rich(r.q.e)}</div></li>`).join("")}</ul>`:`<p style="font-size:18px;font-weight:900">全問正解！すばらしい！</p>`}
    <div class="row" style="margin-top:16px"><button class="btn primary" id="again">同じ条件でもう一度</button><button class="btn" id="back">トップへ戻る</button></div></div>`;
  document.getElementById("again").onclick=()=>start(S.cat);
  document.getElementById("back").onclick=home;
}

document.addEventListener("keydown",e=>{
  if(S.view!=="quiz")return;
  const n=S.list[S.i].o.length;
  if(/^[1-6]$/.test(e.key)&&!S.done&&+e.key<=n){choose(+e.key-1)}
  else if(e.key==="Enter"&&S.done){const nx=document.getElementById("next");if(nx&&document.activeElement!==nx){e.preventDefault();nx.click()}}
});
home();
</script>

<script>if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}</script>
</body>
</html>
